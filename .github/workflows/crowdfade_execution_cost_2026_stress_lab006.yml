name: crowdfade-execution-cost-2026-stress-lab006
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_EXECUTION_COST_LAB_006/run_2026_stress.py'
      - '.github/workflows/crowdfade_execution_cost_2026_stress_lab006.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas
      - name: Download frozen 2026 seconds and flow
        run: |
          ROOT=labs/CROWDFADE_EXECUTION_COST_LAB_006/stress_data
          mkdir -p "$ROOT"
          cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          echo '067eb5716cd0f6b2268d988c3e12eca65cd2b271cc211f2b3ba9cbc60eece37a  BTCUSDT_sec.csv.zip' | sha256sum -c -
          echo 'b6c80084751305f394270c4b133abbf89a0264634924891251b13b33afbe5e0d  BTCUSDT_flow_2021-01-2026-08.csv.zip' | sha256sum -c -
      - run: python labs/CROWDFADE_EXECUTION_COST_LAB_006/run_2026_stress.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_EXECUTION_COST_LAB_006/output/stress_2026_passive.json
          git commit -m 'research(CrowdFade): LAB006 2026 passive stress' || exit 0
          git push
