name: BTC Retail Ratio Production Lineage High Precision LAB060 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_retail_ratio_production_lineage_high_precision_lab060_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab060:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAB060 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-retail-ratio-production-lineage-high-precision-source-060
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas requests
      - name: Run LAB060
        run: python labs/BTC_RETAIL_RATIO_ARCHIVE_PRODUCTION_LINEAGE_AND_HIGH_PRECISION_SOURCE_DISCOVERY_LAB_060/run_lab.py
      - name: Run non-promoting lineage rounding diagnostic
        run: python labs/BTC_RETAIL_RATIO_ARCHIVE_PRODUCTION_LINEAGE_AND_HIGH_PRECISION_SOURCE_DISCOVERY_LAB_060/posthoc_lineage_rounding_diagnostic.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_RETAIL_RATIO_ARCHIVE_PRODUCTION_LINEAGE_AND_HIGH_PRECISION_SOURCE_DISCOVERY_LAB_060/output
          git commit -m 'Persist BTC retail ratio LAB060 outputs' || true
          git push origin HEAD:lab/btc-retail-ratio-production-lineage-high-precision-source-060
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_RETAIL_RATIO_PRODUCTION_LINEAGE_HIGH_PRECISION_LAB060
          path: labs/BTC_RETAIL_RATIO_ARCHIVE_PRODUCTION_LINEAGE_AND_HIGH_PRECISION_SOURCE_DISCOVERY_LAB_060/output
