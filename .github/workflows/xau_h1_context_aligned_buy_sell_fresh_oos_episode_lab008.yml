name: XAU H1 Context BUY SELL Fresh OOS Episode LAB008

on:
  push:
    paths:
      - '.github/workflows/xau_h1_context_aligned_buy_sell_fresh_oos_episode_lab008.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab008:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LAB_BRANCH: lab/xau-h1-context-aligned-buy-sell-fresh-oos-episode-independence-008
      OUTDIR: labs/XAU_H1_CONTEXT_ALIGNED_BUY_SELL_FRESH_OOS_AND_EPISODE_INDEPENDENCE_LAB_008/output
      POOL: Projects/XAU_Pool/Results/XAU_POOL_SELECTION_LAB_001/v001/Artifacts/pool_excess.parquet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas numpy pyarrow requests
      - name: Download frozen historical M1 and sealed fresh ticks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          gh release download ak47 --repo "${GITHUB_REPOSITORY}" --pattern 'XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv' --dir data
          echo 'db47a0cef1e666fdf27a67a23fcc290eee1bd2be2c651ecd8e080b99bf177b9b  data/XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv' | sha256sum -c -
          gh release download xau --repo "${GITHUB_REPOSITORY}" --pattern 'CAUSAL_XAU_RAW_XAUUSD_20260825.zip' --dir data
          echo '31f9548204fa99c29ce7d09e5b64e01ff75f5e8e3efab6f747cbd410cf34fd2e  data/CAUSAL_XAU_RAW_XAUUSD_20260825.zip' | sha256sum -c -
      - name: Apply frozen router parity hotfixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py')
          s=p.read_text(); patched=re.sub(r'd\.stack(?![A-Za-z0-9_])',"d['stack']",s)
          old="    sm = s.rolling(3,min_periods=3).mean()"
          warm=("    ready=d[['ema200','atr_ratio','rsi14','adx14','range24_ratio','relvol20']].notna().all(axis=1)\n"
                "    s=s.where(ready,np.nan)\n"
                "    sm = s.rolling(3,min_periods=3).mean()")
          if old not in patched: raise SystemExit('LAB001 warmup anchor missing')
          p.write_text(patched.replace(old,warm,1))
          q=Path('labs/CROSS_MARKET_CAUSAL_CONTEXT_CONTINUOUS_SCORE_INTERACTION_LAB_002/run_lab.py')
          qs=q.read_text()
          oldc="    cols = ['available_time','bias','score_expansion','score_pullback','score_reversal','score_range']\n    c = ctx[cols].dropna(subset=['available_time']).sort_values('available_time').reset_index(drop=False)"
          newc="    cols = ['available_time','regime','bias','score_expansion','score_pullback','score_reversal','score_range']\n    c = ctx[cols].dropna(subset=['available_time','regime']).sort_values('available_time').reset_index(drop=False)"
          if oldc not in qs: raise SystemExit('LAB002 join anchor missing')
          q.write_text(qs.replace(oldc,newc,1))
          PY
      - name: Run preregistered LAB008
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          python -m py_compile labs/XAU_H1_CONTEXT_ALIGNED_BUY_SELL_FRESH_OOS_AND_EPISODE_INDEPENDENCE_LAB_008/run_lab.py
          python labs/XAU_H1_CONTEXT_ALIGNED_BUY_SELL_FRESH_OOS_AND_EPISODE_INDEPENDENCE_LAB_008/run_lab.py \
            --canonical-m1 data/XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv \
            --fresh-zip data/CAUSAL_XAU_RAW_XAUUSD_20260825.zip \
            --pool "$POOL" --out "$OUTDIR"
          cat "$OUTDIR/REPORT.md"
      - name: Persist outputs
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py labs/CROSS_MARKET_CAUSAL_CONTEXT_CONTINUOUS_SCORE_INTERACTION_LAB_002/run_lab.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTDIR"
          git diff --cached --quiet || git commit -m 'Persist XAU H1 BUY SELL fresh OOS LAB008 outputs'
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: xau-h1-buy-sell-fresh-oos-lab008
          path: ${{ env.OUTDIR }}
