name: XAU Price-Time Alogical Matrix LAB006

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  lab006:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'XAU ALOGICAL LAB006 TRIGGER')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout frozen main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy numba pyarrow

      - name: Download frozen LAB001 causal bars and labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p LAB001_INPUT Results_XAU_ALOGICAL_LAB006
          gh run download 33067830619 \
            --repo chepigga/ResearchOS \
            --name xau-causal-future-probability-lab001 \
            --dir LAB001_INPUT
          test -s LAB001_INPUT/m1_bidask_bars.parquet
          test -s LAB001_INPUT/causal_labels_m1.parquet
          ls -lh LAB001_INPUT

      - name: Run price-time alogical matrix
        shell: bash
        run: |
          set -euo pipefail
          python research/xau_price_time_alogical_matrix_lab006_v2.py \
            --bars LAB001_INPUT/m1_bidask_bars.parquet \
            --labels LAB001_INPUT/causal_labels_m1.parquet \
            --outdir Results_XAU_ALOGICAL_LAB006

      - name: Print compact outputs
        if: always()
        shell: bash
        run: |
          echo '===== VERDICT ====='
          cat Results_XAU_ALOGICAL_LAB006/verdict.json || true
          echo '===== TOP INVERSION CELLS ====='
          head -n 20 Results_XAU_ALOGICAL_LAB006/top_inversion_cells.csv || true
          echo '===== CANDIDATE TRANSFER ====='
          head -n 30 Results_XAU_ALOGICAL_LAB006/candidate_transfer.csv || true
          echo '===== LOCKED STRATEGY YEARLY ====='
          cat Results_XAU_ALOGICAL_LAB006/locked_strategy_yearly.csv || true

      - name: Build issue summary
        if: always() && github.event_name == 'issues'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out=Path('Results_XAU_ALOGICAL_LAB006')
          lines=['## XAU PRICE×TIME ALOGICAL MATRIX LAB006']
          vp=out/'verdict.json'
          if vp.exists():
              v=json.loads(vp.read_text())
              lines += [
                  f"**Verdict:** `{v.get('verdict')}`",
                  f"**Locked cells before 2026:** {v.get('locked_cells_before_2026')}",
                  f"**Positive locked cells in 2026:** {v.get('locked_cells_positive_in_2026')}",
                  '',
                  '**2026 locked strategy:**',
                  '```json', json.dumps(v.get('final_2026_strategy',{}), indent=2), '```'
              ]
          cp=out/'candidate_transfer.csv'
          if cp.exists():
              c=pd.read_csv(cp)
              c=c[c.get('locked_before_2026', False)==True].head(10)
              if len(c):
                  cols=['cell_id','train_2023_2024_n','train_inverse_mean_R','validation_2025_n','validation_inverse_mean_R','final_2026_n','final_2026_inverse_mean_R','final_2026_pass']
                  lines += ['', '**Locked candidate transfer:**', '```', c[cols].to_string(index=False), '```']
          (out/'issue_comment.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Comment result to trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          if [ -s Results_XAU_ALOGICAL_LAB006/issue_comment.md ]; then
            gh issue comment "$ISSUE_NUMBER" --repo chepigga/ResearchOS --body-file Results_XAU_ALOGICAL_LAB006/issue_comment.md
          fi

      - name: Upload LAB006 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-price-time-alogical-matrix-lab006
          path: Results_XAU_ALOGICAL_LAB006/
          if-no-files-found: warn
          retention-days: 30
