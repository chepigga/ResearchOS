name: U08 BTC true frequency

on:
  push:
    branches: [lab-btc-unified-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u08:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Download frozen data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          test "$(sha256sum btc_5m.zip | awk '{print $1}')" = "13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd"
          curl -L --fail --retry 4 -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' -o lab020_events.csv https://api.github.com/repos/chepigga/ResearchOS/releases/assets/511572043
          test "$(sha256sum lab020_events.csv | awk '{print $1}')" = "6256b824c1e75b7170fa7f70aa4ae021cc44d4522397449eb083a2b310b6bb34"
      - name: Rebuild U05 clock map
        run: python research/btc_unified_lifecycle/u05_market_clock_mapping.py
      - name: Run U08
        run: python research/btc_unified_lifecycle/u08_true_frequency.py
      - uses: actions/upload-artifact@v4
        with:
          name: u08-btc-true-frequency
          path: u08_out/
