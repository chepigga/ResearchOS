name: XAU Exhaustion Reclaim Executable Payoff LAB013

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  lab013:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'XAU EXHAUSTION LAB013 TRIGGER')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow
      - name: Download frozen LAB001 inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p LAB001_INPUT data Results_XAU_EXHAUSTION_LAB013
          gh run download 33067830619 --repo chepigga/ResearchOS --name xau-causal-future-probability-lab001 --dir LAB001_INPUT
          test -s LAB001_INPUT/m1_bidask_bars.parquet
          test -s LAB001_INPUT/causal_labels_m1.parquet
          test -s LAB001_INPUT/audit.json
      - name: Download and verify raw Bid-Ask ticks
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 --progress-bar -o data/xau_raw.zip 'https://github.com/chepigga/ResearchOS/releases/download/xau/CAUSAL_XAU_RAW_XAUUSD_20260825.zip'
          echo '31f9548204fa99c29ce7d09e5b64e01ff75f5e8e3efab6f747cbd410cf34fd2e  data/xau_raw.zip' | sha256sum -c -
      - name: Run LAB013 exact executable test
        run: |
          PYTHONPATH=research python research/xau_exhaustion_reclaim_executable_payoff_lab013.py \
            --bars LAB001_INPUT/m1_bidask_bars.parquet \
            --labels LAB001_INPUT/causal_labels_m1.parquet \
            --audit LAB001_INPUT/audit.json \
            --raw-zip data/xau_raw.zip \
            --outdir Results_XAU_EXHAUSTION_LAB013
      - name: Build issue summary
        if: always() && github.event_name == 'issues'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          o=Path('Results_XAU_EXHAUSTION_LAB013'); lines=['## XAU EXHAUSTION RECLAIM EXECUTABLE PAYOFF LAB013']
          v=o/'verdict.json'
          if v.exists():
            j=json.loads(v.read_text()); lines += [f"**Verdict:** `{j.get('verdict')}`",f"**Forced-exit rows:** {j.get('forced_exit_rows')}",f"**Stable exhaustion events:** {j.get('stable_exhaustion_events')}",f"**Executable signals:** {j.get('unique_executable_signals')}",f"**Candidate configs:** {j.get('candidate_configs')}",f"**Locked pre-2026:** {j.get('locked_pre2026')}",f"**Locked positive 2026:** {j.get('locked_positive_2026')}",'','**Best config:**','```json',json.dumps(j.get('best_config'),indent=2),'```']
          c=o/'candidate_transfer.csv'
          if c.exists():
            d=pd.read_csv(c); cols=[x for x in ['exhaust_cell','payoff','risk_atr_median','train_n','train_mean_R','train_pf','val_n','val_mean_R','val_pf','locked_before_2026','final_n','final_mean_R','final_pf','final_pass'] if x in d.columns]; lines += ['','**Top configs:**','```',d[cols].head(20).to_string(index=False),'```']
          (o/'issue_comment.md').write_text('\n'.join(lines))
          PY
      - name: Comment result to issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: '${{ github.token }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
        run: |
          if [ -s Results_XAU_EXHAUSTION_LAB013/issue_comment.md ]; then gh issue comment "$ISSUE_NUMBER" --repo chepigga/ResearchOS --body-file Results_XAU_EXHAUSTION_LAB013/issue_comment.md; fi
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-exhaustion-reclaim-executable-payoff-lab013
          path: Results_XAU_EXHAUSTION_LAB013/
          if-no-files-found: warn
          retention-days: 30
