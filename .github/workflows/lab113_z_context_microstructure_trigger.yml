name: LAB113 Z Context Microstructure Trigger
on:
  push:
    branches: [lab/lab113-z-context-microstructure-trigger-20261007]
    paths: ['.github/workflows/lab113_z_context_microstructure_trigger.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab113-z-context-microstructure-trigger-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB113
        run: python labs/LAB113_Z_CONTEXT_MICROSTRUCTURE_TRIGGER_20261007/run_lab113.py
      - run: cat lab113_out/LAB113_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab113-z-context-microstructure-trigger
          path: lab113_out
