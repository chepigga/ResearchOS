name: XAU Forced Exit Path Asymmetry Exhaustion LAB012

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  lab012:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'XAU FORCED EXIT LAB012 TRIGGER')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow
      - name: Download frozen LAB001 inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p LAB001_INPUT Results_XAU_FORCED_EXIT_LAB012
          gh run download 33067830619 --repo chepigga/ResearchOS --name xau-causal-future-probability-lab001 --dir LAB001_INPUT
          test -s LAB001_INPUT/m1_bidask_bars.parquet
          test -s LAB001_INPUT/causal_labels_m1.parquet
      - name: Run LAB012
        run: |
          python research/xau_forced_exit_path_asymmetry_and_exhaustion_lab012.py \
            --bars LAB001_INPUT/m1_bidask_bars.parquet \
            --labels LAB001_INPUT/causal_labels_m1.parquet \
            --outdir Results_XAU_FORCED_EXIT_LAB012
      - name: Build issue summary
        if: always() && github.event_name == 'issues'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          o=Path('Results_XAU_FORCED_EXIT_LAB012'); lines=['## XAU FORCED EXIT PATH ASYMMETRY + EXHAUSTION LAB012']
          v=o/'verdict.json'
          if v.exists():
            j=json.loads(v.read_text()); lines += [f"**Verdict:** `{j.get('verdict')}`",f"**Forced-exit rows:** {j.get('forced_exit_rows')}",f"**Path rows:** {j.get('path_rows')}",f"**Exhaustion rows:** {j.get('exhaustion_rows')}",f"**Eligible exhaustion cells pre-2026:** {j.get('eligible_exhaustion_cells_pre2026')}",f"**Stable exhaustion cells pre-2026:** {j.get('stable_exhaustion_cells_pre2026')}"]
          p=o/'path_summary_by_year.csv'
          if p.exists():
            d=pd.read_csv(p); lines += ['','**Path summary sample:**','```',d.head(20).to_string(index=False),'```']
          e=o/'exhaustion_candidates.csv'
          if e.exists():
            d=pd.read_csv(e); lines += ['','**Exhaustion candidates:**','```',d.head(20).to_string(index=False),'```']
          (o/'issue_comment.md').write_text('\n'.join(lines))
          PY
      - name: Comment result to issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: '${{ github.token }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
        run: |
          if [ -s Results_XAU_FORCED_EXIT_LAB012/issue_comment.md ]; then gh issue comment "$ISSUE_NUMBER" --repo chepigga/ResearchOS --body-file Results_XAU_FORCED_EXIT_LAB012/issue_comment.md; fi
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-forced-exit-path-asymmetry-exhaustion-lab012
          path: Results_XAU_FORCED_EXIT_LAB012/
          if-no-files-found: warn
          retention-days: 30
