name: BTC Retail Ratio REST Quantization Recoverability LAB058 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_retail_ratio_rest_quantization_recoverability_lab058_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab058:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAB058 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-retail-ratio-rest-quantization-recoverability-058
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas
      - name: Run LAB058
        run: python labs/BTC_RETAIL_RATIO_REST_QUANTIZATION_ORIGIN_AND_CAUSAL_DECISION_RECOVERABILITY_LAB_058/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_RETAIL_RATIO_REST_QUANTIZATION_ORIGIN_AND_CAUSAL_DECISION_RECOVERABILITY_LAB_058/output
          git commit -m 'Persist BTC retail ratio LAB058 outputs' || true
          git push origin HEAD:lab/btc-retail-ratio-rest-quantization-recoverability-058
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_RETAIL_RATIO_REST_QUANTIZATION_RECOVERABILITY_LAB058
          path: labs/BTC_RETAIL_RATIO_REST_QUANTIZATION_ORIGIN_AND_CAUSAL_DECISION_RECOVERABILITY_LAB_058/output
