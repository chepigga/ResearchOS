          EOF
          while IFS=$'\t' read -r day fid; do
            retry_gdown "$fid" "XAUUSD_raw_ticks_${day}.csv"
          done < files.tsv
      - name: Run LAB010
        run: python research/gc/gc_xau_rev2_q60_q65_frozen_execution_geometry_equity_cost_lab010.py
      - name: Commit LAB010 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/gc/GC_XAU_REV2_Q60_Q65_FROZEN_EXECUTION_GEOMETRY_EQUITY_COST_LAB010.json
          git add research/gc/GC_XAU_REV2_Q60_Q65_FROZEN_EXECUTION_GEOMETRY_EQUITY_COST_LAB010.md
          git add research/gc/GC_XAU_REV2_Q60_Q65_FROZEN_EXECUTION_GEOMETRY_EQUITY_COST_LAB010_GRID.csv
          git add research/gc/GC_XAU_REV2_Q60_Q65_FROZEN_EXECUTION_GEOMETRY_EQUITY_COST_LAB010_LEDGER.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Record frozen Q60 Q65 execution audit LAB010'
            git push origin HEAD:gc-amp-feed-audit-001
          fi
