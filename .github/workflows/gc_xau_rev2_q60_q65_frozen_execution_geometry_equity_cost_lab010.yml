name: GC XAU REV2 Q60 Q65 Frozen Execution Audit LAB010

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/gc_xau_rev2_q60_q65_frozen_execution_geometry_equity_cost_lab010.py'
      - 'research/gc/GC_XAU_REV2_Q60_Q65_FROZEN_EXECUTION_GEOMETRY_EQUITY_COST_LAB010_PREREG.md'
      - '.github/workflows/gc_xau_rev2_q60_q65_frozen_execution_geometry_equity_cost_lab010.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab012:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas gdown
      - name: Compile check
        run: python -m py_compile research/gc/gc_xau_rev2_q60_q65_frozen_execution_geometry_equity_cost_lab010.py
      - name: Download frozen FTMO XAU raw ticks
        shell: bash
        run: |
          set -euo pipefail
          retry_gdown() {
            local fid="$1" out="$2"
            rm -f "$out"
            for attempt in 1 2 3 4 5; do
              echo "gdown attempt $attempt: $out"
              if python -m gdown "$fid" -O "$out" && test -s "$out"; then return 0; fi
              rm -f "$out"
              sleep $((attempt * 12))
            done
            return 1
          }
          mkdir -p research/gc/_lab006_xau
          cd research/gc/_lab006_xau
          cat > files.tsv <<'EOF'
          20260803	1WdMs_DuZGpuRcgUPyFZ4oxMxOjGW--17
          20260804	1TwbVYZGHh3e77Z6MQh7JoumlOcII2ADz
          20260805	1BJ4S-hcUGOe5KHZ9tcMrOPCWZLFcJpLg
          20260806	1XxiVupqOzBpz-4BYGOA1OChyXwAOxlpo
