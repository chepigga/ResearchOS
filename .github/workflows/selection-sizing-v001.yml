name: FXArena Selection Sizing v001

on:
  push:
    branches:
      - agent/selection-sizing-v001
  pull_request:
    branches:
      - main
      - research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy scipy pyarrow
      - name: Discover and download frozen release
        shell: bash
        run: |
          mkdir -p _release_assets selection_sizing_artifact
          gh api repos/${GITHUB_REPOSITORY}/releases --paginate > selection_sizing_artifact/releases_api.json
          TAG=$(python - <<'PY'
          import json
          rs=json.load(open('selection_sizing_artifact/releases_api.json'))
          tags=[r.get('tag_name') for r in rs if '1.1' in (' '.join([str(r.get('tag_name','')),str(r.get('name',''))])).lower()]
          print((tags or [rs[0]['tag_name']])[0])
          PY
          )
          echo "selected_tag=$TAG" > selection_sizing_artifact/selected_release.txt
          gh release download "$TAG" --dir _release_assets
      - name: Inspect full universe
        run: python Projects/FXArena/Labs/SelectionSizing_v001/inspect_universe.py
      - name: Upload full-universe inventory
        uses: actions/upload-artifact@v4
        with:
          name: selection-sizing-universe-inventory
          path: selection_sizing_universe_artifact/
          if-no-files-found: error
