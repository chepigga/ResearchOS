name: FXArena Selection Sizing v001

on:
  push:
    branches:
      - agent/selection-sizing-v001
  pull_request:
    branches:
      - main
      - research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy scipy scikit-learn matplotlib pyarrow
      - name: Download frozen v1.1 release
        shell: bash
        run: |
          mkdir -p _release_assets
          gh api repos/${GITHUB_REPOSITORY}/releases --paginate > releases_api.json
          TAG=$(python - <<'PY'
          import json
          rs=json.load(open('releases_api.json'))
          tags=[r.get('tag_name') for r in rs if '1.1' in (' '.join([str(r.get('tag_name','')),str(r.get('name',''))])).lower()]
          print((tags or [rs[0]['tag_name']])[0])
          PY
          )
          echo "Using release $TAG"
          gh release download "$TAG" --dir _release_assets
      - name: Run frozen laboratory
        shell: bash
        run: |
          set -o pipefail
          mkdir -p FXArena_SelectionSizing_v001_output
          python Projects/FXArena/Labs/SelectionSizing_v001/run_selection_sizing_v001.py 2>&1 | tee FXArena_SelectionSizing_v001_output/RUN_LOG.txt
      - name: Upload laboratory output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FXArena-SelectionSizing-v001-output
          path: FXArena_SelectionSizing_v001_output/
          if-no-files-found: error
