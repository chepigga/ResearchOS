name: BTC Reversal ON OFF Regime Abstention LAB008 Runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/btc_reversal_on_off_regime_abstention_lab008_runner.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab008:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-reversal-edge-on-off-regime-router-abstention-008
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen LAB008
        run: python labs/BTC_REVERSAL_EDGE_ON_OFF_REGIME_AND_ROUTER_ABSTENTION_LAB_008/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_REVERSAL_EDGE_ON_OFF_REGIME_AND_ROUTER_ABSTENTION_LAB_008/output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist BTC reversal ON OFF regime abstention LAB008 outputs'
          git push origin HEAD:lab/btc-reversal-edge-on-off-regime-router-abstention-008
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-on-off-regime-abstention-lab008
          path: labs/BTC_REVERSAL_EDGE_ON_OFF_REGIME_AND_ROUTER_ABSTENTION_LAB_008/output
