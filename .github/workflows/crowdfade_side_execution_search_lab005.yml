name: crowdfade-side-execution-search-lab005
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/run_side_execution_search.py'
      - '.github/workflows/crowdfade_side_execution_search_lab005.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas numba
      - name: Download frozen flow and 2021-2025 M5
        run: |
          ROOT=labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/data
          mkdir -p "$ROOT/klines"
          cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          echo 'b6c80084751305f394270c4b133abbf89a0264634924891251b13b33afbe5e0d  BTCUSDT_flow_2021-01-2026-08.csv.zip' | sha256sum -c -
          cd klines
          for Y in 2021 2022 2023 2024 2025; do
            for M in $(seq -w 1 12); do
              F=BTCUSDT-5m-${Y}-${M}.zip
              wget -q "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/5m/$F" -O "$F"
            done
          done
      - name: Run side-specific execution search
        run: python labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/run_side_execution_search.py
      - name: Persist output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+chepigga@users.noreply.github.com'
          git add labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/output/side_execution_search.json
          git commit -m 'research(CrowdFade): persist side-specific execution search' || exit 0
          git push
