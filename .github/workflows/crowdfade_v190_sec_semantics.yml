name: CrowdFade v1.90 Seconds Semantics Matrix
on:
  push:
    branches:
      - lab/crowdfade-v190-historical-replay-001
    paths:
      - '.github/workflows/crowdfade_v190_sec_semantics.yml'
permissions:
  contents: write
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-v190-historical-replay-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download frozen seconds and flow data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/secdata
          cd labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/secdata
          curl -L --fail --retry 3 -o BTCUSDT_sec.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          echo '067eb5716cd0f6b2268d988c3e12eca65cd2b271cc211f2b3ba9cbc60eece37a  BTCUSDT_sec.csv.zip' | sha256sum -c -
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          echo 'b6c80084751305f394270c4b133abbf89a0264634924891251b13b33afbe5e0d  BTCUSDT_flow_2021-01-2026-08.csv.zip' | sha256sum -c -
      - name: Run execution-semantics matrix
        run: python labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/run_sec_semantics_matrix.py
      - name: Persist outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/semantics_output
          git commit -m 'research(CrowdFade): persist seconds execution-semantics matrix' || true
          git push origin HEAD:lab/crowdfade-v190-historical-replay-001
