name: crowdfade-v200-fixed-entry-trailing-lab051

on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_V200_FIXED_ENTRY_TRAILING_LAB_051/**'
      - '.github/workflows/crowdfade_v200_fixed_entry_trailing_lab051.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}

    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas numba

      - name: Download frozen research inputs
        run: |
          ROOT=labs/CROWDFADE_V200_FIXED_ENTRY_TRAILING_LAB_051/data
          mkdir -p "$ROOT/hist_1m"
          cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          cd hist_1m
          for Y in 2021 2022 2023 2024 2025; do
            for M in $(seq -w 1 12); do
              F=BTCUSDT-1m-${Y}-${M}.zip
              wget -q "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1m/$F" -O "$F"
            done
          done

      - name: Run LAB051
        run: python labs/CROWDFADE_V200_FIXED_ENTRY_TRAILING_LAB_051/run.py

      - name: Commit LAB051 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_V200_FIXED_ENTRY_TRAILING_LAB_051/output
          git commit -m 'research(CrowdFade): LAB051 V200 fixed-entry trailing results' || exit 0
          git push
