name: BTC Futures Spot Divergence OI LAB034 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_futures_spot_divergence_oi_lab034_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab034:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-futures-retail-crowding-x-spot-flow-divergence-oi-profitability-map-034
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas scipy requests
      - name: Run frozen LAB034
        run: python labs/BTC_FUTURES_RETAIL_CROWDING_X_SPOT_FLOW_DIVERGENCE_AND_OI_PROFITABILITY_MAP_LAB_034/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_FUTURES_RETAIL_CROWDING_X_SPOT_FLOW_DIVERGENCE_AND_OI_PROFITABILITY_MAP_LAB_034/output
          git commit -m 'Persist BTC futures crowding x spot divergence OI LAB034 outputs' || true
          git push origin HEAD:lab/btc-futures-retail-crowding-x-spot-flow-divergence-oi-profitability-map-034
      - uses: actions/upload-artifact@v4
        with:
          name: btc-futures-spot-divergence-oi-lab034
          path: labs/BTC_FUTURES_RETAIL_CROWDING_X_SPOT_FLOW_DIVERGENCE_AND_OI_PROFITABILITY_MAP_LAB_034/output
