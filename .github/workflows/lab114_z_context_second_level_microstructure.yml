name: LAB114 Z Context Second-Level Microstructure
on:
  push:
    branches: [lab/lab114-z-context-second-level-microstructure-20261008]
    paths: ['.github/workflows/lab114_z_context_second_level_microstructure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab114-z-context-second-level-microstructure-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_sec.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB114
        run: python labs/LAB114_Z_CONTEXT_SECOND_LEVEL_MICROSTRUCTURE_20261008/run_lab114.py
      - run: cat lab114_out/LAB114_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab114-z-context-second-level-microstructure
          path: lab114_out

