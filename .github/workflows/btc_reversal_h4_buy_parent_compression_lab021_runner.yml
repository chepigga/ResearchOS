name: BTC Reversal H4 BUY Parent Compression LAB021 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_reversal_h4_buy_parent_compression_lab021_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab021:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-reversal-h4-buy-parent-range-compression-m15-response-scale-021
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Run frozen LAB021
        run: python labs/BTC_REVERSAL_H4_BUY_PARENT_RANGE_COMPRESSION_AND_M15_RESPONSE_SCALE_LAB_021/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_REVERSAL_H4_BUY_PARENT_RANGE_COMPRESSION_AND_M15_RESPONSE_SCALE_LAB_021/output
          git commit -m 'Persist BTC reversal H4 BUY parent compression LAB021 outputs' || true
          git pull --rebase origin lab/btc-reversal-h4-buy-parent-range-compression-m15-response-scale-021 || true
          git push origin HEAD:lab/btc-reversal-h4-buy-parent-range-compression-m15-response-scale-021
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-h4-buy-parent-compression-lab021
          path: labs/BTC_REVERSAL_H4_BUY_PARENT_RANGE_COMPRESSION_AND_M15_RESPONSE_SCALE_LAB_021/output
