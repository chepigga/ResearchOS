name: CrowdFade v1.90 FTMO Tick Inspect
on:
  push:
    branches:
      - lab/crowdfade-v190-historical-replay-001
    paths:
      - '.github/workflows/crowdfade_v190_ftmo_tick_inspect.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-v190-historical-replay-001
          fetch-depth: 0
      - name: Download Aug FTMO ticks and inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/ftmo_inspect
          cd labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/ftmo_inspect
          curl -L --fail --retry 3 -o ticks.zip https://github.com/chepigga/ResearchOS/releases/download/btc/TickExport_BTCUSD_2026-08.csv.zip
          echo 'bc9bb004f4821f2d12a62ac784f62a1f55ab5e8982c1fb6a06f4140ed8b7288a  ticks.zip' | sha256sum -c -
          unzip -l ticks.zip > ZIP_LIST.txt
          MEMBER=$(unzip -Z1 ticks.zip | head -n 1)
          unzip -p ticks.zip "$MEMBER" | head -n 8 > HEAD.txt || true
      - name: Persist inspect
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/ftmo_inspect/ZIP_LIST.txt labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/ftmo_inspect/HEAD.txt
          git commit -m 'research(CrowdFade): inspect FTMO BTCUSD tick format' || true
          git push origin HEAD:lab/crowdfade-v190-historical-replay-001
