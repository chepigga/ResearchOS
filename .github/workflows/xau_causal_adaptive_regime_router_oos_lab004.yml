name: XAU Causal Adaptive Regime Router OOS LAB004

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lab004:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'XAU CAUSAL LAB004 TRIGGER')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout frozen main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn

      - name: Download LAB001 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p LAB001_INPUT Results_XAU_CAUSAL_LAB004
          gh run download 33067830619 \
            --repo chepigga/ResearchOS \
            --name xau-causal-future-probability-lab001 \
            --dir LAB001_INPUT
          ls -lh LAB001_INPUT
          test -s LAB001_INPUT/m1_bidask_bars.parquet
          test -s LAB001_INPUT/causal_labels_m1.parquet

      - name: Run adaptive regime router walk-forward
        shell: bash
        run: |
          set -euo pipefail
          python research/xau_causal_adaptive_regime_router_oos_lab004.py \
            --bars LAB001_INPUT/m1_bidask_bars.parquet \
            --labels LAB001_INPUT/causal_labels_m1.parquet \
            --outdir Results_XAU_CAUSAL_LAB004

      - name: Print compact outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '===== ROUTER SUMMARY ====='
          cat Results_XAU_CAUSAL_LAB004/router_summary.csv || true
          echo '===== YEARLY ====='
          cat Results_XAU_CAUSAL_LAB004/router_yearly_summary.csv || true
          echo '===== MONTHLY DECISIONS ====='
          cat Results_XAU_CAUSAL_LAB004/monthly_router_decisions.csv || true
          echo '===== VERDICT ====='
          cat Results_XAU_CAUSAL_LAB004/verdict.json || true

      - name: Upload LAB004 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-causal-adaptive-regime-router-oos-lab004
          path: Results_XAU_CAUSAL_LAB004/
          if-no-files-found: warn
          retention-days: 30
