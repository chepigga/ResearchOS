name: LAB107B Early Fail
on:
  push:
    branches: [lab/lab107b-early-fail-20261007]
    paths: ['.github/workflows/lab107b_early_fail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab107b-early-fail-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB107B
        run: python labs/LAB107B_EARLY_FAIL_20261007/run_lab107b.py
      - run: cat lab107b_out/LAB107B_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab107b-early-fail
          path: lab107b_out
