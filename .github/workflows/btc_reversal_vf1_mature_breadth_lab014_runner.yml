name: BTC Reversal VF1 Breadth LAB014 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_reversal_vf1_mature_breadth_lab014_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab014:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-reversal-vf1-mature-selector-parent-breadth-transfer-014
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen LAB014
        run: python labs/BTC_REVERSAL_VF1_MATURE_SELECTOR_AND_PARENT_EVENT_BREADTH_TRANSFER_LAB_014/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_REVERSAL_VF1_MATURE_SELECTOR_AND_PARENT_EVENT_BREADTH_TRANSFER_LAB_014/output
          git commit -m 'Persist BTC reversal VF1 breadth LAB014 outputs' || true
          git push origin HEAD:lab/btc-reversal-vf1-mature-selector-parent-breadth-transfer-014
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-vf1-breadth-lab014
          path: labs/BTC_REVERSAL_VF1_MATURE_SELECTOR_AND_PARENT_EVENT_BREADTH_TRANSFER_LAB_014/output
