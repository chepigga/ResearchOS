name: CrowdFade LAB064 volatility regime

on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_CF191G_CAUSAL_VOLATILITY_REGIME_LAB_064/**'
      - '.github/workflows/crowdfade-lab064.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab064:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q numpy pandas numba scikit-learn tabulate
      - name: Download frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          LAB="labs/CROWDFADE_CF191G_CAUSAL_VOLATILITY_REGIME_LAB_064"
          mkdir -p "$LAB/data/hist_1m"
          curl -fL --retry 5 --retry-delay 3 -o "$LAB/data/BTCUSDT_flow_2021-01-2026-08.csv.zip" "https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip"
          curl -fL --retry 5 --retry-delay 3 -o "$LAB/data/BTCUSDT_sec.csv.zip" "https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip"
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          import time
          root=Path("labs/CROWDFADE_CF191G_CAUSAL_VOLATILITY_REGIME_LAB_064/data/hist_1m")
          base="https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1m"
          for y in range(2021,2026):
              for m in range(1,13):
                  name=f"BTCUSDT-1m-{y}-{m:02d}.zip";p=root/name
                  for attempt in range(5):
                      try:urlretrieve(f"{base}/{name}",p);break
                      except Exception:
                          if p.exists():p.unlink()
                          if attempt==4:raise
                          time.sleep(2+attempt)
          PY
      - name: Run LAB064
        run: python labs/CROWDFADE_CF191G_CAUSAL_VOLATILITY_REGIME_LAB_064/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: CrowdFade-LAB064-volatility
          path: labs/CROWDFADE_CF191G_CAUSAL_VOLATILITY_REGIME_LAB_064/output/
          retention-days: 30
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "ResearchOS Lab Runner"
          git config user.email "researchos-lab@users.noreply.github.com"
          git add labs/CROWDFADE_CF191G_CAUSAL_VOLATILITY_REGIME_LAB_064/output/
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "lab(CrowdFade): record LAB064 volatility results"
            git pull --rebase origin lab/crowdfade-execution-5y-positive-005
            git push origin HEAD:lab/crowdfade-execution-5y-positive-005
          fi
