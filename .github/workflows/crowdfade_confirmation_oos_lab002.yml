name: CrowdFade Confirmation Entry Causal OOS LAB002
on:
  push:
    branches:
      - lab/crowdfade-confirmation-entry-causal-oos-002
    paths:
      - '.github/workflows/crowdfade_confirmation_oos_lab002.yml'
      - 'labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/**'
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-confirmation-entry-causal-oos-002
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download frozen BTC seconds and flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/data
          cd labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/data
          curl -L --fail --retry 3 -o BTCUSDT_sec.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          echo '067eb5716cd0f6b2268d988c3e12eca65cd2b271cc211f2b3ba9cbc60eece37a  BTCUSDT_sec.csv.zip' | sha256sum -c -
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          echo 'b6c80084751305f394270c4b133abbf89a0264634924891251b13b33afbe5e0d  BTCUSDT_flow_2021-01-2026-08.csv.zip' | sha256sum -c -
      - name: Run LAB002
        run: python labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/run_lab.py
      - name: Persist outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/output
          git commit -m 'research(CrowdFade): persist LAB002 results' || true
          git push origin HEAD:lab/crowdfade-confirmation-entry-causal-oos-002
      - uses: actions/upload-artifact@v4
        with:
          name: crowdfade-confirmation-entry-causal-oos-lab002
          path: labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/output
