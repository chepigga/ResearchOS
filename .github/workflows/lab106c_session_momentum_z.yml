name: LAB106C Session Momentum + Z
on:
  push:
    branches: [lab/lab106c-session-momentum-z-20261007]
    paths: ['.github/workflows/lab106c_session_momentum_z.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab106c-session-momentum-z-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB106C
        run: python labs/LAB106C_SESSION_MOMENTUM_Z_20261007/run_lab106c.py
      - run: cat lab106c_out/LAB106C_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab106c-session-momentum-z
          path: lab106c_out
