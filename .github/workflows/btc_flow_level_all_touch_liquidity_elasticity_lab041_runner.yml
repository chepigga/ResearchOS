name: BTC Flow Level All-Touch Liquidity Elasticity LAB041 Runner

on:
  push:
    paths:
      - '.github/workflows/btc_flow_level_all_touch_liquidity_elasticity_lab041_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab041:
    runs-on: ubuntu-latest
    env:
      LAB_BRANCH: lab/btc-flow-level-all-touch-directional-liquidity-elasticity-without-high-volume-gate-041
      LAB_DIR: labs/BTC_FLOW_LEVEL_ALL_TOUCH_DIRECTIONAL_LIQUIDITY_ELASTICITY_WITHOUT_HIGH_VOLUME_GATE_LAB_041
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas scipy
      - name: Run frozen LAB041
        run: python "$LAB_DIR/run_lab.py"
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAB_DIR/output"
          git diff --cached --quiet || git commit -m "Persist BTC all-touch liquidity elasticity LAB041 outputs"
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-flow-level-all-touch-liquidity-elasticity-lab041
          path: ${{ env.LAB_DIR }}/output
