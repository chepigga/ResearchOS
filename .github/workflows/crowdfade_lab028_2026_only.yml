name: crowdfade-lab028-2026-only

on:
  workflow_dispatch:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - '.github/workflows/crowdfade_lab028_2026_only.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas numba
      - name: Download 2026 seconds stress data
        run: |
          ROOT=labs/CROWDFADE_V190_EXIT_ON_V200_ENTRY_LAB_028/stress_data
          mkdir -p "$ROOT"
          cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
      - name: Run 2026 LAB028
        run: python labs/CROWDFADE_V190_EXIT_ON_V200_ENTRY_LAB_028/run_2026.py
      - name: Commit 2026 output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_V190_EXIT_ON_V200_ENTRY_LAB_028/output
          git commit -m 'research(CrowdFade): refresh LAB028 2026 results' || exit 0
          git push
