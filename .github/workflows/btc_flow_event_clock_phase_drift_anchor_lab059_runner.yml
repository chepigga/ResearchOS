name: BTC FLOW Event Clock Phase Drift Anchor LAB059 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_flow_event_clock_phase_drift_anchor_lab059_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab059:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAB059 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-flow-event-clock-phase-drift-anchor-059
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas
      - name: Apply runtime-only serializer hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('labs/BTC_FLOW_EVENT_CLOCK_PHASE_DRIFT_AND_CANONICAL_ANCHOR_RECOVERABILITY_LAB_059/run_lab.py')
          s = p.read_text()
          old = "    if isinstance(x, pd.Timestamp): return x.isoformat()\n    return x\n"
          new = "    if isinstance(x, (np.bool_,)): return bool(x)\n    if isinstance(x, pd.Timestamp): return x.isoformat()\n    if x is pd.NaT: return None\n    return str(x)\n"
          if old not in s:
              raise SystemExit('serializer patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run LAB059
        run: python labs/BTC_FLOW_EVENT_CLOCK_PHASE_DRIFT_AND_CANONICAL_ANCHOR_RECOVERABILITY_LAB_059/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_FLOW_EVENT_CLOCK_PHASE_DRIFT_AND_CANONICAL_ANCHOR_RECOVERABILITY_LAB_059/output
          git commit -m 'Persist BTC FLOW clock LAB059 outputs' || true
          git push origin HEAD:lab/btc-flow-event-clock-phase-drift-anchor-059
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_FLOW_EVENT_CLOCK_PHASE_DRIFT_ANCHOR_LAB059
          path: labs/BTC_FLOW_EVENT_CLOCK_PHASE_DRIFT_AND_CANONICAL_ANCHOR_RECOVERABILITY_LAB_059/output
