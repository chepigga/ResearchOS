name: BTC SHORT ACCEPT25 Adverse Recovery Sequence LAB052 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_short_accept25_adverse_recovery_sequence_lab052_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab052:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen LAB052 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-short-accept25-adverse-first-recovery-vs-persistent-failure-sequence-052
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas scipy requests
      - name: Run frozen LAB052
        run: python labs/BTC_SHORT_ACCEPT25_ADVERSE_FIRST_RECOVERY_VS_PERSISTENT_FAILURE_SEQUENCE_LAB_052/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_SHORT_ACCEPT25_ADVERSE_FIRST_RECOVERY_VS_PERSISTENT_FAILURE_SEQUENCE_LAB_052/output
          git commit -m 'Persist BTC SHORT adverse recovery sequence LAB052 outputs' || true
          git push origin HEAD:lab/btc-short-accept25-adverse-first-recovery-vs-persistent-failure-sequence-052
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_SHORT_ACCEPT25_ADVERSE_RECOVERY_SEQUENCE_LAB052
          path: labs/BTC_SHORT_ACCEPT25_ADVERSE_FIRST_RECOVERY_VS_PERSISTENT_FAILURE_SEQUENCE_LAB_052/output
