name: SELL CORE 010 Data Audit
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths:
      - '.github/workflows/sell-core-010-data-audit.yml'
      - 'research/btc_unified_lifecycle/sell_core_010_autonomous_funding_q4_state.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Download frozen BTC assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/chepigga/ResearchOS/releases/assets/511572302 -H 'Accept: application/octet-stream' > binance_btc_funding.csv
          gh api /repos/chepigga/ResearchOS/releases/assets/511572318 -H 'Accept: application/octet-stream' > binance_btc_flow.csv
          gh api /repos/chepigga/ResearchOS/releases/assets/511572348 -H 'Accept: application/octet-stream' > binance_flow.py
          gh api /repos/chepigga/ResearchOS/releases/assets/511572071 -H 'Accept: application/octet-stream' > BTC_FINDINGS_2026-08-10.md
          sha256sum binance_btc_funding.csv binance_btc_flow.csv binance_flow.py BTC_FINDINGS_2026-08-10.md
      - name: Audit coverage and frozen definitions
        run: |
          python - <<'PY'
          import pandas as pd
          for fn in ['binance_btc_funding.csv','binance_btc_flow.csv']:
              df=pd.read_csv(fn)
              print('\nFILE',fn)
              print('shape',df.shape)
              print('columns',list(df.columns))
              for c in df.columns:
                  lc=c.lower()
                  if any(k in lc for k in ['time','date','timestamp']):
                      x=pd.to_datetime(df[c],errors='coerce',utc=True)
                      if x.notna().sum(): print('timecol',c,'valid',x.notna().sum(),'min',x.min(),'max',x.max())
          PY
          echo '--- RV / volatility references in frozen findings ---'
          grep -nEi 'RV168|RV_168|realized vol|realized volatility|168h|168' BTC_FINDINGS_2026-08-10.md || true
          echo '--- funding references in frozen findings ---'
          grep -nEi 'funding|Q4|Q1' BTC_FINDINGS_2026-08-10.md || true
