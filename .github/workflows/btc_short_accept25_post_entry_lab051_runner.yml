name: BTC SHORT ACCEPT25 Post-Entry LAB051 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_short_accept25_post_entry_lab051_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab051:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen LAB051 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-short-accept25-post-entry-first-passage-early-failure-state-051
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas scipy
      - name: Run frozen LAB051
        run: python labs/BTC_SHORT_ACCEPT25_POST_ENTRY_FIRST_PASSAGE_AND_EARLY_FAILURE_STATE_LAB_051/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_SHORT_ACCEPT25_POST_ENTRY_FIRST_PASSAGE_AND_EARLY_FAILURE_STATE_LAB_051/output
          git commit -m 'Persist BTC SHORT ACCEPT25 post-entry LAB051 outputs' || true
          git push origin HEAD:lab/btc-short-accept25-post-entry-first-passage-early-failure-state-051
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_SHORT_ACCEPT25_POST_ENTRY_LAB051
          path: labs/BTC_SHORT_ACCEPT25_POST_ENTRY_FIRST_PASSAGE_AND_EARLY_FAILURE_STATE_LAB_051/output
