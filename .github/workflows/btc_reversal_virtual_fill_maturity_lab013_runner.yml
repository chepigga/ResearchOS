name: BTC Reversal Virtual Fill Maturity LAB013 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_reversal_virtual_fill_maturity_lab013_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab013:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-reversal-episode-causal-virtual-fill-maturity-late-reentry-transfer-013
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen LAB013
        run: python labs/BTC_REVERSAL_EPISODE_CAUSAL_VIRTUAL_FILL_MATURITY_AND_LATE_REENTRY_TRANSFER_LAB_013/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_REVERSAL_EPISODE_CAUSAL_VIRTUAL_FILL_MATURITY_AND_LATE_REENTRY_TRANSFER_LAB_013/output
          git commit -m 'Persist BTC reversal virtual-fill maturity LAB013 outputs' || true
          git push origin HEAD:lab/btc-reversal-episode-causal-virtual-fill-maturity-late-reentry-transfer-013
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-virtual-fill-maturity-lab013
          path: labs/BTC_REVERSAL_EPISODE_CAUSAL_VIRTUAL_FILL_MATURITY_AND_LATE_REENTRY_TRANSFER_LAB_013/output
