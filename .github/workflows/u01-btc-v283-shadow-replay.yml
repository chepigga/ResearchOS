name: U01 BTC v283 shadow replay
on:
  push:
    branches: [lab-btc-unified-lifecycle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Download frozen BTC M1
        run: |
          curl -L --fail --retry 3 -o btc_1m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_1m.zip
          test "$(sha256sum btc_1m.zip | awk '{print $1}')" = "4339abbd8d23a0ee84afa4187a41be2fd41d219060e1751053b152757be9a7ea"
      - name: Run shadow scanner
        run: |
          python research/btc_unified_lifecycle/u01_v283_shadow_replay.py --btc-1m btc_1m.zip --outdir u01_shadow
          cat u01_shadow/u01_v283_shadow_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: u01-v283-shadow
          path: u01_shadow/
