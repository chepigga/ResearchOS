name: BTC Reversal P975 T25 + Second Parent LAB015 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_reversal_p975_t25_second_parent_lab015_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab015:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-reversal-p975-t25-confirmation-second-parent-family-discovery-015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen LAB015
        run: python labs/BTC_REVERSAL_P975_T25_CONFIRMATION_AND_SECOND_PARENT_FAMILY_DISCOVERY_LAB_015/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_REVERSAL_P975_T25_CONFIRMATION_AND_SECOND_PARENT_FAMILY_DISCOVERY_LAB_015/output
          git commit -m 'Persist BTC reversal LAB015 outputs' || true
          git push origin HEAD:lab/btc-reversal-p975-t25-confirmation-second-parent-family-discovery-015
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-p975-t25-second-parent-lab015
          path: labs/BTC_REVERSAL_P975_T25_CONFIRMATION_AND_SECOND_PARENT_FAMILY_DISCOVERY_LAB_015/output
