name: crowdfade-directional-edge-lab009
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths: ['labs/CROWDFADE_DIRECTIONAL_EDGE_MFE_MAE_LAB_009/**','.github/workflows/crowdfade_directional_edge_lab009.yml']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas
      - name: Download frozen seconds and flow
        run: |
          ROOT=labs/CROWDFADE_DIRECTIONAL_EDGE_MFE_MAE_LAB_009/data;mkdir -p "$ROOT";cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
      - run: python labs/CROWDFADE_DIRECTIONAL_EDGE_MFE_MAE_LAB_009/run.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_DIRECTIONAL_EDGE_MFE_MAE_LAB_009/output
          git commit -m 'research(CrowdFade): LAB009 MFE MAE right-tail audit' || exit 0
          git push
