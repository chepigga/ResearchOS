name: CrowdFade LAB093 asymmetric frontier
on:
  workflow_dispatch:
  push:
    branches: [lab/crowdfade-execution-5y-positive-005]
    paths:
      - labs/CROWDFADE_LAB093_ASYMMETRIC_FRONTIER/**
      - .github/workflows/crowdfade-lab093.yml
permissions:
  contents: write
jobs:
  lab093:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas tabulate
      - name: Run LAB093
        run: python labs/CROWDFADE_LAB093_ASYMMETRIC_FRONTIER/run.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name ResearchOS
          git config user.email researchos@example.com
          git add labs/CROWDFADE_LAB093_ASYMMETRIC_FRONTIER/output/
          git diff --cached --quiet || (git commit -m "LAB093 outputs" && git push origin HEAD:lab/crowdfade-execution-5y-positive-005)
