name: crowdfade-2026-side-router-lab005
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/run_2026_side_router.py'
      - '.github/workflows/crowdfade_2026_side_router_lab005.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download frozen 2026 seconds and flow
        run: |
          ROOT=labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/stress_data
          mkdir -p "$ROOT" && cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          echo '067eb5716cd0f6b2268d988c3e12eca65cd2b271cc211f2b3ba9cbc60eece37a  BTCUSDT_sec.csv.zip' | sha256sum -c -
          echo 'b6c80084751305f394270c4b133abbf89a0264634924891251b13b33afbe5e0d  BTCUSDT_flow_2021-01-2026-08.csv.zip' | sha256sum -c -
      - name: Run side-router stress
        run: python labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/run_2026_side_router.py
      - name: Persist output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+chepigga@users.noreply.github.com'
          git add labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/output/stress_2026_side_router.json
          git commit -m 'research(CrowdFade): persist 2026 side-router stress' || exit 0
          git push
