name: SELL CORE 002 Inspect Prior Failed Response
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths: ['.github/workflows/sell-core-002-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas
      - name: Download prior frozen SELL ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/chepigga/ResearchOS/releases/assets/511572403 -H 'Accept: application/octet-stream' > prior.csv
          test "$(sha256sum prior.csv|awk '{print $1}')" = "833989e64adbe5d28f75c6cff84f2fdf1b2dc9171a41fa59adce4327f6da9729"
      - name: Inspect
        run: |
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('prior.csv')
          print('shape',x.shape)
          print('columns',list(x.columns))
          print(x.head(10).to_string(index=False))
          print('\nDTYPES\n',x.dtypes.to_string())
          for c in x.columns:
            if x[c].dtype=='object' and x[c].nunique(dropna=True)<30:
              print('\nVALUE_COUNTS',c); print(x[c].value_counts(dropna=False).head(30).to_string())
          PY
