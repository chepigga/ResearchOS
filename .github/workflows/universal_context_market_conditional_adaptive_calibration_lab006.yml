name: Universal Context Market Conditional Adaptive Calibration LAB006
on:
  push:
    branches:
      - lab/universal-context-market-conditional-adaptive-calibration-006
    paths:
      - 'labs/UNIVERSAL_CONTEXT_MARKET_CONDITIONAL_ADAPTIVE_CALIBRATION_LAB_006/**'
      - '.github/workflows/universal_context_market_conditional_adaptive_calibration_lab006.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab006:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas numpy requests tabulate
      - name: Fetch fixed XAU and EUR datasets
        run: |
          curl -L --fail --retry 3 -o /tmp/XAUUSD_M1.csv https://github.com/chepigga/ResearchOS/releases/download/ak47/XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv
          echo 'db47a0cef1e666fdf27a67a23fcc290eee1bd2be2c651ecd8e080b99bf177b9b  /tmp/XAUUSD_M1.csv' | sha256sum -c -
          curl -L --fail --retry 3 -o /tmp/EURUSD_M1.csv https://github.com/chepigga/ResearchOS/releases/download/v1.0/EURUSD_M1_202301020005_202607172354.csv
          echo '09b872ae42af24ca67c525754da3266e21d96833fc9d66fe8bbdb1dac39836f5  /tmp/EURUSD_M1.csv' | sha256sum -c -
      - name: Run frozen LAB006
        run: |
          python labs/UNIVERSAL_CONTEXT_MARKET_CONDITIONAL_ADAPTIVE_CALIBRATION_LAB_006/run_lab.py \
            --xau /tmp/XAUUSD_M1.csv \
            --eur /tmp/EURUSD_M1.csv \
            --out labs/UNIVERSAL_CONTEXT_MARKET_CONDITIONAL_ADAPTIVE_CALIBRATION_LAB_006/output
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/UNIVERSAL_CONTEXT_MARKET_CONDITIONAL_ADAPTIVE_CALIBRATION_LAB_006/output
          if ! git diff --cached --quiet; then
            git commit -m 'Persist universal context adaptive calibration LAB006 outputs'
            git push origin HEAD:lab/universal-context-market-conditional-adaptive-calibration-006
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: universal-context-market-conditional-adaptive-calibration-lab006
          path: labs/UNIVERSAL_CONTEXT_MARKET_CONDITIONAL_ADAPTIVE_CALIBRATION_LAB_006/output
