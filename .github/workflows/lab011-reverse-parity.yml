name: LAB011 reverse parity
on:
  pull_request:
    branches: [lab-btc-unified-lifecycle]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Download frozen sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          test "$(sha256sum btc_5m.zip | awk '{print $1}')" = "13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd"
          curl -L --fail --retry 4 -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' -o lab020_events.csv https://api.github.com/repos/chepigga/ResearchOS/releases/assets/511572043
          test "$(sha256sum lab020_events.csv | awk '{print $1}')" = "6256b824c1e75b7170fa7f70aa4ae021cc44d4522397449eb083a2b310b6bb34"
          mkdir -p m5 && unzip -q btc_5m.zip -d m5
      - name: Locked N72 reverse parity
        run: |
          python - <<'PY'
          import glob, pandas as pd, numpy as np
          m=pd.concat([pd.read_csv(f) for f in glob.glob('m5/**/*.csv',recursive=True)],ignore_index=True)
          tc='time' if 'time' in m.columns else m.columns[0]
          m[tc]=pd.to_datetime(m[tc],utc=True).dt.tz_convert(None)
          m=m.sort_values(tc).drop_duplicates(tc).reset_index(drop=True)
          for c in ['open','high','low','close','taker_ratio']:
              m[c]=pd.to_numeric(m[c],errors='coerce')
          m['tr15']=m['taker_ratio'].rolling(3,min_periods=3).mean()
          m['prev_high']=m['high'].shift(1)
          m['breakout_buy']=(m['close']>m['prev_high']) & (m['tr15']<0.50) & (m[tc].dt.hour!=19)
          e=pd.read_csv('lab020_events.csv'); e['entry_time']=pd.to_datetime(e.entry_time)
          p=e[(e.side=='BUY')&(e.H4_ST_AGE_BARS>58)&(e.H4_ST_DIR==-1)].copy().sort_values('entry_time')
          rows=[]
          for r in p.itertuples(index=False):
              t0=r.entry_time
              z=m[(m[tc]>=t0)&(m[tc]<=t0+pd.Timedelta(hours=72))]
              b=z[(z.breakout_buy)&(z[tc]<=t0+pd.Timedelta(minutes=90))]
              if len(b)==0:
                  continue
              q=b.iloc[0]; bt=q[tc]; level=float(q.prev_high); bh=float(q.high)
              # accepted retest search remains 12h as in the initial recovered N72 selection
              a12=z[(z[tc]>bt)&(z[tc]<=bt+pd.Timedelta(hours=12))]
              rr=a12[(a12.low<=level)&(a12.close>=level)]
              if len(rr)==0:
                  continue
              rt=rr.iloc[0][tc]
              # second-push proxy: first close above breakout-bar high, audited at multiple horizons
              rec=dict(entry_time=t0,breakout_time=bt,retest_time=rt,breakout_level=level,breakout_high=bh,
                       retest_delay_min=(rt-bt).total_seconds()/60,
                       parent_NET48_SPREAD_PCT=float(r.NET48_SPREAD_PCT),parent_NET48_STRESS_PCT=float(r.NET48_STRESS_PCT))
              for h in [12,24,48,72]:
                  sp=z[(z[tc]>bt)&(z[tc]<=bt+pd.Timedelta(hours=h))&(z.close>bh)]
                  rec[f'second_{h}h']=sp.iloc[0][tc] if len(sp) else pd.NaT
              # entry-price diagnostic only: retest level vs first second-push close
              sp72=z[(z[tc]>bt)&(z[tc]<=bt+pd.Timedelta(hours=72))&(z.close>bh)]
              if len(sp72):
                  s=sp72.iloc[0]
                  rec['second_price']=float(s.close)
                  rec['price_improvement_bps']=(float(s.close)-level)/float(s.close)*10000.0
                  rec['second_delay_min']=(s[tc]-bt).total_seconds()/60
              else:
                  rec['second_price']=np.nan; rec['price_improvement_bps']=np.nan; rec['second_delay_min']=np.nan
              rows.append(rec)
          a=pd.DataFrame(rows)
          print('LOCKED_RETEST_N',len(a))
          for h in [12,24,48,72]:
              print('SECOND_PUSH_'+str(h)+'H',int(a[f'second_{h}h'].notna().sum()))
          print('RETEST_DELAY_MEDIAN_MIN',float(a.retest_delay_min.median()))
          print('PARENT_NET48_MEAN_PCT',float(a.parent_NET48_SPREAD_PCT.mean()))
          print('PARENT_STRESS_MEAN_PCT',float(a.parent_NET48_STRESS_PCT.mean()))
          print('PRICE_IMPROVEMENT_BPS_MEDIAN',float(a.price_improvement_bps.median()))
          print('SECOND_DELAY_MEDIAN_MIN',float(a.second_delay_min.median()))
          print('NO_SECOND_72H',int(a.second_72h.isna().sum()))
          if a.second_72h.isna().any():
              print('NO_SECOND_ROWS')
              print(a[a.second_72h.isna()][['entry_time','breakout_time','retest_time','breakout_level','breakout_high']].to_string(index=False))
          a.to_csv('reverse_parity_N72.csv',index=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lab011-reverse-parity-N72
          path: reverse_parity_N72.csv
