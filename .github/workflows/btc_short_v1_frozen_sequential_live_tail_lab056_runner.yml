name: BTC SHORT v1 Frozen Sequential Live Tail LAB056 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_short_v1_frozen_sequential_live_tail_lab056_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab056:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAB056 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-short-v1-frozen-sequential-live-tail-parity-056
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas requests
      - name: Run frozen sequential LAB056
        run: python labs/BTC_SHORT_V1_FROZEN_SEQUENTIAL_LIVE_TAIL_PARITY_LAB_056/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_SHORT_V1_FROZEN_SEQUENTIAL_LIVE_TAIL_PARITY_LAB_056/output
          git commit -m 'Persist BTC SHORT v1 LAB056 outputs' || true
          git push origin HEAD:lab/btc-short-v1-frozen-sequential-live-tail-parity-056
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_SHORT_V1_FROZEN_SEQUENTIAL_LIVE_TAIL_LAB056
          path: labs/BTC_SHORT_V1_FROZEN_SEQUENTIAL_LIVE_TAIL_PARITY_LAB_056/output
