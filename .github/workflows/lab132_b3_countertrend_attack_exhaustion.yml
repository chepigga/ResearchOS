name: LAB132 B3 Countertrend Attack Exhaustion
on:
  push:
    branches: [lab/lab132-b3-countertrend-attack-exhaustion-20261008]
    paths: ['.github/workflows/lab132_b3_countertrend_attack_exhaustion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab132-b3-countertrend-attack-exhaustion-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB132
        run: python labs/LAB132_B3_COUNTERTREND_ATTACK_EXHAUSTION_20261008/run_lab132.py
      - run: cat lab132_out/LAB132_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab132-b3-countertrend-attack-exhaustion
          path: lab132_out
