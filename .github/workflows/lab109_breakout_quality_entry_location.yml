name: LAB109 Breakout Quality Entry Location
on:
  push:
    branches: [lab/lab109-breakout-quality-entry-location-20261007]
    paths: ['.github/workflows/lab109_breakout_quality_entry_location.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab109-breakout-quality-entry-location-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB109
        run: python labs/LAB109_BREAKOUT_QUALITY_ENTRY_LOCATION_20261007/run_lab109.py
      - run: cat lab109_out/LAB109_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab109-breakout-quality-entry-location
          path: lab109_out
