name: BTC Flow Level SHORT High Response Execution LAB044 Runner

on:
  push:
    paths:
      - '.github/workflows/btc_flow_level_short_high_response_execution_lab044_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab044:
    runs-on: ubuntu-latest
    env:
      LAB_BRANCH: lab/btc-flow-level-short-high-response-entry-clock-wide-survival-execution-044
      LAB_DIR: labs/BTC_FLOW_LEVEL_SHORT_HIGH_RESPONSE_ENTRY_CLOCK_AND_WIDE_SURVIVAL_EXECUTION_LAB_044
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas scipy requests
      - name: Run frozen LAB044
        run: python "$LAB_DIR/run_lab.py"
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAB_DIR/output"
          git diff --cached --quiet || git commit -m "Persist BTC SHORT high-response execution LAB044 outputs"
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-short-high-response-execution-lab044
          path: ${{ env.LAB_DIR }}/output
