name: LAB103 Drift Horizon Stop Sweep
on:
  push:
    branches: [lab/lab103-drift-horizon-stop-sweep-20261007]
    paths: ['.github/workflows/lab103_drift_horizon_stop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab103-drift-horizon-stop-sweep-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB103
        run: python labs/LAB103_DRIFT_HORIZON_STOP_20261007/run_lab103.py
      - run: cat lab103_out/LAB103_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab103-drift-horizon-stop
          path: lab103_out
