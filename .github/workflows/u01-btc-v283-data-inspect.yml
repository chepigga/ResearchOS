name: U01 BTC v283 data inspect
on:
  push:
    branches: [lab-btc-unified-lifecycle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_1m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_1m.zip
          sha256sum btc_1m.zip
          python - <<'PY'
          import zipfile,csv,io
          z=zipfile.ZipFile('btc_1m.zip')
          print('NAMES',z.namelist()[:10])
          for n in z.namelist()[:3]:
              if n.lower().endswith('.csv'):
                  with z.open(n) as f:
                      for _ in range(4): print(n, f.readline().decode(errors='replace').rstrip())
          PY
