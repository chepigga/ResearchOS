name: Rithmic XAU LAB022 Baseline Parity 001
on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/rithmic_xau_lab022_baseline_parity_001.py'
      - '.github/workflows/rithmic_xau_lab022_baseline_parity_001.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
          fetch-depth: 0
      - run: python -m pip install --quiet pandas numpy
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download GC -p 'XAUUSD_M1_2026.csv' --clobber
      - run: python research/gc/rithmic_xau_lab022_baseline_parity_001.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gc/RITHMIC_XAU_LAB022_BASELINE_PARITY_001.json research/gc/RITHMIC_XAU_LAB022_BASELINE_PARITY_001.md
          git commit -m "Record LAB022 XAU baseline parity audit"
          git push origin HEAD:gc-amp-feed-audit-001
