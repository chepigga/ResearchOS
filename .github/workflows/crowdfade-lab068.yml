name: CrowdFade LAB068 vol post-entry expansion

on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_CF191G_VOL_POSTENTRY_EXPANSION_LAB_068/**'
      - '.github/workflows/crowdfade-lab068.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab068:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q numpy pandas numba scikit-learn tabulate
      - name: Download frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          LAB="labs/CROWDFADE_CF191G_VOL_POSTENTRY_EXPANSION_LAB_068"
          mkdir -p "$LAB/data/hist_1m" "$LAB/data/all_1m"
          curl -fL --retry 5 --retry-delay 3 -o "$LAB/data/BTCUSDT_flow_2021-01-2026-08.csv.zip" "https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip"
          curl -fL --retry 5 --retry-delay 3 -o "$LAB/data/BTCUSDT_sec.csv.zip" "https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip"
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          import shutil,time
          root=Path("labs/CROWDFADE_CF191G_VOL_POSTENTRY_EXPANSION_LAB_068/data")
          base="https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1m"
          for y in range(2021,2027):
              last=12 if y<=2025 else 8
              for m in range(1,last+1):
                  name=f"BTCUSDT-1m-{y}-{m:02d}.zip";p=root/"all_1m"/name
                  for attempt in range(5):
                      try:urlretrieve(f"{base}/{name}",p);break
                      except Exception:
                          if p.exists():p.unlink()
                          if attempt==4:raise
                          time.sleep(2+attempt)
                  if y<=2025: shutil.copy2(p,root/"hist_1m"/name)
          PY
      - name: Run LAB068
        run: python labs/CROWDFADE_CF191G_VOL_POSTENTRY_EXPANSION_LAB_068/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: CrowdFade-LAB068-vol-expansion
          path: labs/CROWDFADE_CF191G_VOL_POSTENTRY_EXPANSION_LAB_068/output/
          retention-days: 30
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "ResearchOS Lab Runner"
          git config user.email "researchos-lab@users.noreply.github.com"
          git add labs/CROWDFADE_CF191G_VOL_POSTENTRY_EXPANSION_LAB_068/output/
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "lab(CrowdFade): record LAB068 vol expansion results"
            git pull --rebase origin lab/crowdfade-execution-5y-positive-005
            git push origin HEAD:lab/crowdfade-execution-5y-positive-005
          fi
