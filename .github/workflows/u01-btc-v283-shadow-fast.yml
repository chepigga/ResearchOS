name: U01 BTC v283 shadow fast
on:
  push:
    branches: [lab-btc-unified-lifecycle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - run: |
          curl -L --fail --retry 3 -o btc_1m_full.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_1m.zip
          test "$(sha256sum btc_1m_full.zip | awk '{print $1}')" = "4339abbd8d23a0ee84afa4187a41be2fd41d219060e1751053b152757be9a7ea"
          python - <<'PY'
          import zipfile,re
          src=zipfile.ZipFile('btc_1m_full.zip'); dst=zipfile.ZipFile('btc_1m.zip','w',zipfile.ZIP_DEFLATED)
          keep=[]
          for n in src.namelist():
              m=re.search(r'(2025|2026)-(\d\d)',n)
              if not m: continue
              y,mo=int(m.group(1)),int(m.group(2))
              if (y==2025 and mo>=10) or y==2026:
                  dst.writestr(n,src.read(n)); keep.append(n)
          dst.close(); src.close(); print('KEPT',len(keep),keep)
          PY
      - name: Run Jul-Aug 2026 reachability only
        run: |
          sed -i "s/t<pd.Timestamp('2024-01-01')/t<pd.Timestamp('2026-07-01')/" research/btc_unified_lifecycle/u01_v283_shadow_replay.py
          python research/btc_unified_lifecycle/u01_v283_shadow_replay.py --btc-1m btc_1m.zip --outdir u01_fast
          cat u01_fast/u01_v283_shadow_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: u01-v283-shadow-fast
          path: u01_fast/
