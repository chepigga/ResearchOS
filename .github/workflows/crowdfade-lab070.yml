name: CrowdFade LAB070 50pct reduction runner

on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_CF191G_HIGH_VOL_FAILED_EARLY_PARTIAL_LAB_070/**'
      - '.github/workflows/crowdfade-lab070.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab070:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q numpy pandas numba tabulate
      - name: Run LAB070
        run: python labs/CROWDFADE_CF191G_HIGH_VOL_FAILED_EARLY_PARTIAL_LAB_070/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: CrowdFade-LAB070-partial-runner
          path: labs/CROWDFADE_CF191G_HIGH_VOL_FAILED_EARLY_PARTIAL_LAB_070/output/
          retention-days: 30
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "ResearchOS Lab Runner"
          git config user.email "researchos-lab@users.noreply.github.com"
          git add labs/CROWDFADE_CF191G_HIGH_VOL_FAILED_EARLY_PARTIAL_LAB_070/output/
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "lab(CrowdFade): record LAB070 partial-runner results"
            git pull --rebase origin lab/crowdfade-execution-5y-positive-005
            git push origin HEAD:lab/crowdfade-execution-5y-positive-005
          fi
