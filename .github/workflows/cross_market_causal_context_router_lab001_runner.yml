name: Cross Market Causal Context Router LAB001 Runner

on:
  push:
    paths:
      - '.github/workflows/cross_market_causal_context_router_lab001_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  context-router-lab001:
    runs-on: ubuntu-latest
    env:
      LAB_BRANCH: lab/cross-market-causal-context-router-001
      LAB_DIR: labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas requests
      - name: Run preregistered causal context router LAB001
        run: python "$LAB_DIR/run_lab.py"
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAB_DIR/output"
          git diff --cached --quiet || git commit -m "Persist causal context router LAB001 outputs"
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-market-causal-context-router-lab001
          path: ${{ env.LAB_DIR }}/output
