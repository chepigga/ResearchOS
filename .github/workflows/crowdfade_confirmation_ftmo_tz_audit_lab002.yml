name: CrowdFade FTMO Time Alignment LAB002
on:
  push:
    branches:
      - lab/crowdfade-confirmation-entry-causal-oos-002
    paths:
      - '.github/workflows/crowdfade_confirmation_ftmo_tz_audit_lab002.yml'
      - 'labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/run_ftmo_time_alignment.py'
permissions:
  contents: write
jobs:
  tz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-confirmation-entry-causal-oos-002
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download May FTMO ticks and Binance M1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/tz_data
          cd labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/tz_data
          curl -L --fail --retry 3 -o TickExport_BTCUSD_2026-05.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/TickExport_BTCUSD_2026-05.csv.zip
          echo '0443ecc176737a8e4df71ee96d24d4a2ada0f74205260a5597423a0ec7d612e8  TickExport_BTCUSD_2026-05.csv.zip' | sha256sum -c -
          curl -L --fail --retry 3 -o btc_1m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_1m.zip
          echo '4339abbd8d23a0ee84afa4187a41be2fd41d219060e1751053b152757be9a7ea  btc_1m.zip' | sha256sum -c -
      - name: Run FTMO UTC alignment audit
        run: python labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/run_ftmo_time_alignment.py
      - name: Persist TZ outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/tz_output
          git commit -m 'research(CrowdFade): persist LAB002 FTMO time alignment' || true
          git push origin HEAD:lab/crowdfade-confirmation-entry-causal-oos-002
      - uses: actions/upload-artifact@v4
        with:
          name: crowdfade-ftmo-tz-audit-lab002
          path: labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/tz_output
