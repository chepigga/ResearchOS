name: crowdfade-peak-capture-2026-lab013
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths: ['labs/CROWDFADE_CAUSAL_PEAK_CAPTURE_LAB_013/run_2026.py','.github/workflows/crowdfade_peak_capture_2026_lab013.yml']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas
      - run: |
          ROOT=labs/CROWDFADE_CAUSAL_PEAK_CAPTURE_LAB_013/stress_data;mkdir -p "$ROOT";cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
      - run: python labs/CROWDFADE_CAUSAL_PEAK_CAPTURE_LAB_013/run_2026.py
      - run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add labs/CROWDFADE_CAUSAL_PEAK_CAPTURE_LAB_013/output/stress_2026.json;git commit -m 'research(CrowdFade): LAB013 2026 peak capture stress' || exit 0;git push
