name: LAB152 EARLY_EPISODE Robustness Placebo
on:
  push:
    branches: [lab/lab152-early-episode-robustness-placebo-20261009]
    paths: ['.github/workflows/lab152_early_episode_robustness_placebo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab152-early-episode-robustness-placebo-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB152
        run: python labs/LAB152_EARLY_EPISODE_ROBUSTNESS_PLACEBO_20261009/run_lab152.py
      - run: cat lab152_out/LAB152_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab152-early-episode-robustness-placebo
          path: lab152_out
\n# rerun after placebo offset fix\n