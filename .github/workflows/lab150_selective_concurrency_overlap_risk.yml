name: LAB150 Selective Concurrency Overlap Risk
on:
  push:
    branches: [lab/lab150-selective-concurrency-overlap-risk-20261009]
    paths: ['.github/workflows/lab150_selective_concurrency_overlap_risk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab150-selective-concurrency-overlap-risk-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB150
        run: python labs/LAB150_SELECTIVE_CONCURRENCY_OVERLAP_RISK_20261009/run_lab150.py
      - run: cat lab150_out/LAB150_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab150-selective-concurrency-overlap-risk
          path: lab150_out
