name: BTC Flow Level Prebreak Volume Ignition LAB036 Runner

on:
  push:
    paths:
      - '.github/workflows/btc_flow_level_prebreak_volume_ignition_lab036_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab036:
    runs-on: ubuntu-latest
    env:
      LAB_BRANCH: lab/btc-flow-level-prebreak-volume-ignition-absorption-oi-continuation-036
      LAB_DIR: labs/BTC_FLOW_LEVEL_PREBREAK_VOLUME_IGNITION_VS_ABSORPTION_AND_OI_CONTINUATION_LAB_036
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas scipy requests
      - name: Run frozen LAB036
        run: python "$LAB_DIR/run_lab.py"
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAB_DIR/output"
          git diff --cached --quiet || git commit -m "Persist BTC flow volume ignition LAB036 outputs"
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-flow-level-prebreak-volume-ignition-lab036
          path: ${{ env.LAB_DIR }}/output
