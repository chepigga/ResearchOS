name: AMP GC OOS 001 One Shot

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/amp_gc_oos_001_one_shot.py'
      - '.github/workflows/amp_gc_oos_001_one_shot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
          fetch-depth: 0

      - name: Install Python deps
        run: python -m pip install --quiet pandas numpy

      - name: Download historical XAU mapping asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download GC -p 'XAUUSD_M1_2026.csv' --clobber

      - name: Run one-shot untouched AMP replication
        run: python research/gc/amp_gc_oos_001_one_shot.py

      - name: Commit immutable one-shot outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gc/AMP_GC_OOS_001_CORE_EVENTS.csv \
                  research/gc/AMP_GC_OOS_001_CONFIRMED_EVENTS.csv \
                  research/gc/AMP_GC_OOS_001_ONE_SHOT_REPORT.md \
                  research/gc/AMP_GC_OOS_001_ONE_SHOT_RESULT.json
          git commit -m "Freeze AMP GC OOS 001 one-shot result"
          git push origin HEAD:gc-amp-feed-audit-001
