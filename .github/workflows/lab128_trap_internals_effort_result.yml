name: LAB128 Trap Internals Effort Result
on:
  push:
    branches: [lab/lab128-trap-internals-effort-result-20261008]
    paths: ['.github/workflows/lab128_trap_internals_effort_result.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab128-trap-internals-effort-result-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          curl -L --fail --retry 3 -o BTCUSDT_sec.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
      - name: Run LAB128
        run: python labs/LAB128_TRAP_INTERNALS_EFFORT_RESULT_20261008/run_lab128.py
      - run: cat lab128_out/LAB128_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab128-trap-internals-effort-result
          path: lab128_out

# rerun timezone fix
