name: BTC Retail Flow Forced Liquidity Level Acceptance LAB035 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_retail_flow_forced_liquidity_level_acceptance_lab035_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab035:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-retail-flow-forced-liquidity-level-proxy-break-acceptance-035
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas scipy requests
      - name: Run frozen LAB035
        run: python labs/BTC_RETAIL_FLOW_FORCED_LIQUIDITY_LEVEL_PROXY_X_BREAK_ACCEPTANCE_LAB_035/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_RETAIL_FLOW_FORCED_LIQUIDITY_LEVEL_PROXY_X_BREAK_ACCEPTANCE_LAB_035/output
          git commit -m 'Persist BTC retail flow forced liquidity level acceptance LAB035 outputs' || true
          git push origin HEAD:lab/btc-retail-flow-forced-liquidity-level-proxy-break-acceptance-035
      - uses: actions/upload-artifact@v4
        with:
          name: btc-retail-flow-forced-liquidity-level-acceptance-lab035
          path: labs/BTC_RETAIL_FLOW_FORCED_LIQUIDITY_LEVEL_PROXY_X_BREAK_ACCEPTANCE_LAB_035/output
