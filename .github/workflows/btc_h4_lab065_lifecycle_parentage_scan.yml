name: BTC H4 LAB065 Lifecycle Parentage Scan

on:
  push:
    branches: [lab059-h4-long-oos]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan LAB010 lifecycle clocks and semantic gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pandas numpy
          mkdir -p lab065_lifecycle
          curl -L --fail --retry 3 -o lab065_lifecycle/H1.csv https://github.com/chepigga/ResearchOS/releases/download/btc/BTC_LAB010_H1_EVENTS.csv
          curl -L --fail --retry 3 -o lab065_lifecycle/M15.csv https://github.com/chepigga/ResearchOS/releases/download/btc/BTC_LAB010_M15_EVENTS.csv
          curl -L --fail --retry 3 -o lab065_lifecycle/META.csv https://github.com/chepigga/ResearchOS/releases/download/btc/BTC_LAB010_METADATA.csv
          curl -L --fail --retry 3 -o lab065_lifecycle/TZ.md https://github.com/chepigga/ResearchOS/releases/download/btc/BTC_DIRECTIONAL_SCALE_ASYMMETRY_LAB_010_TZ.md
          python - <<'PY'
          import pandas as pd, numpy as np, json
          from pathlib import Path
          out=Path('lab065_lifecycle')
          frozen=pd.read_csv('lab065/frozen114_D_times.csv')
          frozen['D_time']=pd.to_datetime(frozen['D_time'],errors='coerce')
          frozen['entry_time_dt']=pd.to_datetime(frozen['entry_time'],errors='coerce')
          tcols=['a_time','b_time','c_time','state_recovery_time','accept_time','entry_time']
          def flag(x,c): return x[c].astype(str).str.lower().isin(['true','1']) if c in x else pd.Series(False,index=x.index)
          filters=[('ALL',lambda x:pd.Series(True,index=x.index)),('PRIMARY_TRUE',lambda x:flag(x,'is_primary_episode_trade')),('SECONDARY_TRUE',lambda x:flag(x,'is_secondary_activation')),('STATE_RECOVERED_TRUE',lambda x:flag(x,'state_recovered')),('PRIMARY_AND_RECOVERED',lambda x:flag(x,'is_primary_episode_trade')&flag(x,'state_recovered')),('SECONDARY_AND_RECOVERED',lambda x:flag(x,'is_secondary_activation')&flag(x,'state_recovered'))]
          rows=[]; unique={}
          cache={}
          for universe,file in [('H1','H1.csv'),('M15','M15.csv')]:
            df=pd.read_csv(out/file,low_memory=False)
            ds=df['direction']
            if pd.api.types.is_numeric_dtype(ds): df['_side']=np.sign(pd.to_numeric(ds,errors='coerce')).fillna(0).astype(int)
            else:
              z=ds.astype(str).str.upper(); df['_side']=np.where(z.str.contains('BUY|LONG|UP'),1,np.where(z.str.contains('SELL|SHORT|DOWN'),-1,0))
            cache[universe]=df
            unique[universe]={c:df[c].astype(str).value_counts(dropna=False).head(30).to_dict() for c in ['is_primary_episode_trade','is_secondary_activation','state_before_downgrade','state_after_downgrade','state_recovered','tf'] if c in df}
            for tc in tcols:
              if tc not in df: continue
              temp=df.copy(); temp['_t']=pd.to_datetime(temp[tc],errors='coerce')
              base=temp[temp['_t'].between(pd.Timestamp('2023-01-01'),pd.Timestamp('2025-12-31 23:59:59'))]
              for fname,ff in filters:
                q0=base[ff(base)].copy()
                if q0.empty: continue
                for target in ['D_time','entry_time_dt']:
                  for same_side in [True,False]:
                    for off in range(-8,9):
                      q=q0.copy(); q['_cmp']=q['_t']+pd.Timedelta(hours=off)
                      near=[]
                      for _,r in frozen.iterrows():
                        qq=q[q['_side']==int(r.side)] if same_side else q
                        if qq.empty: near.append(np.nan); continue
                        near.append(float((qq['_cmp']-r[target]).abs().min()/pd.Timedelta(hours=1)))
                      a=np.array(near,float)
                      rows.append({'universe':universe,'time_col':tc,'filter':fname,'target':target,'same_side':same_side,'offset_hours':off,'candidate_rows':len(q0),'exact':int(np.nansum(a<1e-9)),'within1h':int(np.nansum(a<=1)),'within4h':int(np.nansum(a<=4)),'within8h':int(np.nansum(a<=8)),'within24h':int(np.nansum(a<=24)),'median_nearest_h':float(np.nanmedian(a)),'p90_nearest_h':float(np.nanpercentile(a,90))})
          res=pd.DataFrame(rows); res.to_csv(out/'LAB065_LAB010_LIFECYCLE_PARENTAGE_SCAN.csv',index=False)
          (out/'LAB065_LAB010_SEMANTIC_UNIQUES.json').write_text(json.dumps(unique,indent=2,default=str))
          same=res[res.same_side].copy(); same['score']=same.exact*1000000+same.within1h*10000+same.within4h*100+same.within8h-same.candidate_rows*1e-5
          best=same.sort_values('score',ascending=False).head(100); best.to_csv(out/'LAB065_LAB010_LIFECYCLE_PARENTAGE_TOP100.csv',index=False)
          print(best[['universe','time_col','filter','target','offset_hours','candidate_rows','exact','within1h','within4h','within8h','within24h','median_nearest_h']].head(60).to_string(index=False))
          PY
          sha256sum lab065_lifecycle/* > lab065_lifecycle/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_H4_LAB065_LIFECYCLE_PARENTAGE_SCAN
          path: lab065_lifecycle/
          retention-days: 7
