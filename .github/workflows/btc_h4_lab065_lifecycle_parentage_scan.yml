name: BTC H4 LAB065 Lifecycle Parentage Scan

on:
  push:
    branches: [lab059-h4-long-oos]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test H1 precursor identity and semantic state signatures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pandas numpy
          mkdir -p lab065_signature
          curl -L --fail --retry 3 -o lab065_signature/H1.csv https://github.com/chepigga/ResearchOS/releases/download/btc/BTC_LAB010_H1_EVENTS.csv
          python - <<'PY'
          import pandas as pd, numpy as np, itertools, json
          from pathlib import Path
          out=Path('lab065_signature')
          f=pd.read_csv('lab065/frozen114_D_times.csv')
          f['entry']=pd.to_datetime(f.entry_time); f['D']=pd.to_datetime(f.D_time); f['side']=pd.to_numeric(f.side).astype(int)
          d=pd.read_csv(out/'H1.csv',low_memory=False)
          z=d.direction.astype(str).str.upper()
          if pd.api.types.is_numeric_dtype(d.direction): d['side']=np.sign(pd.to_numeric(d.direction,errors='coerce')).fillna(0).astype(int)
          else: d['side']=np.where(z.str.contains('BUY|LONG|UP'),1,np.where(z.str.contains('SELL|SHORT|DOWN'),-1,0))
          for c in ['a_time','b_time','c_time','state_recovery_time','accept_time','entry_time']:
            d[c]=pd.to_datetime(d[c],errors='coerce')
          d=d[d.a_time.between(pd.Timestamp('2023-01-01'),pd.Timestamp('2025-12-31 23:59:59'))].copy()
          # exact nearest mapping for the striking H1 a_time +1h -> frozen entry relation
          maps=[]; chosen=[]
          for _,r in f.iterrows():
            q=d[(d.side==r.side)&(d.is_primary_episode_trade.astype(int)==1)].copy()
            q['cmp']=q.a_time+pd.Timedelta(hours=1)
            delta=(q.cmp-r.entry).abs(); j=delta.idxmin(); x=q.loc[j]
            maps.append({'frozen_entry':r.entry,'frozen_D':r.D,'side':r.side,'event_id':x.event_id,'episode_id':x.episode_id,
              'a_time':x.a_time,'a_plus1':x.cmp,'delta_min':delta.loc[j]/pd.Timedelta(minutes=1),
              'b_time':x.b_time,'c_time':x.c_time,'state_recovery_time':x.state_recovery_time,'accept_time':x.accept_time,'parent_entry_time':x.entry_time,
              'primary':x.is_primary_episode_trade,'secondary':x.is_secondary_activation,'state_before':x.state_before_downgrade,'state_after':x.state_after_downgrade,'state_recovered':x.state_recovered,
              'bc_ab':x.bc_ab,'c_to_b_entry_pos':x.c_to_b_entry_pos,'sl_distance_bps':x.sl_distance_bps,'cost_R':x.cost_R_zero_slip_proxy})
            chosen.append(j)
          mp=pd.DataFrame(maps); mp.to_csv(out/'LAB065_H1_A_TIME_PRECURSOR_MAP.csv',index=False)
          # one-to-one statistics
          one={'frozen_n':len(mp),'unique_parent_event_ids':int(mp.event_id.nunique()),'unique_parent_episode_ids':int(mp.episode_id.nunique()),
               'delta_min_median':float(mp.delta_min.median()),'delta_min_p90':float(mp.delta_min.quantile(.9)),'delta_min_max':float(mp.delta_min.max()),
               'within_1min':int((mp.delta_min<=1).sum()),'within_5min':int((mp.delta_min<=5).sum()),'within_15min':int((mp.delta_min<=15).sum()),'within_60min':int((mp.delta_min<=60).sum())}
          # categorical signature exhaustive finite semantic dictionary, no numeric thresholds
          catcols=['is_primary_episode_trade','is_secondary_activation','state_before_downgrade','state_after_downgrade','state_recovered']
          rows=[]
          target=f[['entry','side']].copy()
          def nearest_stats(q):
            vals=[]
            for _,r in target.iterrows():
              qq=q[q.side==r.side]
              if qq.empty: vals.append(np.nan); continue
              vals.append(float((qq.a_time+pd.Timedelta(hours=1)-r.entry).abs().min()/pd.Timedelta(minutes=1)))
            a=np.array(vals,float)
            return {'candidate_rows':len(q),'exact':int(np.nansum(a<1e-9)),'within1m':int(np.nansum(a<=1)),'within5m':int(np.nansum(a<=5)),'within15m':int(np.nansum(a<=15)),'within60m':int(np.nansum(a<=60)),'median_min':float(np.nanmedian(a)),'p90_min':float(np.nanpercentile(a,90))}
          # all single, pair, triple categorical value conjunctions
          value_sets={c:sorted(d[c].dropna().unique().tolist()) for c in catcols}
          rows.append({'signature':'ALL',**nearest_stats(d)})
          for k in [1,2,3,4,5]:
            for cols in itertools.combinations(catcols,k):
              for vals in itertools.product(*[value_sets[c] for c in cols]):
                mask=pd.Series(True,index=d.index)
                parts=[]
                for c,v in zip(cols,vals): mask &= d[c]==v; parts.append(f'{c}={v}')
                q=d[mask]
                if len(q)==0: continue
                rows.append({'signature':' & '.join(parts),**nearest_stats(q)})
          sig=pd.DataFrame(rows)
          sig['recall60']=sig.within60m/114
          sig['precision_proxy']=sig.within60m/sig.candidate_rows.clip(lower=1)
          sig.to_csv(out/'LAB065_H1_CATEGORICAL_SIGNATURE_SCAN.csv',index=False)
          # frontier emphasizing near 114 count while preserving 114 parent coverage
          front=sig[(sig.candidate_rows.between(80,250)) | (sig.within60m>=100)].sort_values(['within60m','within15m','candidate_rows'],ascending=[False,False,True])
          front.to_csv(out/'LAB065_H1_CATEGORICAL_SIGNATURE_FRONTIER.csv',index=False)
          # distribution of semantic states actually mapped to frozen events
          dist={c:mp[c.replace('is_primary_episode_trade','primary').replace('is_secondary_activation','secondary').replace('state_before_downgrade','state_before').replace('state_after_downgrade','state_after')].astype(str).value_counts().to_dict() if c!='state_recovered' else mp.state_recovered.astype(str).value_counts().to_dict() for c in catcols}
          (out/'LAB065_H1_PRECURSOR_SUMMARY.json').write_text(json.dumps({'one_to_one':one,'mapped_semantic_distributions':dist},indent=2,default=str))
          print('ONE TO ONE',json.dumps(one,indent=2))
          print('\nBEST CATEGORICAL FRONTIER')
          print(front[['signature','candidate_rows','exact','within1m','within5m','within15m','within60m','median_min','precision_proxy']].head(80).to_string(index=False))
          PY
          sha256sum lab065_signature/* > lab065_signature/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_H4_LAB065_H1_PRECURSOR_SIGNATURE
          path: lab065_signature/
          retention-days: 7
