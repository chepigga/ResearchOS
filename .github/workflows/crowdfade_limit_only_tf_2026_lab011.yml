name: crowdfade-limit-only-tf-2026-lab011
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths: ['labs/CROWDFADE_LIMIT_ONLY_TIMEFRAME_LAB_011/run_2026.py','.github/workflows/crowdfade_limit_only_tf_2026_lab011.yml']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas
      - run: |
          ROOT=labs/CROWDFADE_LIMIT_ONLY_TIMEFRAME_LAB_011/stress_data;mkdir -p "$ROOT";cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
      - run: python labs/CROWDFADE_LIMIT_ONLY_TIMEFRAME_LAB_011/run_2026.py
      - run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add labs/CROWDFADE_LIMIT_ONLY_TIMEFRAME_LAB_011/output/stress_2026_top4.json;git commit -m 'research(CrowdFade): LAB011 2026 limit-only TF stress' || exit 0;git push
