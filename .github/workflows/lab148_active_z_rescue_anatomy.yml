name: LAB148 Active Z Rescue Anatomy
on:
  push:
    branches: [lab/lab148-active-z-rescue-anatomy-20261009]
    paths: ['.github/workflows/lab148_active_z_rescue_anatomy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab148-active-z-rescue-anatomy-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB148
        run: python labs/LAB148_ACTIVE_Z_RESCUE_ANATOMY_20261009/run_lab148.py
      - run: cat lab148_out/LAB148_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab148-active-z-rescue-anatomy
          path: lab148_out
