name: GC M1 Seller Breakdown XAU Bear Regimes LAB006

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/gc_m1_seller_breakdown_xau_bear_regimes_lab006.py'
      - '.github/workflows/gc_m1_seller_breakdown_xau_bear_regimes_lab006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab006:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Run LAB006
        run: python research/gc/gc_m1_seller_breakdown_xau_bear_regimes_lab006.py
      - name: Commit LAB006 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/gc/GC_M1_SELLER_BREAKDOWN_IN_XAU_BEAR_REGIMES_LAB_006.json \
                  research/gc/GC_M1_SELLER_BREAKDOWN_IN_XAU_BEAR_REGIMES_LAB_006.md \
                  research/gc/GC_M1_SELLER_BREAKDOWN_IN_XAU_BEAR_REGIMES_LAB_006_EVENTS.csv
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Record GC seller breakdown XAU bear regimes LAB006'
            git pull --rebase origin gc-amp-feed-audit-001
            git push origin HEAD:gc-amp-feed-audit-001
          fi
