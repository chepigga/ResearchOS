name: BTC SHORT ACCEPT25 Persistent Failure Exit LAB053 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_short_accept25_persistent_failure_exit_lab053_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab053:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen LAB053 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-short-accept25-persistent-failure-exit-vs-severe-adverse1r-execution-053
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas
      - name: Run frozen LAB053
        run: python labs/BTC_SHORT_ACCEPT25_PERSISTENT_FAILURE_EXIT_VS_SEVERE_ADVERSE1R_EXECUTION_LAB_053/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_SHORT_ACCEPT25_PERSISTENT_FAILURE_EXIT_VS_SEVERE_ADVERSE1R_EXECUTION_LAB_053/output
          git commit -m 'Persist BTC SHORT persistent failure exit LAB053 outputs' || true
          git push origin HEAD:lab/btc-short-accept25-persistent-failure-exit-vs-severe-adverse1r-execution-053
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_SHORT_ACCEPT25_PERSISTENT_FAILURE_EXIT_LAB053
          path: labs/BTC_SHORT_ACCEPT25_PERSISTENT_FAILURE_EXIT_VS_SEVERE_ADVERSE1R_EXECUTION_LAB_053/output
