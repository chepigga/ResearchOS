name: CrowdFade sequential LAB033-035

on:
  push:
    branches:
      - lab/crowdfade-execution-5y-positive-005
    paths:
      - 'labs/CROWDFADE_V200_SEQUENTIAL_CHANGE_LABS_033_035/run.py'
      - 'labs/CROWDFADE_V200_SEQUENTIAL_CHANGE_LABS_033_035/lab035b.py'
      - 'labs/CROWDFADE_V200_FREQUENCY_EXPANSION_LAB_037/run.py'
      - '.github/workflows/crowdfade-sequential-labs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy pandas numba

      - name: Download frozen research data
        shell: bash
        run: |
          set -euo pipefail
          LAB="labs/CROWDFADE_V200_SEQUENTIAL_CHANGE_LABS_033_035"
          mkdir -p "$LAB/data/hist_1m"

          curl -fL --retry 5 --retry-delay 3 \
            -o "$LAB/data/BTCUSDT_flow_2021-01-2026-08.csv.zip" \
            "https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip"

          curl -fL --retry 5 --retry-delay 3 \
            -o "$LAB/data/BTCUSDT_sec.csv.zip" \
            "https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip"

          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          import time
          root=Path("labs/CROWDFADE_V200_SEQUENTIAL_CHANGE_LABS_033_035/data/hist_1m")
          base="https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1m"
          for y in range(2021,2026):
              for m in range(1,13):
                  name=f"BTCUSDT-1m-{y}-{m:02d}.zip"
                  p=root/name
                  if p.exists(): continue
                  url=f"{base}/{name}"
                  for attempt in range(5):
                      try:
                          urlretrieve(url,p)
                          print("downloaded",name,p.stat().st_size)
                          break
                      except Exception as e:
                          if p.exists(): p.unlink()
                          if attempt==4: raise
                          time.sleep(2+attempt)
          PY

          sha256sum "$LAB/data/BTCUSDT_flow_2021-01-2026-08.csv.zip"
          sha256sum "$LAB/data/BTCUSDT_sec.csv.zip"
          echo "monthly files: $(find "$LAB/data/hist_1m" -name '*.zip' | wc -l)"

      - name: Run sequential LAB033-035
        run: python labs/CROWDFADE_V200_SEQUENTIAL_CHANGE_LABS_033_035/run.py

      - name: Run LAB035B stability audit
        run: python labs/CROWDFADE_V200_SEQUENTIAL_CHANGE_LABS_033_035/lab035b.py

      - name: Run LAB037 frequency expansion
        run: python labs/CROWDFADE_V200_FREQUENCY_EXPANSION_LAB_037/run.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: crowdFade-LAB033-035-results
          path: |
            labs/CROWDFADE_V200_SEQUENTIAL_CHANGE_LABS_033_035/output/
            labs/CROWDFADE_V200_FREQUENCY_EXPANSION_LAB_037/output/
          retention-days: 30

      - name: Commit research outputs
        shell: bash
        run: |
          set -e
          git config user.name "ResearchOS Lab Runner"
          git config user.email "researchos-lab@users.noreply.github.com"
          git add labs/CROWDFADE_V200_SEQUENTIAL_CHANGE_LABS_033_035/output/ labs/CROWDFADE_V200_FREQUENCY_EXPANSION_LAB_037/output/
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "lab(CrowdFade): record sequential LAB033-035 results"
            git push origin HEAD:lab/crowdfade-execution-5y-positive-005
          fi
