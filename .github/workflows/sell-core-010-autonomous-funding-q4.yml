name: SELL CORE 010 Autonomous Funding Q4
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths:
      - '.github/workflows/sell-core-010-autonomous-funding-q4.yml'
      - 'research/btc_unified_lifecycle/sell_core_010_autonomous_funding_q4_state.py'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy tabulate
      - name: Download frozen BTC H1 flow and funding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/chepigga/ResearchOS/releases/assets/511572302 -H 'Accept: application/octet-stream' > research/btc_unified_lifecycle/binance_btc_funding.csv
          gh api /repos/chepigga/ResearchOS/releases/assets/511572318 -H 'Accept: application/octet-stream' > research/btc_unified_lifecycle/binance_btc_flow.csv
          test "$(sha256sum research/btc_unified_lifecycle/binance_btc_funding.csv|awk '{print $1}')" = "df4dc9d6c0c28069e1f1a20c4d1f0ffb3d7195869aae151263ec8fff10052ef8"
          test "$(sha256sum research/btc_unified_lifecycle/binance_btc_flow.csv|awk '{print $1}')" = "e9501054d851fd6dfc605f97671c59f15afa9b259620191756c45af62031417e"
      - name: Run lab
        run: |
          cd research/btc_unified_lifecycle
          python sell_core_010_autonomous_funding_q4_state.py
          cat sell_core_010_out/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: sell-core-010-autonomous-funding-q4
          path: research/btc_unified_lifecycle/sell_core_010_out/
