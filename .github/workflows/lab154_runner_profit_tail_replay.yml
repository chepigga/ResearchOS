name: LAB154 Runner Profit Tail Replay
on:
  push:
    branches: [lab/lab154-runner-profit-tail-replay-20261009]
    paths: ['.github/workflows/lab154_runner_profit_tail_replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab154-runner-profit-tail-replay-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB154
        run: python labs/LAB154_RUNNER_PROFIT_TAIL_REPLAY_20261009/run_lab154.py
      - run: cat lab154_out/LAB154_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab154-runner-profit-tail-replay
          path: lab154_out

# rerun after NaN fix
