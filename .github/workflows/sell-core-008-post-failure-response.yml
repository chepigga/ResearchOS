name: SELL CORE 008 Post Failure Response
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths:
      - 'research/btc_unified_lifecycle/sell_core_008_post_failed_attack_early_response.py'
      - '.github/workflows/sell-core-008-post-failure-response.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy tabulate
      - name: Download frozen price assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/chepigga/ResearchOS/releases/assets/511572188 -H 'Accept: application/octet-stream' > btc_1m.zip
          test "$(sha256sum btc_1m.zip|awk '{print $1}')" = "4339abbd8d23a0ee84afa4187a41be2fd41d219060e1751053b152757be9a7ea"
          gh api /repos/chepigga/ResearchOS/releases/assets/511572122 -H 'Accept: application/octet-stream' > btc_5m.zip
          test "$(sha256sum btc_5m.zip|awk '{print $1}')" = "13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd"
      - name: Run lab
        run: |
          cp btc_1m.zip research/btc_unified_lifecycle/
          cp btc_5m.zip research/btc_unified_lifecycle/
          cd research/btc_unified_lifecycle
          python sell_core_008_post_failed_attack_early_response.py
          cat sell_core_008_out/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: sell-core-008-post-failure-response
          path: research/btc_unified_lifecycle/sell_core_008_out/
