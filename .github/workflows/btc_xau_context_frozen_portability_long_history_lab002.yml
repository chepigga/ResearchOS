name: BTC XAU Context Frozen Portability Long History LAB002
on:
  push:
    branches:
      - lab/btc-xau-context-frozen-portability-long-history-002
    paths:
      - 'labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LONG_HISTORY_LAB_002/**'
      - '.github/workflows/btc_xau_context_frozen_portability_long_history_lab002.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab002:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas numpy requests tabulate
      - name: Apply frozen Context runtime parity hotfixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py')
          s=p.read_text()
          s=s.replace('d.stack.astype(float)', "d['stack'].astype(float)")
          s=s.replace('(~d.stack).astype(float)', "(~d['stack']).astype(float)")
          needle='    sm = s.rolling(3,min_periods=3).mean()'
          if needle not in s: needle='    sm=s.rolling(3,min_periods=3).mean()'
          if needle in s and 'ready=d[[' not in s:
              repl="    ready=d[['ema200','atr_ratio','rsi14','adx14','range24_ratio','relvol20']].notna().all(axis=1)\n    s=s.where(ready,np.nan)\n"+needle
              s=s.replace(needle,repl)
          p.write_text(s)
          p=Path('labs/XAU_CONTEXT_STATE_TIMESCALE_AND_LABEL_PURIFICATION_LAB_008/run_lab.py')
          s=p.read_text()
          old="    d['raw_winner'] = score_arr.idxmax(axis=1).str.replace('score_', '', regex=False).str.upper()"
          if old in s:
              new=("    valid_score = score_arr.notna().any(axis=1)\n"
                   "    d['raw_winner'] = pd.Series(index=d.index, dtype='object')\n"
                   "    d.loc[valid_score, 'raw_winner'] = score_arr.loc[valid_score].idxmax(axis=1).str.replace('score_', '', regex=False).str.upper()")
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Run preregistered LAB002
        run: |
          python labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LONG_HISTORY_LAB_002/run_lab.py \
            --out labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LONG_HISTORY_LAB_002/output
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LONG_HISTORY_LAB_002/output
          if ! git diff --cached --quiet; then
            git commit -m 'Persist long-history BTC portability LAB002 outputs'
            git push origin HEAD:lab/btc-xau-context-frozen-portability-long-history-002
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: btc-xau-context-portability-long-history-lab002
          path: labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LONG_HISTORY_LAB_002/output
