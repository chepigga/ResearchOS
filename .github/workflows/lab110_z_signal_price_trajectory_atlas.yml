name: LAB110 Z Signal Price Trajectory Atlas
on:
  push:
    branches: [lab/lab110-z-signal-price-trajectory-atlas-20261007]
    paths: ['.github/workflows/lab110_z_signal_price_trajectory_atlas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab110-z-signal-price-trajectory-atlas-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB110
        run: python labs/LAB110_Z_SIGNAL_PRICE_TRAJECTORY_ATLAS_20261007/run_lab110.py
      - run: cat lab110_out/LAB110_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab110-z-signal-price-trajectory-atlas
          path: lab110_out

# trigger run
