name: LAB017 BUY trend probability
on:
  pull_request:
    branches: [lab-btc-unified-lifecycle]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Download frozen BTC data
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          test "$(sha256sum btc_5m.zip | awk '{print $1}')" = "13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd"
          curl -L --fail --retry 3 -o btc_1m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_1m.zip
          test "$(sha256sum btc_1m.zip | awk '{print $1}')" = "4339abbd8d23a0ee84afa4187a41be2fd41d219060e1751053b152757be9a7ea"
          mkdir -p m5 m1 && unzip -q btc_5m.zip -d m5 && unzip -q btc_1m.zip -d m1
      - name: Trend probability replay
        run: |
          python - <<'PY'
          import glob,pandas as pd,numpy as np,os,json
          COST=27.5
          START=pd.Timestamp('2024-01-01'); END=pd.Timestamp('2026-08-10 05:59')
          def load(folder):
              x=pd.concat([pd.read_csv(f) for f in glob.glob(folder+'/**/*.csv',recursive=True)],ignore_index=True)
              x['time']=pd.to_datetime(x.time,utc=True).dt.tz_convert(None)
              x=x.sort_values('time').drop_duplicates('time').reset_index(drop=True)
              for c in ['open','high','low','close','taker_ratio']:
                  if c in x:x[c]=pd.to_numeric(x[c],errors='coerce')
              return x
          def pf(v):
              s=pd.Series(v).dropna(); gp=s[s>0].sum(); gl=-s[s<0].sum(); return float(gp/gl) if gl>0 else float('inf')
          def maxdd(v):
              c=np.cumsum(np.asarray(v,float)); cc=np.r_[0,c]; pk=np.maximum.accumulate(cc); return float(np.max(pk-cc))
          m5=load('m5'); m1=load('m1')
          # documented BUY setup
          m5['trend12h_ret']=m5.close/m5.close.shift(144)-1
          m5['pullback15']=m5.close<m5.close.shift(3)
          m5['tr15']=m5.taker_ratio.rolling(3,min_periods=3).mean()
          m5['setup']=(m5.trend12h_ret>=0.002)&m5.pullback15&(m5.tr15<0.50)&(m5.close>m5.high.shift(1))&(m5.time.dt.hour!=19)
          ep=m5[(m5.time>=START)&(m5.time<=END)&m5.setup].copy()
          # H1 completed bars and frozen trend state: close vs EMA20 + EMA20 slope
          h1=m1.set_index('time').resample('1h',label='left',closed='left').agg({'open':'first','high':'max','low':'min','close':'last'}).dropna().reset_index()
          h1['close_time']=h1.time+pd.Timedelta(hours=1)
          h1['ema20']=h1.close.ewm(span=20,adjust=False,min_periods=20).mean(); h1['ema20_prev']=h1.ema20.shift(1)
          pc=h1.close.shift(); tr=pd.concat([h1.high-h1.low,(h1.high-pc).abs(),(h1.low-pc).abs()],axis=1).max(axis=1); h1['atr14']=tr.ewm(alpha=1/14,adjust=False,min_periods=14).mean()
          def h1state(r):
              if r.close>r.ema20 and r.ema20>r.ema20_prev:return 'BULL'
              if r.close<r.ema20 and r.ema20<r.ema20_prev:return 'BEAR'
              return 'NEUTRAL'
          h1['H1_TREND']=h1.apply(h1state,axis=1)
          # H4 canonical Supertrend ATR10 x3 from completed bars
          h4=m1.set_index('time').resample('4h',label='left',closed='left').agg({'open':'first','high':'max','low':'min','close':'last'}).dropna().reset_index()
          h4['close_time']=h4.time+pd.Timedelta(hours=4)
          pc4=h4.close.shift(); tr4=pd.concat([h4.high-h4.low,(h4.high-pc4).abs(),(h4.low-pc4).abs()],axis=1).max(axis=1); atr=tr4.ewm(alpha=1/10,adjust=False,min_periods=10).mean()
          hl2=(h4.high+h4.low)/2; ub=hl2+3*atr; lb=hl2-3*atr
          fub=ub.copy(); flb=lb.copy(); st=np.full(len(h4),np.nan); bull=np.full(len(h4),False)
          for i in range(1,len(h4)):
              fub.iloc[i]=ub.iloc[i] if (ub.iloc[i]<fub.iloc[i-1] or h4.close.iloc[i-1]>fub.iloc[i-1]) else fub.iloc[i-1]
              flb.iloc[i]=lb.iloc[i] if (lb.iloc[i]>flb.iloc[i-1] or h4.close.iloc[i-1]<flb.iloc[i-1]) else flb.iloc[i-1]
              if i==1 or np.isnan(st[i-1]): st[i]=flb.iloc[i] if h4.close.iloc[i]>=flb.iloc[i] else fub.iloc[i]
              elif st[i-1]==fub.iloc[i-1]: st[i]=fub.iloc[i] if h4.close.iloc[i]<=fub.iloc[i] else flb.iloc[i]
              else: st[i]=flb.iloc[i] if h4.close.iloc[i]>=flb.iloc[i] else fub.iloc[i]
              bull[i]=h4.close.iloc[i]>st[i]
          h4['H4_TREND']=np.where(bull,'BULL','BEAR')
          rows=[]
          for idx,r in ep.iterrows():
              bt=r.time; avail=bt+pd.Timedelta(minutes=5); level=float(m5.loc[idx-1,'high']); bh=float(r.high)
              z5=m5[(m5.time>=avail)&(m5.time<=bt+pd.Timedelta(hours=12))]; rr=z5[(z5.low<=level)&(z5.close>=level)]; sp=z5[z5.close>bh]
              if len(rr)==0 or len(sp)==0:continue
              rt=rr.iloc[0].time; hit=m1[(m1.time>=avail)&(m1.time<rt+pd.Timedelta(minutes=5))& (m1.low<=level)]
              if len(hit)==0:continue
              ft=hit.iloc[0].time
              hh=h1[h1.close_time<=avail].tail(1); hhhh=h4[h4.close_time<=avail].tail(1)
              if len(hh)==0 or len(hhhh)==0 or not np.isfinite(hh.iloc[0].atr14):continue
              h1t=hh.iloc[0].H1_TREND; h4t=hhhh.iloc[0].H4_TREND
              if h1t=='BULL' and h4t=='BULL': combo='STRONG_ALIGNED'
              elif h1t=='BEAR' and h4t=='BEAR': combo='STRONG_AGAINST'
              elif h1t=='NEUTRAL': combo='NEUTRAL_H1'
              else: combo='MIXED'
              sd=1.5*float(hh.iloc[0].atr14); sl=level-sd; tp=level+1.5*sd; costR=COST/sd
              path=m1[(m1.time>=ft)&(m1.time<=ft+pd.Timedelta(hours=48))].copy(); ah=path.high.to_numpy(float); al=path.low.to_numpy(float); ac=path.close.to_numpy(float)
              sh=np.flatnonzero(al<=sl); th=np.flatnonzero(ah>=tp); is_=int(sh[0]) if len(sh) else 10**18; it=int(th[0]) if len(th) else 10**18
              if it<is_: R=1.5-costR; outcome='TP'; exit_time=path.iloc[it].time
              elif is_<it: R=-1-costR; outcome='SL'; exit_time=path.iloc[is_].time
              else:R=(ac[-1]-level)/sd-costR; outcome='TIME'; exit_time=path.iloc[-1].time
              # frozen future SCORE6 target; false if trade resolved before +30m
              dt=ft+pd.Timedelta(minutes=30); score6=False
              if exit_time>dt:
                  q=m1[(m1.time>=ft)&(m1.time<dt)]
                  if len(q)>=30:
                      chunks=[]
                      for k in range(6):
                          z=q.iloc[k*5:(k+1)*5]; chunks.append(dict(open=float(z.iloc[0].open),low=float(z.low.min()),close=float(z.iloc[-1].close),taker=float(z.taker_ratio.mean())))
                      c=pd.DataFrame(chunks); c15=[]
                      for k in range(2):
                          z=c.iloc[k*3:(k+1)*3]; c15.append(dict(close=float(z.iloc[-1].close)))
                      votes=[c.iloc[-1].close>=level,(c.close>=level).mean()>=.5,c15[-1]['close']>=level,c.iloc[3:].low.min()>c.iloc[:3].low.min(),c.iloc[-1].close>c.iloc[0].open,c.iloc[3:].taker.mean()>.50]
                      score6=sum(votes)==6
              rows.append(dict(fill_time=ft,year=ft.year,H1_TREND=h1t,H4_TREND=h4t,COMBO=combo,SCORE6=score6,TP=(outcome=='TP'),R48=R,outcome=outcome,costR=costR))
          a=pd.DataFrame(rows).sort_values('fill_time').reset_index(drop=True)
          print('N',len(a),'BASE SCORE6',a.SCORE6.mean(),'TP',a.TP.mean(),'EV',a.R48.mean(),'PF',pf(a.R48))
          def summarize(col):
              rr=[]
              for key,g in a.groupby(col):
                  d=dict(group=str(key),N=len(g),share=len(g)/len(a),P_SCORE6=float(g.SCORE6.mean()),P_TP=float(g.TP.mean()),EV=float(g.R48.mean()),PF=pf(g.R48)); rr.append(d); print(col,d)
              return pd.DataFrame(rr)
          h1tab=summarize('H1_TREND'); h4tab=summarize('H4_TREND'); ctab=summarize('COMBO')
          print('\nYEAR_COMBO')
          yrows=[]
          for (y,c),g in a.groupby(['year','COMBO']):
              d=dict(year=int(y),combo=c,N=len(g),P_SCORE6=float(g.SCORE6.mean()),P_TP=float(g.TP.mean()),EV=float(g.R48.mean()),PF=pf(g.R48));yrows.append(d);print(d)
          # Frozen probability-to-risk mapping, NOT gate: against .10, mixed/neutral .15, aligned .20; fixed .15 comparator
          risk_map={'STRONG_AGAINST':.10,'MIXED':.15,'NEUTRAL_H1':.15,'STRONG_ALIGNED':.20}
          a['risk_scaled']=a.COMBO.map(risk_map).fillna(.15); a['pnl_scaled']=a.risk_scaled*a.R48; a['pnl_fixed015']=.15*a.R48
          print('\nRISK_FIXED015 SUM',a.pnl_fixed015.sum(),'PF',pf(a.pnl_fixed015),'DD',maxdd(a.pnl_fixed015))
          print('RISK_SCALED SUM',a.pnl_scaled.sum(),'PF',pf(a.pnl_scaled),'DD',maxdd(a.pnl_scaled))
          for y,g in a.groupby('year'):
              print('YEAR_RISK',y,'FIXED_SUM',g.pnl_fixed015.sum(),'SCALED_SUM',g.pnl_scaled.sum(),'SCALED_PF',pf(g.pnl_scaled),'SCALED_DD',maxdd(g.pnl_scaled))
          # bootstrap difference scaled - fixed by weekly blocks
          a['week']=a.fill_time.dt.to_period('W').astype(str); w=a.groupby('week').agg(s=('pnl_scaled','sum'),f=('pnl_fixed015','sum')); diff=(w.s-w.f).to_numpy(float); rng=np.random.default_rng(17017); boots=np.array([rng.choice(diff,size=len(diff),replace=True).mean() for _ in range(20000)]); print('RISK_DIFF_BOOT_CI',np.quantile(boots,.025),np.quantile(boots,.975),'P_GT0',(boots>0).mean())
          os.makedirs('lab017',exist_ok=True);a.to_csv('lab017/ledger.csv',index=False);h1tab.to_csv('lab017/h1_table.csv',index=False);h4tab.to_csv('lab017/h4_table.csv',index=False);ctab.to_csv('lab017/combo_table.csv',index=False);pd.DataFrame(yrows).to_csv('lab017/year_combo.csv',index=False)
          summary={'N':len(a),'base_P_SCORE6':float(a.SCORE6.mean()),'base_P_TP':float(a.TP.mean()),'base_EV':float(a.R48.mean()),'base_PF':pf(a.R48),'scaled_sum_pct':float(a.pnl_scaled.sum()),'fixed015_sum_pct':float(a.pnl_fixed015.sum()),'scaled_PF':pf(a.pnl_scaled),'scaled_MaxDD_pct':maxdd(a.pnl_scaled),'risk_diff_boot_ci':[float(np.quantile(boots,.025)),float(np.quantile(boots,.975))],'risk_diff_boot_pgt0':float((boots>0).mean())};json.dump(summary,open('lab017/summary.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lab017-buy-trend-probability
          path: lab017/
