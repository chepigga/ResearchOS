name: crowdfade-execution-5y-positive-lab005
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/**'
      - '.github/workflows/crowdfade_execution_5y_positive_lab005.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download frozen BTC release assets
        run: |
          mkdir -p labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/data
          cd labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/data
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          echo '13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd  btc_5m.zip' | sha256sum -c -
          echo 'b6c80084751305f394270c4b133abbf89a0264634924891251b13b33afbe5e0d  BTCUSDT_flow_2021-01-2026-08.csv.zip' | sha256sum -c -
      - name: Run LAB005 broad execution search
        run: python labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/run_search.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_EXECUTION_5Y_POSITIVE_LAB_005/output
          git commit -m 'research(CrowdFade): persist LAB005 execution search outputs' || exit 0
          git push
