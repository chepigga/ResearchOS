name: U02C0 SELL B3 Ledger Audit

on:
  push:
    branches: [lab-btc-unified-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas
      - name: Audit frozen continuation ledger
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o continuation.csv https://github.com/chepigga/ResearchOS/releases/download/btc/BTC_M15_FVG_CONTINUATION_LAB_020_FREQ_MATCHED_EVENTS.csv
          test "$(sha256sum continuation.csv | awk '{print $1}')" = "6256b824c1e75b7170fa7f70aa4ae021cc44d4522397449eb083a2b310b6bb34"
          python - <<'PY'
          import pandas as pd
          c=pd.read_csv('continuation.csv')
          c['entry_time']=pd.to_datetime(c['entry_time'])
          print('COLUMNS', list(c.columns))
          b=c[(c.side=='SELL') & (c.H4_ST_AGE_BARS>=27) & (c.H4_ST_AGE_BARS<=50)].copy()
          recent=b[(b.entry_time>=pd.Timestamp('2024-01-01')) & (b.entry_time<pd.Timestamp('2027-01-01'))]
          print('SELL_B3_ALL_N',len(b),'FROM',b.entry_time.min(),'TO',b.entry_time.max())
          print('SELL_B3_2024_2026_N',len(recent),'FROM',recent.entry_time.min(),'TO',recent.entry_time.max())
          print('SAMPLE')
          print(recent.head(5).to_string(index=False))
          PY
