name: SELL CORE 013B
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths: ['research/btc_unified_lifecycle/sell_core_013b_b3_lh_bos_incremental.py','.github/workflows/sell-core-013b.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy tabulate
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api /repos/chepigga/ResearchOS/releases/assets/511572188 -H 'Accept: application/octet-stream' > btc_1m.zip
          gh api /repos/chepigga/ResearchOS/releases/assets/511572122 -H 'Accept: application/octet-stream' > btc_5m.zip
      - working-directory: research/btc_unified_lifecycle
        run: |
          cp ../../btc_1m.zip .; cp ../../btc_5m.zip .
          python sell_core_013b_b3_lh_bos_incremental.py
          cat sell_core_013b_out/REPORT.md
      - uses: actions/upload-artifact@v4
        with: {name: sell-core-013b, path: research/btc_unified_lifecycle/sell_core_013b_out/}
