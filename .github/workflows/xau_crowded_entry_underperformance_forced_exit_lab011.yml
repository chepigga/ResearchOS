name: XAU Crowded Entry Underperformance Forced Exit LAB011

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  lab011:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'XAU CROWDED ENTRY LAB011 TRIGGER')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow
      - name: Download frozen LAB001 inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p LAB001_INPUT data Results_XAU_CROWD_LAB011
          gh run download 33067830619 --repo chepigga/ResearchOS --name xau-causal-future-probability-lab001 --dir LAB001_INPUT
          test -s LAB001_INPUT/m1_bidask_bars.parquet
          test -s LAB001_INPUT/causal_labels_m1.parquet
          test -s LAB001_INPUT/audit.json
      - name: Download and verify original raw Bid-Ask ticks
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 --progress-bar -o data/xau_raw.zip 'https://github.com/chepigga/ResearchOS/releases/download/xau/CAUSAL_XAU_RAW_XAUUSD_20260825.zip'
          echo '31f9548204fa99c29ce7d09e5b64e01ff75f5e8e3efab6f747cbd410cf34fd2e  data/xau_raw.zip' | sha256sum -c -
      - name: Run LAB011
        run: |
          python research/xau_crowded_entry_underperformance_forced_exit_lab011.py \
            --bars LAB001_INPUT/m1_bidask_bars.parquet \
            --labels LAB001_INPUT/causal_labels_m1.parquet \
            --audit LAB001_INPUT/audit.json \
            --raw-zip data/xau_raw.zip \
            --outdir Results_XAU_CROWD_LAB011
      - name: Print outputs
        if: always()
        run: |
          cat Results_XAU_CROWD_LAB011/verdict.json || true
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('Results_XAU_CROWD_LAB011/candidate_transfer.csv')
          if p.exists(): print(pd.read_csv(p).head(20).to_string(index=False))
          PY
      - name: Build issue summary
        if: always() && github.event_name == 'issues'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          o=Path('Results_XAU_CROWD_LAB011'); lines=['## XAU CROWDED ENTRY UNDERPERFORMANCE + FORCED EXIT LAB011']
          v=o/'verdict.json'
          if v.exists():
            j=json.loads(v.read_text()); lines += [f"**Verdict:** `{j.get('verdict')}`",f"**Structural rows:** {j.get('structural_rows')}",f"**Eligible cells pre-2026:** {j.get('eligible_cells_pre2026')}",f"**Unique signals:** {j.get('unique_physical_signals')}",f"**Locked pre-2026:** {j.get('locked_configs_pre2026')}",f"**Locked positive 2026:** {j.get('locked_positive_2026')}",'','**Best config:**','```json',json.dumps(j.get('best_config'),indent=2),'```']
          c=o/'candidate_transfer.csv'
          if c.exists():
            d=pd.read_csv(c); cols=[x for x in ['cell','payoff','train_n','train_mean_R','train_pf','val_n','val_mean_R','val_pf','locked_before_2026','final_n','final_mean_R','final_pf'] if x in d.columns]; lines += ['','**Top configs:**','```',d[cols].head(15).to_string(index=False),'```']
          (o/'issue_comment.md').write_text('\n'.join(lines))
          PY
      - name: Comment result to issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: '${{ github.token }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
        run: |
          if [ -s Results_XAU_CROWD_LAB011/issue_comment.md ]; then gh issue comment "$ISSUE_NUMBER" --repo chepigga/ResearchOS --body-file Results_XAU_CROWD_LAB011/issue_comment.md; fi
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-crowded-entry-underperformance-forced-exit-lab011
          path: Results_XAU_CROWD_LAB011/
          if-no-files-found: warn
          retention-days: 30
