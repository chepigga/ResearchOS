name: CrowdFade LAB082 NLE continuous exhaustion score
on:
  push:
    branches: [lab/crowdfade-execution-5y-positive-005]
    paths:
      - 'labs/CROWDFADE_NLE_CONTINUOUS_EXHAUSTION_SCORE_LAB_082/**'
      - '.github/workflows/crowdfade-lab082.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab082:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy pandas scipy tabulate
      - name: Run LAB082 from frozen LAB080 events
        run: python labs/CROWDFADE_NLE_CONTINUOUS_EXHAUSTION_SCORE_LAB_082/run.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "ResearchOS Lab Runner"
          git config user.email "researchos-lab@users.noreply.github.com"
          git add labs/CROWDFADE_NLE_CONTINUOUS_EXHAUSTION_SCORE_LAB_082/output/
          if ! git diff --cached --quiet; then
            git commit -m "lab(CrowdFade): record LAB082 continuous exhaustion score"
            git push origin HEAD:lab/crowdfade-execution-5y-positive-005
          fi
