name: LAB104B Structural TP Re-entry
on:
  push:
    branches: [lab/lab104b-structural-tp-reentry-20261007]
    paths: ['.github/workflows/lab104b_structural_tp_reentry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab104b-structural-tp-reentry-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download datasets
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          curl -L --fail --retry 3 -o CF_LAB001_GetLeveraged_Ltd._BTCUSD_TICKS_30D.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/CF_LAB001_GetLeveraged_Ltd._BTCUSD_TICKS_30D.csv.zip
      - name: Run LAB104B
        run: python labs/LAB104B_STRUCTURAL_TP_REENTRY_20261007/run_lab104b.py
      - run: cat lab104b_out/LAB104B_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab104b-structural-tp-reentry
          path: lab104b_out
