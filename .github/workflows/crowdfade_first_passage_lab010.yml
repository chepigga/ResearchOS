name: crowdfade-first-passage-lab010
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths: ['labs/CROWDFADE_FIRST_PASSAGE_STOP_TARGET_LAB_010/**','.github/workflows/crowdfade_first_passage_lab010.yml']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas numba
      - name: Download 2021-2025 price + frozen flow
        run: |
          ROOT=labs/CROWDFADE_FIRST_PASSAGE_STOP_TARGET_LAB_010/data;mkdir -p "$ROOT/klines";cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          cd klines
          for Y in 2021 2022 2023 2024 2025; do for M in $(seq -w 1 12); do F=BTCUSDT-5m-${Y}-${M}.zip;wget -q "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/5m/$F" -O "$F";done;done
      - run: python labs/CROWDFADE_FIRST_PASSAGE_STOP_TARGET_LAB_010/run.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_FIRST_PASSAGE_STOP_TARGET_LAB_010/output
          git commit -m 'research(CrowdFade): LAB010 SL TP hold first-passage grid' || exit 0
          git push
