name: SELL CORE 013A LH BOS Parity
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths:
      - 'research/btc_unified_lifecycle/sell_core_013a_lh_bos_parity.py'
      - '.github/workflows/sell-core-013a-lh-bos-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy tabulate
      - name: Download frozen BTC M1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/chepigga/ResearchOS/releases/assets/511572188 -H 'Accept: application/octet-stream' > btc_1m.zip
          test "$(sha256sum btc_1m.zip|awk '{print $1}')" = "4339abbd8d23a0ee84afa4187a41be2fd41d219060e1751053b152757be9a7ea"
      - name: Run parity gate
        working-directory: research/btc_unified_lifecycle
        run: |
          cp ../../btc_1m.zip .
          python sell_core_013a_lh_bos_parity.py
          cat sell_core_013a_out/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: sell-core-013a-lh-bos-parity
          path: research/btc_unified_lifecycle/sell_core_013a_out/
