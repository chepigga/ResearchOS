name: LAB139 Production Validation Cross-Symbol
on:
  push:
    branches: [lab/lab139-production-validation-crosssymbol-20261008]
    paths: ['.github/workflows/lab139_production_validation_crosssymbol.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab139-production-validation-crosssymbol-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download frozen flow and BTC control data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          curl -L --fail --retry 3 -o ETH_flow.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/ETH_flow.csv.zip
          curl -L --fail --retry 3 -o SOL_flow.csv https://github.com/chepigga/ResearchOS/releases/download/btc/SOL_flow.csv
      - name: Download ETH/SOL Binance 5m archives
        run: |
          mkdir -p prices_ETH prices_SOL
          python - <<'PY'
          import urllib.request, pathlib
          for symbol,outdir in [('ETHUSDT','prices_ETH'),('SOLUSDT','prices_SOL')]:
              for y in range(2021,2027):
                  for m in range(1,13):
                      if (y,m)>(2026,8): break
                      fn=f"{symbol}-5m-{y:04d}-{m:02d}.zip"
                      url=f"https://data.binance.vision/data/futures/um/monthly/klines/{symbol}/5m/{fn}"
                      dst=pathlib.Path(outdir)/fn
                      try:
                          urllib.request.urlretrieve(url,dst)
                          print("OK",fn,dst.stat().st_size)
                      except Exception as e:
                          if dst.exists(): dst.unlink()
                          print("SKIP",fn,str(e)[:120])
          PY
      - name: Run LAB139
        run: python labs/LAB139_PRODUCTION_VALIDATION_CROSSSYMBOL_20261008/run_lab139.py
      - run: cat lab139_out/LAB139_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab139-production-validation-crosssymbol
          path: lab139_out

