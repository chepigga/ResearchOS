name: GC M1 Orderflow Edge Discovery 003

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/gc_m1_orderflow_edge_discovery_003.py'
      - '.github/workflows/gc_m1_orderflow_edge_discovery_003.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Run bounded discovery
        run: python research/gc/gc_m1_orderflow_edge_discovery_003.py
      - name: Commit result artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/gc/GC_M1_ORDERFLOW_EDGE_DISCOVERY_003.json \
                  research/gc/GC_M1_ORDERFLOW_EDGE_DISCOVERY_003.md \
                  research/gc/GC_M1_ORDERFLOW_EDGE_DISCOVERY_003_CANDIDATES.csv \
                  research/gc/GC_M1_ORDERFLOW_EDGE_DISCOVERY_003_WINNER_EVENTS.csv
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Record bounded GC M1 order-flow edge discovery 003'
            git push origin HEAD:gc-amp-feed-audit-001
          fi
