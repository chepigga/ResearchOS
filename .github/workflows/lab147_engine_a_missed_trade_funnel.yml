name: LAB147 Engine A Missed Trade Funnel
on:
  push:
    branches: [lab/lab147-engine-a-missed-trade-funnel-20261008]
    paths: ['.github/workflows/lab147_engine_a_missed_trade_funnel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab147-engine-a-missed-trade-funnel-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB147
        run: python labs/LAB147_ENGINE_A_MISSED_TRADE_FUNNEL_20261008/run_lab147.py
      - run: cat lab147_out/LAB147_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab147-engine-a-missed-trade-funnel
          path: lab147_out
