name: BTC XAU Context Frozen Portability LAB001
on:
  push:
    branches:
      - lab/btc-xau-context-frozen-portability-001
    paths:
      - 'labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LAB_001/**'
      - '.github/workflows/btc_xau_context_frozen_portability_lab001.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab001:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas numpy requests tabulate
      - name: Fetch frozen BTC M15 archive
        run: |
          curl -L --fail --retry 3 -o /tmp/btc_15m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_15m.zip
          echo '19acf95a3bb7a868fa1e6c8da8dbc73d4a2f7004b771e394bbee8e6c5b6e58b9  /tmp/btc_15m.zip' | sha256sum -c -
      - name: Apply frozen Context runtime parity hotfixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py')
          s=p.read_text()
          s=s.replace('d.stack.astype(float)', "d['stack'].astype(float)")
          s=s.replace('(~d.stack).astype(float)', "(~d['stack']).astype(float)")
          needle='    sm = s.rolling(3,min_periods=3).mean()'
          if needle not in s:
              needle='    sm=s.rolling(3,min_periods=3).mean()'
          if needle in s and 'ready=d[[' not in s:
              repl="    ready=d[['ema200','atr_ratio','rsi14','adx14','range24_ratio','relvol20']].notna().all(axis=1)\n    s=s.where(ready,np.nan)\n"+needle
              s=s.replace(needle,repl)
          p.write_text(s)
          PY
      - name: Run preregistered portability test
        run: |
          python labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LAB_001/run_lab.py \
            --btc15-zip /tmp/btc_15m.zip \
            --out labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LAB_001/output
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LAB_001/output
          if ! git diff --cached --quiet; then
            git commit -m 'Persist BTC XAU Context portability LAB001 outputs'
            git push origin HEAD:lab/btc-xau-context-frozen-portability-001
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: btc-xau-context-portability-lab001
          path: labs/BTC_XAU_CONTEXT_FROZEN_PORTABILITY_LAB_001/output
