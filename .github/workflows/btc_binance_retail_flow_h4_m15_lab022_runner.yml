name: BTC Binance Retail Flow X H4 M15 LAB022 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_binance_retail_flow_h4_m15_lab022_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab022:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-binance-retail-flow-direction-x-h4-pivot-m15-price-timing-022
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pandas
      - name: Inspect one Binance metrics archive schema
        shell: bash
        run: |
          set -euo pipefail
          u='https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-2023-01-21.zip'
          curl -L --fail -sS -o /tmp/metric_probe.zip "$u"
          echo '--- ZIP LIST ---'
          unzip -l /tmp/metric_probe.zip
          echo '--- CSV HEAD ---'
          unzip -p /tmp/metric_probe.zip | head -3
          echo '--- PANDAS SCHEMA ---'
          python - <<'PY'
          import zipfile,pandas as pd
          z=zipfile.ZipFile('/tmp/metric_probe.zip')
          n=[x for x in z.namelist() if x.endswith('.csv')][0]
          d=pd.read_csv(z.open(n))
          print(repr(list(d.columns)))
          print(d.dtypes)
          print(d.head(2).to_string(index=False))
          PY
          exit 1
