name: BTC Binance Retail Flow X H4 M15 LAB022 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_binance_retail_flow_h4_m15_lab022_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab022:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-binance-retail-flow-direction-x-h4-pivot-m15-price-timing-022
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas requests
      - name: Probe Binance metrics transport
        shell: bash
        run: |
          set +e
          for u in \
            'https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-2023-01-21.zip' \
            'https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT-metrics-2023-01-21.zip'; do
            echo "URL=$u"
            curl -L -sS -o /tmp/metric_probe -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "$u"
            file /tmp/metric_probe || true
            unzip -l /tmp/metric_probe 2>&1 | head -20 || true
          done
      - name: Download frozen Binance BTCUSDT M15 price data
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_15m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_15m.zip
          echo '19acf95a3bb7a868fa1e6c8da8dbc73d4a2f7004b771e394bbee8e6c5b6e58b9  btc_15m.zip' | sha256sum -c -
          mkdir -p btc15
          unzip -q btc_15m.zip -d btc15
      - name: Run frozen LAB022 with daily metrics loader
        run: python labs/BTC_BINANCE_RETAIL_FLOW_DIRECTION_X_H4_PIVOT_M15_PRICE_TIMING_LAB_022/run_lab_v2.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_BINANCE_RETAIL_FLOW_DIRECTION_X_H4_PIVOT_M15_PRICE_TIMING_LAB_022/output
          git commit -m 'Persist BTC Binance retail flow x H4 M15 LAB022 daily metrics outputs' || true
          git push origin HEAD:lab/btc-binance-retail-flow-direction-x-h4-pivot-m15-price-timing-022
      - uses: actions/upload-artifact@v4
        with:
          name: btc-binance-retail-flow-h4-m15-lab022-v2
          path: labs/BTC_BINANCE_RETAIL_FLOW_DIRECTION_X_H4_PIVOT_M15_PRICE_TIMING_LAB_022/output
