name: CrowdFade LAB085 post1R burst failure confirmation
on:
  workflow_dispatch:
  push:
    branches: [lab/crowdfade-execution-5y-positive-005]
    paths:
      - labs/CROWDFADE_POST1R_BURST_FAILURE_CONFIRMATION_LAB_085/**
      - .github/workflows/crowdfade-lab085.yml
permissions:
  contents: write
jobs:
  lab085:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas tabulate
      - name: Run LAB085
        run: python labs/CROWDFADE_POST1R_BURST_FAILURE_CONFIRMATION_LAB_085/run.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name ResearchOS
          git config user.email researchos@example.com
          git add labs/CROWDFADE_POST1R_BURST_FAILURE_CONFIRMATION_LAB_085/output/
          git diff --cached --quiet || (git commit -m "LAB085 outputs" && git push origin HEAD:lab/crowdfade-execution-5y-positive-005)
