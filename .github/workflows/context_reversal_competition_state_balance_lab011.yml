name: Context Reversal Competition State Balance LAB011
on:
  push:
    branches:
      - lab/context-reversal-competition-state-balance-audit-011
    paths:
      - 'labs/CONTEXT_REVERSAL_COMPETITION_AND_STATE_BALANCE_AUDIT_LAB_011/**'
      - '.github/workflows/context_reversal_competition_state_balance_lab011.yml'
jobs:
  lab011:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/context-reversal-competition-state-balance-audit-011
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas numpy requests
      - name: Run preregistered LAB011
        run: |
          rm -rf labs/CONTEXT_REVERSAL_COMPETITION_AND_STATE_BALANCE_AUDIT_LAB_011/output
          python labs/CONTEXT_REVERSAL_COMPETITION_AND_STATE_BALANCE_AUDIT_LAB_011/run_lab.py --out labs/CONTEXT_REVERSAL_COMPETITION_AND_STATE_BALANCE_AUDIT_LAB_011/output
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CONTEXT_REVERSAL_COMPETITION_AND_STATE_BALANCE_AUDIT_LAB_011/output
          git commit -m 'Persist Context Reversal LAB011 results' || exit 0
          git push origin HEAD:lab/context-reversal-competition-state-balance-audit-011
      - uses: actions/upload-artifact@v4
        with:
          name: context-reversal-competition-state-balance-lab011
          path: labs/CONTEXT_REVERSAL_COMPETITION_AND_STATE_BALANCE_AUDIT_LAB_011/output
