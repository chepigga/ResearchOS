name: LAB139 Production Validation ETH SOL
on:
  push:
    branches: [lab/lab139-production-validation-eth-sol-20261008]
    paths: ['.github/workflows/lab139_production_validation_eth_sol.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab139-production-validation-eth-sol-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas requests
      - name: Download flow data
        run: |
          curl -L --fail --retry 3 -o ETH_flow.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/ETH_flow.csv.zip
          curl -L --fail --retry 3 -o SOL_flow.csv https://github.com/chepigga/ResearchOS/releases/download/btc/SOL_flow.csv
      - name: Run LAB139
        run: python labs/LAB139_PRODUCTION_VALIDATION_ETH_SOL_20261008/run_lab139.py
      - run: cat lab139_out/LAB139_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab139-production-validation-eth-sol
          path: lab139_out

# rerun timestamp dtype fix
