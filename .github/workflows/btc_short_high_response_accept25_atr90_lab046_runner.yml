name: BTC SHORT High Response ACCEPT25 ATR90 LAB046 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_short_high_response_accept25_atr90_lab046_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  LAB_BRANCH: lab/btc-short-high-response-accept25-causal-atr90-regime-replication-046
  LAB_DIR: labs/BTC_SHORT_HIGH_RESPONSE_ACCEPT25_CAUSAL_ATR90_REGIME_REPLICATION_LAB_046

jobs:
  lab046:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas
      - name: Run frozen LAB046
        run: python "$LAB_DIR/run_lab.py"
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAB_DIR/output"
          git commit -m "Persist BTC SHORT ACCEPT25 ATR90 LAB046 outputs" || true
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-short-accept25-atr90-lab046
          path: ${{ env.LAB_DIR }}/output/
