name: BTC SHORT ACCEPT25 ATR Nonlinear LOPO LAB049 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_short_accept25_atr_nonlinear_lopo_lab049_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab049:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen LAB049 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-short-accept25-atr-nonlinear-shape-leave-one-period-out-stability-049
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas
      - name: Run frozen LAB049
        run: python labs/BTC_SHORT_ACCEPT25_ATR_NONLINEAR_SHAPE_AND_LEAVE_ONE_PERIOD_OUT_STABILITY_LAB_049/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_SHORT_ACCEPT25_ATR_NONLINEAR_SHAPE_AND_LEAVE_ONE_PERIOD_OUT_STABILITY_LAB_049/output
          git commit -m 'Persist BTC SHORT ACCEPT25 ATR nonlinear LOPO LAB049 outputs' || true
          git push origin HEAD:lab/btc-short-accept25-atr-nonlinear-shape-leave-one-period-out-stability-049
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_SHORT_ACCEPT25_ATR_NONLINEAR_LOPO_LAB049
          path: labs/BTC_SHORT_ACCEPT25_ATR_NONLINEAR_SHAPE_AND_LEAVE_ONE_PERIOD_OUT_STABILITY_LAB_049/output
