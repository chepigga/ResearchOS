name: BTC PAXG Cross Asset LAB001 Runner

on:
  push:
    paths:
      - '.github/workflows/btc_paxg_cross_asset_lab001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab001:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-paxg-cross-asset-001
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen causal LAB
        run: python labs/BTC_PAXG_CROSS_ASSET_DIVERGENCE_AND_RESPONSE_LAB_001/run_lab.py
      - name: Persist small outputs on research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "researchos-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add labs/BTC_PAXG_CROSS_ASSET_DIVERGENCE_AND_RESPONSE_LAB_001/output
          git commit -m "record BTC-PAXG cross-asset LAB001 result" || exit 0
          git push origin HEAD:lab/btc-paxg-cross-asset-001
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: BTC_PAXG_CROSS_ASSET_DIVERGENCE_AND_RESPONSE_LAB_001
          path: labs/BTC_PAXG_CROSS_ASSET_DIVERGENCE_AND_RESPONSE_LAB_001/output/
          if-no-files-found: error
          retention-days: 30
