name: BTC SHORT ACCEPT25 ATR x Extension LAB050 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_short_accept25_atr_x_extension_lab050_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab050:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen LAB050 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-short-accept25-atr-x-72h-extension-failure-interaction-050
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas scipy
      - name: Run frozen LAB050
        run: python labs/BTC_SHORT_ACCEPT25_ATR_X_72H_EXTENSION_FAILURE_INTERACTION_LAB_050/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_SHORT_ACCEPT25_ATR_X_72H_EXTENSION_FAILURE_INTERACTION_LAB_050/output
          git commit -m 'Persist BTC SHORT ACCEPT25 ATR x extension LAB050 outputs' || true
          git push origin HEAD:lab/btc-short-accept25-atr-x-72h-extension-failure-interaction-050
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_SHORT_ACCEPT25_ATR_X_EXTENSION_LAB050
          path: labs/BTC_SHORT_ACCEPT25_ATR_X_72H_EXTENSION_FAILURE_INTERACTION_LAB_050/output
