name: LAB108 Drift Quality Gate
on:
  push:
    branches: [lab/lab108-drift-quality-gate-20261007]
    paths: ['.github/workflows/lab108_drift_quality_gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab108-drift-quality-gate-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB108
        run: python labs/LAB108_DRIFT_QUALITY_GATE_20261007/run_lab108.py
      - run: cat lab108_out/LAB108_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab108-drift-quality-gate
          path: lab108_out
