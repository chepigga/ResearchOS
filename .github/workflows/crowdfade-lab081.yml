name: CrowdFade LAB081 NLE regime break timeline
on:
  push:
    branches: [lab/crowdfade-execution-5y-positive-005]
    paths:
      - 'labs/CROWDFADE_NLE_REGIME_BREAK_TIMELINE_LAB_081/**'
      - '.github/workflows/crowdfade-lab081.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab081:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy pandas tabulate
      - name: Run LAB081 from frozen LAB080 events
        run: python labs/CROWDFADE_NLE_REGIME_BREAK_TIMELINE_LAB_081/run.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "ResearchOS Lab Runner"
          git config user.email "researchos-lab@users.noreply.github.com"
          git add labs/CROWDFADE_NLE_REGIME_BREAK_TIMELINE_LAB_081/output/
          if ! git diff --cached --quiet; then
            git commit -m "lab(CrowdFade): record LAB081 NLE regime break timeline"
            git push origin HEAD:lab/crowdfade-execution-5y-positive-005
          fi
