name: SELL CORE 001 Inspect Funding
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths:
      - '.github/workflows/sell-core-001-inspect-funding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas
      - name: Download frozen funding assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/chepigga/ResearchOS/releases/assets/511572348 -H 'Accept: application/octet-stream' > binance_flow.py
          gh api /repos/chepigga/ResearchOS/releases/assets/511572302 -H 'Accept: application/octet-stream' > binance_btc_funding.csv
          gh api /repos/chepigga/ResearchOS/releases/assets/511572071 -H 'Accept: application/octet-stream' > BTC_FINDINGS_2026-08-10.md
      - name: Locate exact prior quartile analysis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo '=== RELEASE ASSETS: possible funding analysis ==='
          gh api /repos/chepigga/ResearchOS/releases/369236352/assets --paginate --jq '.[] | [.id,.name] | @tsv' | grep -Ei 'fund|flow|pressure|information|clock|router|feature|oracle|lab0(1[0-9]|2[0-9])' || true
          echo '=== FINDINGS FUNDING ==='
          grep -ni -C 10 'Funding —\|funding Q1\|Q4 (високий)\|funding ×' BTC_FINDINGS_2026-08-10.md || true
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('binance_btc_funding.csv')
          x['time']=pd.to_datetime(x.time,format='%Y.%m.%d %H:%M',utc=True)
          print('funding',len(x),x.time.min(),x.time.max())
          print('quartiles',x.funding.quantile([.25,.5,.75]).to_dict())
          print('value counts top')
          print(x.funding.value_counts().head(12).to_string())
          PY
