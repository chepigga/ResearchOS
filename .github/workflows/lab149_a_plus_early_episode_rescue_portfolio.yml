name: LAB149 A Plus EARLY_EPISODE Rescue Portfolio
on:
  push:
    branches: [lab/lab149-a-plus-early-episode-rescue-portfolio-20261009]
    paths: ['.github/workflows/lab149_a_plus_early_episode_rescue_portfolio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab149-a-plus-early-episode-rescue-portfolio-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB149
        run: python labs/LAB149_A_PLUS_EARLY_EPISODE_RESCUE_PORTFOLIO_20261009/run_lab149.py
      - run: cat lab149_out/LAB149_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab149-a-plus-early-episode-rescue-portfolio
          path: lab149_out
