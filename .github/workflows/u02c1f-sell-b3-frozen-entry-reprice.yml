name: U02C1F SELL B3 Frozen Entry Reprice

on:
  push:
    branches: [lab-btc-unified-lifecycle]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reprice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy tabulate
      - name: Download ledger and prior telemetry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/chepigga/ResearchOS/releases/assets/511572043 -H 'Accept: application/octet-stream' > continuation.csv
          test "$(sha256sum continuation.csv | awk '{print $1}')" = "6256b824c1e75b7170fa7f70aa4ae021cc44d4522397449eb083a2b310b6bb34"
          mkdir prior
          gh run download 31641432112 -n u02c1c-sell-b3-stop-width-frozen-m1 -D prior
          find prior -type f -maxdepth 2 -print
      - name: Reprice
        run: python research/u02c1_frozen_entry_reprice.py
      - uses: actions/upload-artifact@v4
        with:
          name: u02c1f-sell-b3-frozen-entry-reprice
          path: u02c1f/
