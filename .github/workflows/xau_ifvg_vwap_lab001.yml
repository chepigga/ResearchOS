name: BTC BUY P12 FLOW SPONSORSHIP BROAD SHELL REPLICATION LAB014 LAUNCHER

on:
  push:
    branches:
      - lab-btc-pre-bos-aggressive-flow
    paths:
      - '.github/workflows/xau_ifvg_vwap_lab001.yml'
  workflow_dispatch:

jobs:
  lab014:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy scipy scikit-learn tabulate
      - name: Download frozen Binance BTCUSDT M15 data
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_15m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_15m.zip
          echo '19acf95a3bb7a868fa1e6c8da8dbc73d4a2f7004b771e394bbee8e6c5b6e58b9  btc_15m.zip' | sha256sum -c -
          mkdir -p btc15
          unzip -q btc_15m.zip -d btc15
      - name: Run LAB014
        run: PYTHONPATH=research python research/btc_buy_p12_flow_sponsorship_broad_shell_replication_lab014.py
      - name: Upload LAB014 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-buy-p12-flow-sponsorship-broad-shell-replication-lab014
          path: lab014/
          if-no-files-found: warn
