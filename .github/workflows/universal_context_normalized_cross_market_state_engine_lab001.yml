name: Universal Context Normalized Cross-Market State Engine LAB001
on:
  push:
    branches:
      - lab/universal-context-normalized-cross-market-state-engine-001
    paths:
      - 'labs/UNIVERSAL_CONTEXT_NORMALIZED_CROSS_MARKET_STATE_ENGINE_LAB_001/**'
      - '.github/workflows/universal_context_normalized_cross_market_state_engine_lab001.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab001:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas numpy requests tabulate
      - name: Fetch fixed XAU and EUR datasets
        run: |
          curl -L --fail --retry 3 -o /tmp/XAUUSD_M1.csv https://github.com/chepigga/ResearchOS/releases/download/ak47/XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv
          echo 'db47a0cef1e666fdf27a67a23fcc290eee1bd2be2c651ecd8e080b99bf177b9b  /tmp/XAUUSD_M1.csv' | sha256sum -c -
          curl -L --fail --retry 3 -o /tmp/EURUSD_M1.csv https://github.com/chepigga/ResearchOS/releases/download/v1.0/EURUSD_M1_202301020005_202607172354.csv
          echo '09b872ae42af24ca67c525754da3266e21d96833fc9d66fe8bbdb1dac39836f5  /tmp/EURUSD_M1.csv' | sha256sum -c -
      - name: Apply technical pandas stack-name hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('labs/UNIVERSAL_CONTEXT_NORMALIZED_CROSS_MARKET_STATE_ENGINE_LAB_001/run_lab.py')
          s=p.read_text()
          s=s.replace('d.stack.astype(float)', "d['stack'].astype(float)")
          s=s.replace('(~d.stack).astype(float)', "(~d['stack']).astype(float)")
          p.write_text(s)
          PY
      - name: Run frozen LAB001
        run: |
          python labs/UNIVERSAL_CONTEXT_NORMALIZED_CROSS_MARKET_STATE_ENGINE_LAB_001/run_lab.py \
            --xau /tmp/XAUUSD_M1.csv \
            --eur /tmp/EURUSD_M1.csv \
            --out labs/UNIVERSAL_CONTEXT_NORMALIZED_CROSS_MARKET_STATE_ENGINE_LAB_001/output
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/UNIVERSAL_CONTEXT_NORMALIZED_CROSS_MARKET_STATE_ENGINE_LAB_001/output
          if ! git diff --cached --quiet; then
            git commit -m 'Persist universal normalized context LAB001 outputs'
            git push origin HEAD:lab/universal-context-normalized-cross-market-state-engine-001
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: universal-context-normalized-cross-market-state-engine-lab001
          path: labs/UNIVERSAL_CONTEXT_NORMALIZED_CROSS_MARKET_STATE_ENGINE_LAB_001/output
