name: BTC Reversal Entry Decay Limit Retest LAB005 Runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/btc_24h_reversal_entry_decay_limit_retest_lab005_runner.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab005:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-24h-reversal-entry-decay-limit-retest-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen LAB005
        run: python labs/BTC_24H_REVERSAL_ENTRY_DECAY_AND_CAUSAL_LIMIT_RETEST_LAB_005/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_24H_REVERSAL_ENTRY_DECAY_AND_CAUSAL_LIMIT_RETEST_LAB_005/output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist BTC reversal entry decay LAB005 outputs'
          git push origin HEAD:lab/btc-24h-reversal-entry-decay-limit-retest-005
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-entry-decay-limit-retest-lab005
          path: labs/BTC_24H_REVERSAL_ENTRY_DECAY_AND_CAUSAL_LIMIT_RETEST_LAB_005/output
