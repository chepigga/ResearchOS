name: SELL CORE 014 v4
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths: ['.github/workflows/sell-core-014-v4.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy tabulate
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/chepigga/ResearchOS/releases/assets/511572188 -H 'Accept: application/octet-stream' > m1.zip
          gh api /repos/chepigga/ResearchOS/releases/assets/511572122 -H 'Accept: application/octet-stream' > m5.zip
          mkdir -p research/btc_unified_lifecycle/frozen_1m research/btc_unified_lifecycle/frozen_5m
          unzip -q m1.zip -d a; find a -name '*.csv' -exec cp {} research/btc_unified_lifecycle/frozen_1m/ \;
          unzip -q m5.zip -d b; find b -name '*.csv' -exec cp {} research/btc_unified_lifecycle/frozen_5m/ \;
      - run: |
          mkdir -p research/btc_unified_lifecycle/hist_1m research/btc_unified_lifecycle/hist_5m d
          for y in 2020 2021 2022 2023; do for m in 01 02 03 04 05 06 07 08 09 10 11 12; do for tf in 1m 5m; do f="BTCUSDT-${tf}-${y}-${m}.zip"; curl -fsSL "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/${tf}/${f}" -o "d/$f"; unzip -q "d/$f" -d "research/btc_unified_lifecycle/hist_${tf}"; done; done; done
      - run: cd research/btc_unified_lifecycle && python sell_core_014_runner.py && cat sell_core_014_out/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: sell-core-014-v4
          path: research/btc_unified_lifecycle/sell_core_014_out/
