name: SELL CORE 016 Recent Exact
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths: ['.github/workflows/sell-core-014-v4.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy tabulate
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/chepigga/ResearchOS/releases/assets/511572188 -H 'Accept: application/octet-stream' > btc_1m.zip
          gh api /repos/chepigga/ResearchOS/releases/assets/511572122 -H 'Accept: application/octet-stream' > btc_5m.zip
      - run: |
          python research/btc_unified_lifecycle/sell_core_016_2026_edge_source_decomposition.py
          cat sell_core_016_out/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: sell-core-016-edge-source-decomposition
          path: sell_core_016_out/
