name: Rithmic XAU Execution Fingerprint Reconstruction 002

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/rithmic_xau_execution_fingerprint_reconstruction_002.py'
      - '.github/workflows/rithmic_xau_execution_fingerprint_reconstruction_002.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
          fetch-depth: 0
      - run: python -m pip install --quiet pandas numpy
      - name: Download XAU history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download GC -p 'XAUUSD_M1_2026.csv' --clobber
      - name: Run historical execution reconstruction
        run: python research/gc/rithmic_xau_execution_fingerprint_reconstruction_002.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gc/RITHMIC_XAU_EXECUTION_FINGERPRINT_RECONSTRUCTION_002.json \
                  research/gc/RITHMIC_XAU_EXECUTION_FINGERPRINT_RECONSTRUCTION_002.md \
                  research/gc/RITHMIC_XAU_EXECUTION_FINGERPRINT_RECONSTRUCTION_002_CANDIDATES.csv
          git commit -m "Record historical XAU execution fingerprint reconstruction"
          git push origin HEAD:gc-amp-feed-audit-001
