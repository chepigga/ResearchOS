name: CrowdFade LAB097 M15 M30 confirmed reversal
on:
  workflow_dispatch:
  push:
    branches: [lab/crowdfade-execution-5y-positive-005]
    paths:
      - labs/CROWDFADE_LAB097_M15_M30_CONFIRMED_REVERSAL/**
      - .github/workflows/crowdfade-lab097.yml
permissions:
  contents: write
jobs:
  lab097:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas scipy scikit-learn tabulate
      - name: Run LAB097
        run: python labs/CROWDFADE_LAB097_M15_M30_CONFIRMED_REVERSAL/run.py
      - name: Commit outputs
        shell: bash
        run: |
          git config user.name ResearchOS
          git config user.email researchos@example.com
          git add labs/CROWDFADE_LAB097_M15_M30_CONFIRMED_REVERSAL/output/
          git diff --cached --quiet || (git commit -m "LAB097 outputs" && git push origin HEAD:lab/crowdfade-execution-5y-positive-005)
