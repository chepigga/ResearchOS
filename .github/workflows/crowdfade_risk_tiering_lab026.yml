name: crowdfade-risk-tiering-lab026

on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_RISK_TIERING_LAB_026/**'
      - '.github/workflows/crowdfade_risk_tiering_lab026.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}

    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - run: python -m pip install -q numpy pandas

      - name: Run LAB026 risk tiering
        run: python labs/CROWDFADE_RISK_TIERING_LAB_026/run.py

      - name: Commit LAB026 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_RISK_TIERING_LAB_026/output
          git commit -m 'research(CrowdFade): LAB026 risk-tiering results' || exit 0
          git push
