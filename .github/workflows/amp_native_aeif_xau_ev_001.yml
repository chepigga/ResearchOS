name: AMP Native AEIF XAU EV 001

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/amp_native_aeif_xau_ev_001.py'
      - '.github/workflows/amp_native_aeif_xau_ev_001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
          fetch-depth: 0
      - name: Install deps
        run: python -m pip install --quiet pandas numpy
      - name: Download XAU history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download GC -p 'XAUUSD_M1_2026.csv' --clobber
      - name: Run frozen AMP-native XAU EV test
        run: python research/gc/amp_native_aeif_xau_ev_001.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gc/AMP_NATIVE_AEIF_XAU_EV_001_TRADES.csv \
                  research/gc/AMP_NATIVE_AEIF_XAU_EV_001_RESULT.json \
                  research/gc/AMP_NATIVE_AEIF_XAU_EV_001.md
          git commit -m "Freeze AMP-native AEIF XAU EV result"
          git push origin HEAD:gc-amp-feed-audit-001
