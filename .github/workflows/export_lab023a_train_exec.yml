name: export_lab023a_train_exec
on:
  push:
    paths:
      - ".github/workflows/export_lab023a_train_exec.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: LAB023A_W1_W5_TRAIN_EXEC
          path: |
            Projects/GC_XAU/LAB023A_W1_TRAIN_EXEC.json
            Projects/GC_XAU/LAB023A_W2_TRAIN_EXEC.json
            Projects/GC_XAU/LAB023A_W3_TRAIN_EXEC.json
            Projects/GC_XAU/LAB023A_W4_TRAIN_EXEC.json
            Projects/GC_XAU/LAB023A_W5_TRAIN_EXEC.json
          if-no-files-found: error
          retention-days: 1
