name: BTC Retail Flow Two-Close Failure LAB029 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_retail_flow_two_close_failure_lab029_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab029:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-retail-flow-acceptance-two-close-failure-persistence-survival-execution-029
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download frozen Binance BTCUSDT M15 and M1 data
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_15m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_15m.zip
          echo '19acf95a3bb7a868fa1e6c8da8dbc73d4a2f7004b771e394bbee8e6c5b6e58b9  btc_15m.zip' | sha256sum -c -
          curl -L --fail --retry 3 -o btc_1m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_1m.zip
          echo '4339abbd8d23a0ee84afa4187a41be2fd41d219060e1751053b152757be9a7ea  btc_1m.zip' | sha256sum -c -
          mkdir -p btc15 btc1
          unzip -q btc_15m.zip -d btc15
          unzip -q btc_1m.zip -d btc1
      - name: Run frozen LAB029
        run: python labs/BTC_RETAIL_FLOW_ACCEPTANCE_TWO_CLOSE_FAILURE_PERSISTENCE_AND_SURVIVAL_EXECUTION_LAB_029/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_RETAIL_FLOW_ACCEPTANCE_TWO_CLOSE_FAILURE_PERSISTENCE_AND_SURVIVAL_EXECUTION_LAB_029/output
          git commit -m 'Persist BTC retail flow two-close failure LAB029 outputs' || true
          git push origin HEAD:lab/btc-retail-flow-acceptance-two-close-failure-persistence-survival-execution-029
      - uses: actions/upload-artifact@v4
        with:
          name: btc-retail-flow-two-close-failure-lab029
          path: labs/BTC_RETAIL_FLOW_ACCEPTANCE_TWO_CLOSE_FAILURE_PERSISTENCE_AND_SURVIVAL_EXECUTION_LAB_029/output
