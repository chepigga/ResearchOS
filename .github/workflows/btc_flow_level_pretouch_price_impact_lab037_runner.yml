name: BTC Flow Level Pretouch Price Impact LAB037 Runner

on:
  push:
    paths:
      - '.github/workflows/btc_flow_level_pretouch_price_impact_lab037_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab037:
    runs-on: ubuntu-latest
    env:
      LAB_BRANCH: lab/btc-flow-level-pretouch-volume-price-impact-efficiency-absorption-037
      LAB_DIR: labs/BTC_FLOW_LEVEL_PRETOUCH_VOLUME_PRICE_IMPACT_EFFICIENCY_AND_ABSORPTION_LAB_037
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas scipy requests
      - name: Run frozen LAB037
        run: python "$LAB_DIR/run_lab.py"
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAB_DIR/output"
          git diff --cached --quiet || git commit -m "Persist BTC flow pretouch price impact LAB037 outputs"
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-flow-level-pretouch-price-impact-lab037
          path: ${{ env.LAB_DIR }}/output
