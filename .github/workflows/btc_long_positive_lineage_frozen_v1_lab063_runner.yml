name: BTC LONG Positive Lineage Frozen V1 LAB063 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_long_positive_lineage_frozen_v1_lab063_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab063:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAB063 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-long-positive-lineage-reconciliation-frozen-v1-063
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -q numpy pandas requests tabulate

      - name: Stage frozen BTC M1/M5 release data
        run: |
          curl -L --fail --retry 3 -o btc_1m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_1m.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip

      - name: Run LAB063
        run: python labs/BTC_LONG_POSITIVE_LINEAGE_RECONCILIATION_AND_FROZEN_V1_LAB_063/run_lab.py

      - name: Persist LAB063 outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_LONG_POSITIVE_LINEAGE_RECONCILIATION_AND_FROZEN_V1_LAB_063/output
          git commit -m 'Persist BTC LONG frozen v1 LAB063 outputs' || true
          git push origin HEAD:lab/btc-long-positive-lineage-reconciliation-frozen-v1-063

      - uses: actions/upload-artifact@v4
        with:
          name: BTC_LONG_POSITIVE_LINEAGE_FROZEN_V1_LAB063
          path: labs/BTC_LONG_POSITIVE_LINEAGE_RECONCILIATION_AND_FROZEN_V1_LAB_063/output
