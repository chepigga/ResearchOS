name: BTC H4 LAB059 Input Probe

on:
  push:
    branches: [lab059-h4-long-oos]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe btc_15m release asset
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pandas numpy
          mkdir -p lab059_probe
          curl -L --fail --retry 3 -o lab059_probe/btc_15m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_15m.zip
          sha256sum lab059_probe/btc_15m.zip | tee lab059_probe/SHA256.txt
          unzip -l lab059_probe/btc_15m.zip | tee lab059_probe/ZIP_LIST.txt
          unzip -q lab059_probe/btc_15m.zip -d lab059_probe/data
          python - <<'PY'
          import os, glob, json
          import pandas as pd
          files=sorted(glob.glob('lab059_probe/data/**/*.csv', recursive=True))
          rows=[]; mins=[]; maxs=[]; sample=None
          for p in files:
              d=pd.read_csv(p)
              rec={'path':p,'size':os.path.getsize(p),'rows':len(d),'columns':list(d.columns)}
              if sample is None: sample=d.head(3).to_dict('records')
              # Binance monthly files: first column is open time in ms when unnamed schema
              c=d.columns[0]
              s=d[c]
              if pd.api.types.is_numeric_dtype(s):
                  t=pd.to_datetime(s, unit='ms', errors='coerce', utc=True)
              else:
                  t=pd.to_datetime(s, errors='coerce', utc=True)
              rec['min_time']=str(t.min()); rec['max_time']=str(t.max())
              mins.append(t.min()); maxs.append(t.max()); rows.append(rec)
          out={'files':len(files),'rows_total':sum(x['rows'] for x in rows),'min_time':str(min(mins)),'max_time':str(max(maxs)),'columns':rows[0]['columns'] if rows else [],'sample':sample,'per_file':rows}
          open('lab059_probe/PROBE.json','w').write(json.dumps(out,indent=2,default=str))
          print(json.dumps({k:v for k,v in out.items() if k!='per_file'},indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_H4_LAB059_INPUT_PROBE
          path: lab059_probe/
          retention-days: 7
