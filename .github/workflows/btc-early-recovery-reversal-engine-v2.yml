name: BTC Early Recovery Reversal Engine V2

on:
  push:
    branches: [lab-btc-early-recovery-reversal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet pandas numpy
      - name: Test short-horizon early recovery engine
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          test "$(sha256sum btc_5m.zip|awk '{print $1}')" = "13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd"
          python - <<'PY'
          import zipfile, math
          import numpy as np, pandas as pd

          SPREAD_USD=27.5
          TRAIN_END=pd.Timestamp('2023-12-31 23:59:59')
          OOS_START=pd.Timestamp('2024-01-01')

          def pf(x):
              x=pd.Series(x).dropna(); gp=x[x>0].sum(); gl=-x[x<0].sum(); return float(gp/gl) if gl>0 else float('inf')
          def weeks(g):
              if len(g)<2:return np.nan
              return max((g.event_time.max()-g.event_time.min()).total_seconds()/604800,1e-9)
          def stat(g,col):
              return (len(g), float(g[col].mean()) if len(g) else np.nan, pf(g[col]) if len(g) else np.nan, float((g[col]>0).mean()) if len(g) else np.nan, len(g)/weeks(g) if len(g)>1 else np.nan)
          def show(label,g):
              vals=[]
              for h in [1,2,4,8,48]:
                  col=f'net{h}h'; n,evv,pfv,wr,freq=stat(g.dropna(subset=[col]),col); vals.append(f'{h}h:N{n},EV{evv:+.4f},PF{pfv:.3f},WR{wr:.3f}')
              print('STAT',label,'FREQ_W',f'{(len(g)/weeks(g) if len(g)>1 else np.nan):.3f}',' | '.join(vals))

          # ---------- data ----------
          frames=[]
          with zipfile.ZipFile('btc_5m.zip') as z:
              for n in sorted(x for x in z.namelist() if x.endswith('.csv')):
                  with z.open(n) as f: frames.append(pd.read_csv(f))
          b=pd.concat(frames,ignore_index=True); b.time=pd.to_datetime(b.time,utc=True).dt.tz_localize(None)
          for c in ['open','high','low','close']: b[c]=pd.to_numeric(b[c],errors='coerce')
          b=b.dropna(subset=['time','open','high','low','close']).sort_values('time').drop_duplicates('time',keep='last').reset_index(drop=True)
          print('DATA',b.time.min(),b.time.max(),len(b))
          def rs(rule):
              x=b.set_index('time').resample(rule,label='left',closed='left').agg(open=('open','first'),high=('high','max'),low=('low','min'),close=('close','last')).dropna().reset_index(); x['close_time']=x.time+pd.Timedelta(rule); return x
          m=rs('15min'); h=rs('1h')
          def atr(df,p=14):
              pc=df.close.shift(1); tr=pd.concat([df.high-df.low,(df.high-pc).abs(),(df.low-pc).abs()],axis=1).max(axis=1); return tr.ewm(alpha=1/p,adjust=False,min_periods=p).mean()
          h['atr14']=atr(h); h['d3']=(h.close-h.close.shift(3))/h.atr14; h['d6']=(h.close-h.close.shift(6))/h.atr14; h['d12']=(h.close-h.close.shift(12))/h.atr14
          h['accel3v6']=h.d3-0.5*h.d6

          # ---------- exact RAW LAB020-style global first touch, age 2..200 ----------
          raw=[]; N=len(m); bull=(m.low>m.high.shift(2)).to_numpy(); bear=(m.high<m.low.shift(2)).to_numpy()
          for side,mask,nearcol,hitcol,cmp in [('BUY',bull,'low','low','le'),('SELL',bear,'high','high','ge')]:
              for j in np.flatnonzero(mask):
                  near=float(m.loc[j,nearcol]); far=float(m.loc[j-2,'high'] if side=='BUY' else m.loc[j-2,'low']); k0=j+2; k1=min(j+200,N-1)
                  if k0>k1:continue
                  z=m.loc[k0:k1,hitcol].to_numpy(float); hit=np.flatnonzero(z<=near) if cmp=='le' else np.flatnonzero(z>=near)
                  if hit.size:
                      k=k0+int(hit[0]); raw.append((m.loc[j,'time'],m.loc[k,'time'],side,j,k,k-j,near,far))
          ev=pd.DataFrame(raw,columns=['fvg_time','event_time','side','birth_idx','touch_idx','age_bars','entry','far_edge']).sort_values('event_time').reset_index(drop=True)
          ev['d']=np.where(ev.side.eq('BUY'),1.0,-1.0)
          print('RAW_COUNTS',ev.side.value_counts().to_dict(),'REPORT_APPROX_BUY=21963 SELL=20678')

          # New LAB feature definition is EXPLICITLY independent of frozen LAB020 H1 implementation:
          # last fully closed H1 bar, Wilder ATR14, close displacement 3/6/12 hours.
          ev=pd.merge_asof(ev.sort_values('event_time'),h[['close_time','atr14','d3','d6','d12','accel3v6']].sort_values('close_time'),left_on='event_time',right_on='close_time',direction='backward',allow_exact_matches=True)
          for c in ['d3','d6','d12','accel3v6']: ev['h1_'+c]=ev.d*ev[c]

          # Causal local sequence features from bars COMPLETED before the touch bar.
          C=m.close.to_numpy(float); O=m.open.to_numpy(float); H=m.high.to_numpy(float); L=m.low.to_numpy(float)
          idx=ev.touch_idx.to_numpy(int); d=ev.d.to_numpy(float); den=ev.atr14.to_numpy(float)
          def take(a,ii):
              out=np.full(len(ii),np.nan); ok=(ii>=0)&(ii<len(a)); out[ok]=a[ii[ok]]; return out
          prev=idx-1
          for nb,name in [(1,'m15_15m'),(2,'m15_30m'),(4,'m15_1h'),(8,'m15_2h')]:
              ev[name]=d*(take(C,prev)-take(C,prev-nb))/den
          # rejection/position of prior closed bar, signed
          rng=(take(H,prev)-take(L,prev)); body=(take(C,prev)-take(O,prev)); ev['prev_body_signed']=d*body/np.where(rng>0,rng,np.nan)
          ev['fvg_size_h1atr']=(ev.entry-ev.far_edge).abs()/ev.atr14

          # ---------- short-horizon close return + next-bar-safe MFE/MAE ----------
          for hh in [1,2,4,8,48]:
              bars=hh*4; gross=np.full(len(ev),np.nan); mfe=np.full(len(ev),np.nan); mae=np.full(len(ev),np.nan)
              for ii,r in enumerate(ev.itertuples(index=False)):
                  k=int(r.touch_idx); end=k+bars-1
                  if end>=N:continue
                  entry=float(r.entry); dd=1.0 if r.side=='BUY' else -1.0
                  gross[ii]=dd*(C[end]-entry)/entry*100.0
                  # path starts next bar to avoid unknown ordering inside the touch bar
                  a=k+1; z=min(end,N-1)
                  if a<=z:
                      if dd>0:
                          mfe[ii]=(np.max(H[a:z+1])-entry)/entry*100.0; mae[ii]=(np.min(L[a:z+1])-entry)/entry*100.0
                      else:
                          mfe[ii]=(entry-np.min(L[a:z+1]))/entry*100.0; mae[ii]=(entry-np.max(H[a:z+1]))/entry*100.0
              ev[f'gross{hh}h']=gross; ev[f'net{hh}h']=gross-SPREAD_USD/ev.entry*100.0; ev[f'mfe{hh}h']=mfe; ev[f'mae{hh}h']=mae
          ev['year']=ev.event_time.dt.year

          # ---------- frozen young shell from manual-recall hypothesis ----------
          young=ev[ev.age_bars.between(2,10)&ev.atr14.notna()].copy()
          shell=pd.concat([young[(young.side=='BUY')&(young.h1_d6<0)],young[(young.side=='SELL')&(young.h1_d6>0)]]).sort_values('event_time').reset_index(drop=True)
          shell['branch']=np.where(shell.side.eq('BUY'),'BUY_RECOVERY','SELL_ACCEL')
          # preregistered sequence vote; report all scores, no optimization.
          # local 1h momentum in trade direction; 2h momentum in trade direction; H1 short-vs-medium acceleration in trade direction.
          shell['seq_score']=(shell.m15_1h>0).astype(int)+(shell.m15_2h>0).astype(int)+(shell.h1_accel3v6>0).astype(int)

          print('\n=== SHELL SHORT HORIZONS ===')
          show('FULL',shell)
          show('TRAIN_LE2023',shell[shell.event_time<=TRAIN_END])
          show('OOS_2024_26',shell[shell.event_time>=OOS_START])
          for side in ['BUY','SELL']:
              show('OOS_'+side,shell[(shell.event_time>=OOS_START)&shell.side.eq(side)])

          print('\n=== OOS SEQUENCE SCORE ===')
          oo=shell[shell.event_time>=OOS_START]
          for side in ['BUY','SELL']:
              for sc in range(4): show(f'OOS_{side}_SEQ{sc}',oo[(oo.side==side)&(oo.seq_score==sc)])
          for sc in range(4): show(f'OOS_COMBINED_SEQ{sc}',oo[oo.seq_score==sc])

          print('\n=== YEARLY SEQ2PLUS ===')
          sel=shell[(shell.seq_score>=2)&shell.net2h.notna()].copy()
          for side in ['BUY','SELL']:
              for y,g in sel[(sel.side==side)&(sel.year>=2020)].groupby('year'):
                  n,evv,pfv,wr,f=stat(g,'net2h'); print(f'YEAR {side} {y} N={n} EV2H={evv:+.5f} PF={pfv:.3f} WR={wr:.3f}')
          for y,g in sel[sel.year>=2020].groupby('year'):
              n,evv,pfv,wr,f=stat(g,'net2h'); print(f'YEAR COMBINED {y} N={n} EV2H={evv:+.5f} PF={pfv:.3f} WR={wr:.3f}')

          # Outcome geometry for OOS score>=2: is there an early move even when 48h dies?
          print('\n=== DELIVERY GEOMETRY OOS SEQ2PLUS ===')
          z=sel[sel.event_time>=OOS_START]
          for side in ['BUY','SELL']:
              g=z[z.side==side]
              if len(g):
                  print('GEOM',side,'N',len(g),'MFE2H_med',g.mfe2h.median(),'MFE2H_p75',g.mfe2h.quantile(.75),'MAE2H_med',g.mae2h.median(),'P_MFE2H_GT_0.2',float((g.mfe2h>.2).mean()),'P_MFE2H_GT_0.4',float((g.mfe2h>.4).mean()))

          # ---------- manual fingerprint and recall, UNCENSORED ----------
          manual=pd.DataFrame([
              ('2026-08-06 17:11:08','BUY',64513.40,342.68,'BTC_AI_BUY_FIN150'),
              ('2026-08-07 21:35:30','SELL',64755.65,401.14,'BTC_MARKET_SELL'),
              ('2026-08-09 02:15:14','BUY',64911.36,-3.45,'BTC_AI_BUY_FIN150'),
              ('2026-08-09 09:00:37','BUY',64778.35,43.76,'BTC_AI_BUY_FIN150'),
              ('2026-08-09 10:55:14','BUY',64795.70,86.21,'BTC_AI_BUY_FIN150'),
              ('2026-08-09 12:00:07','BUY',64793.03,127.60,'BTC_AI_BUY_FIN150'),
              ('2026-08-09 18:04:02','SELL',65185.80,15.43,'BTC_MARKET_SELL'),
              ('2026-08-10 17:08:08','SELL',64672.38,290.28,'BTC_MARKET_SELL'),
              ('2026-08-10 19:54:15','SELL',63849.46,-79.16,'BTC_MARKET_SELL')],columns=['mt5_time','side','price','manual_profit','cluster'])
          manual.mt5_time=pd.to_datetime(manual.mt5_time); manual['engine_time']=manual.mt5_time-pd.Timedelta(hours=3)
          rows=[]
          for r in manual.itertuples(index=False):
              same=ev[ev.side.eq(r.side)].copy(); same['delta']=(same.event_time-r.engine_time).abs().dt.total_seconds()/60
              q=same.loc[same.delta.idxmin()]
              sh=shell[shell.side.eq(r.side)].copy(); sh['delta']=(sh.event_time-r.engine_time).abs().dt.total_seconds()/60
              qs=sh.loc[sh.delta.idxmin()] if len(sh) else None
              rows.append((r.mt5_time,r.side,r.manual_profit,r.cluster,q.event_time,float(q.delta),int(q.age_bars),float(q.h1_d6),float(q.m15_1h),float(q.m15_2h),float(q.h1_accel3v6),int(((q.m15_1h>0)+(q.m15_2h>0)+(q.h1_accel3v6>0))), bool(qs is not None and qs.delta<=90),qs.event_time if qs is not None and qs.delta<=90 else pd.NaT,float(qs.delta) if qs is not None and qs.delta<=90 else np.nan,int(qs.seq_score) if qs is not None and qs.delta<=90 else -1))
          mr=pd.DataFrame(rows,columns=['mt5_time','side','manual_profit','cluster','raw_time','raw_delta','raw_age','raw_h1d6','raw_m15_1h','raw_m15_2h','raw_accel','raw_seq','shell90','shell_time','shell_delta','shell_seq'])
          print('\n=== MANUAL_FINGERPRINT ==='); print(mr.to_string(index=False))
          print('MANUAL_RAW90',float((mr.raw_delta<=90).mean()),'MANUAL_SHELL90',float(mr.shell90.mean()))
          for cl,g in mr.groupby('cluster'): print('MANUAL_CLUSTER',cl,'N',len(g),'RAW90',float((g.raw_delta<=90).mean()),'SHELL90',float(g.shell90.mean()),'SEQ2PLUS_SHARE_SHELL',float((g.loc[g.shell90,'shell_seq']>=2).mean()) if g.shell90.any() else np.nan)

          # architecture verdict based on OOS 2h, with 4h confirmation; 48h explicitly secondary.
          print('\n=== VERDICT ===')
          for side in ['BUY','SELL']:
              g=oo[(oo.side==side)&(oo.seq_score>=2)].dropna(subset=['net2h','net4h'])
              e2=g.net2h.mean() if len(g) else np.nan; e4=g.net4h.mean() if len(g) else np.nan; posyears=int((g.groupby('year').net2h.mean()>0).sum()) if len(g) else 0
              print('BRANCH',side,'N',len(g),'FREQ_W',len(g)/weeks(g) if len(g)>1 else np.nan,'EV2H',e2,'PF2H',pf(g.net2h),'EV4H',e4,'PF4H',pf(g.net4h),'POS_YEARS_2H',posyears,'OF',g.year.nunique())
          comb=oo[oo.seq_score>=2].dropna(subset=['net2h','net4h'])
          print('COMBINED','N',len(comb),'FREQ_W',len(comb)/weeks(comb),'EV2H',comb.net2h.mean(),'PF2H',pf(comb.net2h),'EV4H',comb.net4h.mean(),'PF4H',pf(comb.net4h),'WR2H',float((comb.net2h>0).mean()))
          PY
