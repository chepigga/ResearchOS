name: LAB101 CrowdFade State Machine
on:
  push:
    branches:
      - lab/lab101-crowdfade-state-machine-sim-20261007
    paths:
      - '.github/workflows/lab101_crowdfade_state_machine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab101-crowdfade-state-machine-sim-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download datasets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB101
        run: python labs/LAB101_CROWDFADE_STATE_MACHINE_20261007/run_lab101.py
      - name: Show report
        run: cat lab101_state_machine_out/LAB101_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab101-crowdfade-state-machine
          path: lab101_state_machine_out
