name: crowdfade-v200-retrace-relaxation-lab052

on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_V200_RETRACE_RELAXATION_DIAG_LAB_052/**'
      - '.github/workflows/crowdfade_v200_retrace_relaxation_lab052.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas
      - name: Download Binance 1m paths
        run: |
          D=labs/CROWDFADE_V200_RETRACE_RELAXATION_DIAG_LAB_052/data
          mkdir -p "$D"
          for S in BTCUSDT ETHUSDT SOLUSDT; do
            wget -q "https://data.binance.vision/data/futures/um/daily/klines/$S/1m/$S-1m-2026-09-24.zip" -O "$D/$S-1m-2026-09-24.zip"
          done
      - name: Run LAB052
        run: python labs/CROWDFADE_V200_RETRACE_RELAXATION_DIAG_LAB_052/run.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_V200_RETRACE_RELAXATION_DIAG_LAB_052/output
          git commit -m 'research(CrowdFade): LAB052 V200 retrace relaxation results' || exit 0
          git push
