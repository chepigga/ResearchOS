name: LAB100 Historical Z-Turn Sweep
on:
  push:
    branches:
      - lab/lab100-zturn-historical-20261007
    paths:
      - '.github/workflows/lab100_zturn_historical_20261007.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab100-zturn-historical-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download historical datasets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          ls -lh BTCUSDT_flow_2021-01-2026-08.csv.zip btc_5m.zip
      - name: Run LAB100
        run: python labs/LAB100_ZTURN_HISTORICAL_20261007/run_lab100.py
      - name: Show report
        run: cat lab100_hist_out/LAB100_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab100-zturn-historical-20261007
          path: lab100_hist_out

