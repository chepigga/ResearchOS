name: Finalize FXArena ContPrimary v1.22 source

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fxarena-contprimary-v122
    paths:
      - '.github/workflows/reconstruct-fxarena-contprimary-v122.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fxarena-contprimary-v122

      - name: Reconstruct and verify source
        run: bash Projects/FXArena/Releases/v1.2/ContPrimary_v1_22/reconstruct_source.sh

      - name: Verify exact source hash
        run: |
          echo "d9cabc9267d0bf8bff6d42d4f4faddcbf138cd87f2a7494e78d0f372550b781d  Projects/FXArena/Code/MQL5/FXArena_ContPrimary_v122.mq5" | sha256sum -c -

      - name: Remove transport-only reconstruction files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Projects/FXArena/Code/MQL5/FXArena_ContPrimary_v122.mq5
          git rm -r Projects/FXArena/Releases/v1.2/ContPrimary_v1_22/source_parts
          git rm Projects/FXArena/Releases/v1.2/ContPrimary_v1_22/reconstruct_source.sh
          git rm .github/workflows/reconstruct-fxarena-contprimary-v122.yml
          git commit -m "Finalize FXArena ContPrimary v1.22 release"
          git push
