name: GC SHORT Chris AEIF Delayed Resolution Path LAB004

on:
  push:
    branches: [ gc-amp-feed-audit-001 ]
    paths:
      - 'research/gc/gc_short_chris_aeif_delayed_resolution_path_lab_004.py'
      - 'research/gc/GC_SHORT_CHRIS_AEIF_DELAYED_RESOLUTION_PATH_LAB_004_PREREG.md'
      - '.github/workflows/gc_short_chris_aeif_delayed_resolution_path_lab_004.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delayed-resolution-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn scipy
      - name: Compile-check
        run: python -m py_compile research/gc/gc_short_chris_aeif_delayed_resolution_path_lab_004.py
      - name: Run LAB004
        run: python research/gc/gc_short_chris_aeif_delayed_resolution_path_lab_004.py
      - name: Commit LAB004 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gc/GC_SHORT_CHRIS_AEIF_DELAYED_RESOLUTION_PATH_LAB_004.*
          git diff --cached --quiet || git commit -m "Record GC SHORT Chris AEIF delayed-resolution path LAB004 results"
          git push origin HEAD:gc-amp-feed-audit-001
