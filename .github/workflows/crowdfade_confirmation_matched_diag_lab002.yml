name: CrowdFade Confirmation Matched-Date Diagnostic LAB002
on:
  push:
    branches:
      - lab/crowdfade-confirmation-entry-causal-oos-002
    paths:
      - '.github/workflows/crowdfade_confirmation_matched_diag_lab002.yml'
      - 'labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/posthoc_matched_dates.py'
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-confirmation-entry-causal-oos-002
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - run: python labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/posthoc_matched_dates.py
      - name: Persist diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_CONFIRMATION_ENTRY_CAUSAL_OOS_LAB_002/diagnostic_output/matched_dates.json
          git commit -m 'research(CrowdFade): persist LAB002 matched-date diagnostic' || true
          git push origin HEAD:lab/crowdfade-confirmation-entry-causal-oos-002
