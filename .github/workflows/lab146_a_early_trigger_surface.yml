name: LAB146 A Early Trigger Surface
on:
  push:
    branches: [lab/lab146-a-early-trigger-surface-20261008]
    paths: ['.github/workflows/lab146_a_early_trigger_surface.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab146-a-early-trigger-surface-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB146
        run: python labs/LAB146_A_EARLY_TRIGGER_SURFACE_20261008/run_lab146.py
      - run: cat lab146_out/LAB146_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab146-a-early-trigger-surface
          path: lab146_out
