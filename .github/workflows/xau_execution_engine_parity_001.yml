name: XAU Execution Engine Parity 001

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/xau_execution_engine_parity_001.py'
      - '.github/workflows/xau_execution_engine_parity_001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
          fetch-depth: 0
      - run: python -m pip install --quiet pandas numpy
      - name: Download XAU history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download GC -p 'XAUUSD_M1_2026.csv' --clobber
      - name: Run parity check
        run: python research/gc/xau_execution_engine_parity_001.py
      - name: Commit parity outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gc/XAU_EXECUTION_ENGINE_PARITY_001.json research/gc/XAU_EXECUTION_ENGINE_PARITY_001.md
          git commit -m "Record XAU execution engine parity check"
          git push origin HEAD:gc-amp-feed-audit-001
