name: BTC SHORT v1 Full System Postfreeze LAB055 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_short_v1_full_system_postfreeze_lab055_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab055:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen LAB055 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-short-v1-frozen-full-system-postfreeze-replication-055
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas requests
      - name: Computational-only UTC and parity-window plumbing fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('labs/BTC_SHORT_V1_FROZEN_FULL_SYSTEM_POSTFREEZE_REPLICATION_LAB_055/run_lab.py')
          s=p.read_text()
          s=s.replace("pd.date_range('2026-09-01',DAILY_END,freq='D')", "pd.date_range(pd.Timestamp('2026-09-01',tz='UTC'),DAILY_END,freq='D')")
          old="x=flow[(flow.signal_time>=AUG0)&(flow.signal_time<SEP0)][['signal_time','side']].drop_duplicates(); y=fz[(fz.signal_time>=AUG0)&(fz.signal_time<SEP0)][['signal_time','side']].drop_duplicates()"
          new="y=fz[(fz.signal_time>=AUG0)&(fz.signal_time<SEP0)][['signal_time','side']].drop_duplicates(); frozen_end=y.signal_time.max(); x=flow[(flow.signal_time>=AUG0)&(flow.signal_time<=frozen_end)][['signal_time','side']].drop_duplicates()"
          if old not in s:
              raise RuntimeError('Expected parity source line not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Run frozen LAB055
        run: python labs/BTC_SHORT_V1_FROZEN_FULL_SYSTEM_POSTFREEZE_REPLICATION_LAB_055/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_SHORT_V1_FROZEN_FULL_SYSTEM_POSTFREEZE_REPLICATION_LAB_055/output
          git commit -m 'Persist BTC SHORT v1 full-system LAB055 outputs' || true
          git push origin HEAD:lab/btc-short-v1-frozen-full-system-postfreeze-replication-055
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_SHORT_V1_FULL_SYSTEM_POSTFREEZE_LAB055
          path: labs/BTC_SHORT_V1_FROZEN_FULL_SYSTEM_POSTFREEZE_REPLICATION_LAB_055/output
