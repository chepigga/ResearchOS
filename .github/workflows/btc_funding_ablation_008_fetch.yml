name: btc-sell-core-replication-009-bundle
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/btc_funding_ablation_008_fetch.yml']
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab-btc-v283-market-clock-matrix
          fetch-depth: 1
      - name: Bundle historical BTC market-clock research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp -a research/btc_unified_lifecycle bundle/
          find bundle/btc_unified_lifecycle -type f | sort > bundle/FILES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: btc-market-clock-full-research
          path: bundle/
