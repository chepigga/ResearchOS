name: LAB141-144 Execution Optimization
on:
  push:
    branches: [lab/lab141-144-execution-optimization-20261008]
    paths: ['.github/workflows/lab141_144_execution_optimization.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab141-144-execution-optimization-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: LAB141
        run: python labs/LAB141_144_EXECUTION_OPTIMIZATION_20261008/run_lab141.py
      - name: LAB142
        run: python labs/LAB141_144_EXECUTION_OPTIMIZATION_20261008/run_lab142.py
      - name: LAB143
        run: python labs/LAB141_144_EXECUTION_OPTIMIZATION_20261008/run_lab143.py
      - name: LAB144
        run: python labs/LAB141_144_EXECUTION_OPTIMIZATION_20261008/run_lab144.py
      - name: Reports
        run: |
          cat lab141_out/LAB141_REPORT.md
          cat lab142_out/LAB142_REPORT.md
          cat lab143_out/LAB143_REPORT.md
          cat lab144_out/LAB144_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab141-144-execution-optimization
          path: |
            lab141_out
            lab142_out
            lab143_out
            lab144_out
