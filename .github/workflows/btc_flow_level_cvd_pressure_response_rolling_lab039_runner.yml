name: BTC Flow Level CVD Pressure Response Rolling LAB039 Runner

on:
  push:
    paths:
      - '.github/workflows/btc_flow_level_cvd_pressure_response_rolling_lab039_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab039:
    runs-on: ubuntu-latest
    env:
      LAB_BRANCH: lab/btc-flow-level-cvd-pressure-price-response-causal-rolling-interaction-replication-039
      LAB_DIR: labs/BTC_FLOW_LEVEL_CVD_PRESSURE_X_PRICE_RESPONSE_CAUSAL_ROLLING_INTERACTION_REPLICATION_LAB_039
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas
      - name: Run frozen LAB039
        run: python "$LAB_DIR/run_lab.py"
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAB_DIR/output"
          git diff --cached --quiet || git commit -m "Persist BTC rolling interaction LAB039 outputs"
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-flow-cvd-pressure-response-rolling-lab039
          path: ${{ env.LAB_DIR }}/output
