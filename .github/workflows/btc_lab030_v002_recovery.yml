name: BTC LAB030 v002 Recovery Audit

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'BTC LAB030 V002 RECOVERY TRIGGER')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-struct-break-regime-004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download candidate v002 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p INPUT OUT
          gh release download btc --repo chepigga/ResearchOS --pattern 'BTC_LAB016_MAJOR_REVERSAL_TRANSITIONS_v002.csv' --dir INPUT
          sha256sum INPUT/* | tee OUT/sha256.txt
      - name: Inspect candidate with stdlib only
        run: |
          python - <<'PY'
          import csv, json, pathlib, hashlib
          from datetime import datetime

          p=pathlib.Path('INPUT/BTC_LAB016_MAJOR_REVERSAL_TRANSITIONS_v002.csv')
          with p.open('r', encoding='utf-8-sig', newline='') as f:
              r=csv.DictReader(f)
              cols=r.fieldnames or []
              head=[]
              rows=0
              samples={c:[] for c in cols}
              for row in r:
                  rows += 1
                  if len(head) < 20:
                      head.append(dict(row))
                  if rows <= 10000:
                      for c in cols:
                          v=row.get(c,'')
                          if v != '' and len(samples[c]) < 5:
                              samples[c].append(v)

          aliases=['fill_idx','fill_index','riskatr','risk_atr','net_r','gross_r','side','direction','entry','stop','sl','tp','be','exit','outcome']
          key_matches={a:[c for c in cols if a in c.lower()] for a in aliases}
          likely_time=[c for c in cols if any(k in c.lower() for k in ['time','date','timestamp'])]
          likely_numeric=[c for c in cols if any(k in c.lower() for k in ['idx','atr','entry','stop','target','tp','sl','risk','return','result','outcome'])]
          out={
              'file':p.name,
              'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'rows':rows,
              'columns':cols,
              'key_column_matches':key_matches,
              'likely_time_columns':likely_time,
              'likely_numeric_columns':likely_numeric,
              'sample_values':{c:samples[c] for c in cols},
              'parity_target_struct_break_v002':{
                  'rows_total':1465,'dev':767,'val':698,'tail_riskATR_gt_3_72':132,
                  'tail_dev':65,'tail_val':67
              }
          }
          pathlib.Path('OUT/v002_audit.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          with pathlib.Path('OUT/v002_head20.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=cols); w.writeheader(); w.writerows(head)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-lab030-v002-recovery-audit
          path: OUT/
          retention-days: 30
