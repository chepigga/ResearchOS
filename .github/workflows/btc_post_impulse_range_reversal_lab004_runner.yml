name: BTC Post Impulse Range Reversal LAB004 Runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/btc_post_impulse_range_reversal_lab004_runner.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab004:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-post-impulse-range-reversal-router-004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen LAB004
        run: python labs/BTC_POST_IMPULSE_RANGE_STATE_AND_24H_REVERSAL_ROUTER_LAB_004/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_POST_IMPULSE_RANGE_STATE_AND_24H_REVERSAL_ROUTER_LAB_004/output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist BTC post-impulse reversal LAB004 outputs'
          git push origin HEAD:lab/btc-post-impulse-range-reversal-router-004
      - uses: actions/upload-artifact@v4
        with:
          name: btc-post-impulse-range-reversal-lab004
          path: labs/BTC_POST_IMPULSE_RANGE_STATE_AND_24H_REVERSAL_ROUTER_LAB_004/output
