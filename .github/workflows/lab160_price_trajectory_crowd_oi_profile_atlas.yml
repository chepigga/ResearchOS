name: LAB160 Price Trajectory Crowd OI Profile Atlas
on:
  push:
    branches: [lab/lab160-price-trajectory-crowd-oi-profile-atlas-20261010]
    paths: ['.github/workflows/lab160_price_trajectory_crowd_oi_profile_atlas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab160-price-trajectory-crowd-oi-profile-atlas-20261010
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB160
        run: python labs/LAB160_PRICE_TRAJECTORY_CROWD_OI_PROFILE_ATLAS_20261010/run_lab160.py
      - run: cat lab160_out/LAB160_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: LAB160_PRICE_TRAJECTORY_CROWD_OI_PROFILE_ATLAS
          path: lab160_out
