name: Context Reversal Ordered Event Chain LAB014

on:
  push:
    branches:
      - lab/context-reversal-ordered-event-chain-stage-machine-014
    paths:
      - 'labs/CONTEXT_REVERSAL_ORDERED_EVENT_CHAIN_AND_STAGE_STATE_MACHINE_LAB_014/**'
      - '.github/workflows/context_reversal_ordered_event_chain_stage_machine_lab014.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab014:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/context-reversal-ordered-event-chain-stage-machine-014
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas numpy requests
      - name: Apply parent technical compatibility hotfixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py')
          s=p.read_text().replace('d.stack.astype(float)','d["stack"].astype(float)').replace('(~d.stack)','(~d["stack"])')
          p.write_text(s)
          q=Path('labs/CONTEXT_INDICATOR_PUBLIC_SPEC_GAP_CLOSURE_AND_NEXT_CONTEXT_LAB_010/run_lab.py')
          t=q.read_text()
          old="base=d.reset_index().rename(columns={'time':'h4_open'}).sort_values('h4_open')\n    z=pd.merge_asof(base,dc,left_on='h4_open',right_on='d1_available_time',direction='backward',allow_exact_matches=True)"
          new="base=d.reset_index().rename(columns={'time':'h4_open'}).sort_values('h4_open')\n    base['h4_open']=pd.to_datetime(base['h4_open'],utc=True).astype('datetime64[ns, UTC]')\n    dc['d1_available_time']=pd.to_datetime(dc['d1_available_time'],utc=True).astype('datetime64[ns, UTC]')\n    z=pd.merge_asof(base,dc,left_on='h4_open',right_on='d1_available_time',direction='backward',allow_exact_matches=True)"
          if old in t: t=t.replace(old,new)
          t=t.replace('stack=d.stack.fillna(False)','stack=d["stack"].fillna(False)')
          q.write_text(t)
          PY
      - name: Run preregistered LAB014
        run: |
          rm -rf labs/CONTEXT_REVERSAL_ORDERED_EVENT_CHAIN_AND_STAGE_STATE_MACHINE_LAB_014/output
          python labs/CONTEXT_REVERSAL_ORDERED_EVENT_CHAIN_AND_STAGE_STATE_MACHINE_LAB_014/run_lab.py --out labs/CONTEXT_REVERSAL_ORDERED_EVENT_CHAIN_AND_STAGE_STATE_MACHINE_LAB_014/output
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/CONTEXT_REVERSAL_ORDERED_EVENT_CHAIN_AND_STAGE_STATE_MACHINE_LAB_014/output
          git commit -m 'Persist LAB014 ordered stage-machine outputs' || true
          git push origin HEAD:lab/context-reversal-ordered-event-chain-stage-machine-014
      - uses: actions/upload-artifact@v4
        with:
          name: context-reversal-ordered-event-chain-lab014
          path: labs/CONTEXT_REVERSAL_ORDERED_EVENT_CHAIN_AND_STAGE_STATE_MACHINE_LAB_014/output
