name: LAB153 R48 HIGH Bull Drift Controls
on:
  push:
    branches: [lab/lab153-r48-high-bull-drift-controls-20261009]
    paths: ['.github/workflows/lab153_r48_high_bull_drift_controls.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab153-r48-high-bull-drift-controls-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB153
        run: python labs/LAB153_R48_HIGH_BULL_DRIFT_CONTROLS_20261009/run_lab153.py
      - run: cat lab153_out/LAB153_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab153-r48-high-bull-drift-controls
          path: lab153_out
