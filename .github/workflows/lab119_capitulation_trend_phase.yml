name: LAB119 Capitulation Trend Phase
on:
  push:
    branches: [lab/lab119-capitulation-trend-phase-20261008]
    paths: ['.github/workflows/lab119_capitulation_trend_phase.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab119-capitulation-trend-phase-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          curl -L --fail --retry 3 -o binance_btc_funding.csv https://github.com/chepigga/ResearchOS/releases/download/btc/binance_btc_funding.csv
      - name: Run LAB119
        run: python labs/LAB119_CAPITULATION_TREND_PHASE_20261008/run_lab119.py
      - run: cat lab119_out/LAB119_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab119-capitulation-trend-phase
          path: lab119_out
