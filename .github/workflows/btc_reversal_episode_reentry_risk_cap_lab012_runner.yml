name: BTC Reversal Episode Reentry Risk Cap LAB012 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_reversal_episode_reentry_risk_cap_lab012_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab012:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-reversal-episode-ordinal-reentry-cluster-risk-cap-012
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen LAB012
        run: python labs/BTC_REVERSAL_EPISODE_ORDINAL_REENTRY_AND_CLUSTER_RISK_CAP_LAB_012/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_REVERSAL_EPISODE_ORDINAL_REENTRY_AND_CLUSTER_RISK_CAP_LAB_012/output
          git commit -m 'Persist BTC reversal episode reentry risk-cap LAB012 outputs' || true
          git push origin HEAD:lab/btc-reversal-episode-ordinal-reentry-cluster-risk-cap-012
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-episode-reentry-risk-cap-lab012
          path: labs/BTC_REVERSAL_EPISODE_ORDINAL_REENTRY_AND_CLUSTER_RISK_CAP_LAB_012/output
