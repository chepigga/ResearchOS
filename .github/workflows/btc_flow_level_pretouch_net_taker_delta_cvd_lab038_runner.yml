name: BTC Flow Level Pretouch Net Taker Delta CVD LAB038 Runner

on:
  push:
    paths:
      - '.github/workflows/btc_flow_level_pretouch_net_taker_delta_cvd_lab038_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab038:
    runs-on: ubuntu-latest
    env:
      LAB_BRANCH: lab/btc-flow-level-pretouch-net-taker-delta-price-response-cvd-absorption-038
      LAB_DIR: labs/BTC_FLOW_LEVEL_PRETOUCH_NET_TAKER_DELTA_PRICE_RESPONSE_AND_CVD_ABSORPTION_LAB_038
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas scipy requests
      - name: Run frozen LAB038
        run: python "$LAB_DIR/run_lab.py"
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LAB_DIR/output"
          git diff --cached --quiet || git commit -m "Persist BTC flow net taker delta CVD LAB038 outputs"
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-flow-level-pretouch-net-taker-delta-cvd-lab038
          path: ${{ env.LAB_DIR }}/output
