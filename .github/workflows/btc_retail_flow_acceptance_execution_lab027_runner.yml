name: BTC Retail Flow Acceptance Execution LAB027 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_retail_flow_acceptance_execution_lab027_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab027:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-retail-flow-acceptance-confirm-entry-adverse-veto-execution-027
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download frozen Binance BTCUSDT M15 price data
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_15m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_15m.zip
          echo '19acf95a3bb7a868fa1e6c8da8dbc73d4a2f7004b771e394bbee8e6c5b6e58b9  btc_15m.zip' | sha256sum -c -
          mkdir -p btc15
          unzip -q btc_15m.zip -d btc15
      - name: Run frozen LAB027 with bootstrap parity fix
        run: python labs/BTC_RETAIL_FLOW_ACCEPTANCE_CONFIRM_ENTRY_AND_ADVERSE_VETO_EXECUTION_LAB_027/run_lab_v2.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_RETAIL_FLOW_ACCEPTANCE_CONFIRM_ENTRY_AND_ADVERSE_VETO_EXECUTION_LAB_027/output
          git commit -m 'Persist BTC retail flow acceptance execution LAB027 v2 outputs' || true
          git push origin HEAD:lab/btc-retail-flow-acceptance-confirm-entry-adverse-veto-execution-027
      - uses: actions/upload-artifact@v4
        with:
          name: btc-retail-flow-acceptance-execution-lab027-v2
          path: labs/BTC_RETAIL_FLOW_ACCEPTANCE_CONFIRM_ENTRY_AND_ADVERSE_VETO_EXECUTION_LAB_027/output
