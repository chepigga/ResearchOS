name: BTC Reversal Slow State Transition LAB010 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_reversal_slow_state_transition_lab010_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab010:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-reversal-slow-state-transition-regime-onset-010
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen LAB010
        run: python labs/BTC_REVERSAL_SLOW_STATE_TRANSITION_AND_REGIME_ONSET_LAB_010/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_REVERSAL_SLOW_STATE_TRANSITION_AND_REGIME_ONSET_LAB_010/output
          git commit -m 'Persist BTC reversal slow-state transition LAB010 outputs' || true
          git push origin HEAD:lab/btc-reversal-slow-state-transition-regime-onset-010
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-slow-state-transition-lab010
          path: labs/BTC_REVERSAL_SLOW_STATE_TRANSITION_AND_REGIME_ONSET_LAB_010/output
