name: crowdfade-execution-cost-lab006
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_EXECUTION_COST_LAB_006/**'
      - '.github/workflows/crowdfade_execution_cost_lab006.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas numba
      - name: Download frozen flow and BTC 2021-2025 M5
        run: |
          ROOT=labs/CROWDFADE_EXECUTION_COST_LAB_006/data
          mkdir -p "$ROOT/klines"
          cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          echo 'b6c80084751305f394270c4b133abbf89a0264634924891251b13b33afbe5e0d  BTCUSDT_flow_2021-01-2026-08.csv.zip' | sha256sum -c -
          cd klines
          for Y in 2021 2022 2023 2024 2025; do for M in $(seq -w 1 12); do F=BTCUSDT-5m-${Y}-${M}.zip; wget -q "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/5m/$F" -O "$F"; done; done
          sha256sum BTCUSDT-5m-*.zip > ../kline_sha256_manifest.txt
      - name: Run LAB006 passive execution search
        run: python labs/CROWDFADE_EXECUTION_COST_LAB_006/run.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_EXECUTION_COST_LAB_006/output labs/CROWDFADE_EXECUTION_COST_LAB_006/data/kline_sha256_manifest.txt
          git commit -m 'research(CrowdFade): LAB006 passive cost execution search' || exit 0
          git push
