name: GC XAU Limit Order Operational Robustness LAB009

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/gc_xau_limit_order_operational_robustness_lab_009.py'
      - 'research/gc/GC_XAU_LIMIT_ORDER_OPERATIONAL_ROBUSTNESS_LAB_009_PREREG.md'
      - '.github/workflows/gc_xau_limit_order_operational_robustness_lab_009.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  operational:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Run preregistered LAB009 operational robustness
        run: python research/gc/gc_xau_limit_order_operational_robustness_lab_009.py

      - name: Commit LAB009 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/gc/GC_XAU_LIMIT_ORDER_OPERATIONAL_ROBUSTNESS_LAB_009.json \
                  research/gc/GC_XAU_LIMIT_ORDER_OPERATIONAL_ROBUSTNESS_LAB_009.md \
                  research/gc/GC_XAU_LIMIT_ORDER_OPERATIONAL_ROBUSTNESS_LAB_009_RESULTS.csv \
                  research/gc/GC_XAU_LIMIT_ORDER_OPERATIONAL_ROBUSTNESS_LAB_009_SEQUENCES.csv
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Record GC XAU limit operational robustness LAB009'
            git push origin HEAD:gc-amp-feed-audit-001
          fi
