name: CrowdFade v1.90 Historical Replay
on:
  push:
    branches:
      - lab/crowdfade-v190-historical-replay-001
    paths:
      - '.github/workflows/crowdfade_v190_historical_replay.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-v190-historical-replay-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download frozen BTC historical data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/data
          cd labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/data
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          echo '13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd  btc_5m.zip' | sha256sum -c -
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          echo 'b6c80084751305f394270c4b133abbf89a0264634924891251b13b33afbe5e0d  BTCUSDT_flow_2021-01-2026-08.csv.zip' | sha256sum -c -
      - name: Run frozen v1.90 replay
        run: python labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/run_replay.py
      - name: Persist outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/output
          git commit -m 'research(CrowdFade): persist v1.90 BTC historical replay' || true
          git push origin HEAD:lab/crowdfade-v190-historical-replay-001
      - uses: actions/upload-artifact@v4
        with:
          name: crowdfade-v190-historical-replay-001
          path: labs/CROWDFADE_V190_HISTORICAL_REPLAY_001/output
