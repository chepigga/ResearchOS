name: BTC Reversal H4 Two Bar Directional LAB019 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_reversal_h4_two_bar_directional_lab019_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab019:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-reversal-h4-two-bar-directional-asymmetry-buy-only-replication-019
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Run frozen LAB019
        run: python labs/BTC_REVERSAL_H4_TWO_BAR_DIRECTIONAL_ASYMMETRY_AND_BUY_ONLY_CAUSAL_REPLICATION_LAB_019/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_REVERSAL_H4_TWO_BAR_DIRECTIONAL_ASYMMETRY_AND_BUY_ONLY_CAUSAL_REPLICATION_LAB_019/output
          git commit -m 'Persist BTC reversal H4 two-bar directional LAB019 outputs' || true
          git push origin HEAD:lab/btc-reversal-h4-two-bar-directional-asymmetry-buy-only-replication-019
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-h4-two-bar-directional-lab019
          path: labs/BTC_REVERSAL_H4_TWO_BAR_DIRECTIONAL_ASYMMETRY_AND_BUY_ONLY_CAUSAL_REPLICATION_LAB_019/output
