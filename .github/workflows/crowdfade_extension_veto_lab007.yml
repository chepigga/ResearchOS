name: crowdfade-extension-veto-lab007
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths: ['labs/CROWDFADE_EXECUTION_EXTENSION_VETO_LAB_007/**','.github/workflows/crowdfade_extension_veto_lab007.yml']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas numba
      - name: Download data
        run: |
          ROOT=labs/CROWDFADE_EXECUTION_EXTENSION_VETO_LAB_007/data
          mkdir -p "$ROOT/klines";cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          cd klines
          for Y in 2021 2022 2023 2024 2025; do for M in $(seq -w 1 12); do F=BTCUSDT-5m-${Y}-${M}.zip; wget -q "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/5m/$F" -O "$F"; done;done
      - run: python labs/CROWDFADE_EXECUTION_EXTENSION_VETO_LAB_007/run.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_EXECUTION_EXTENSION_VETO_LAB_007/output
          git commit -m 'research(CrowdFade): LAB007 extension-veto execution search' || exit 0
          git push
