name: XAU Causal Regime Conditional Edge Discovery LAB005

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lab005:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'XAU CAUSAL LAB005 TRIGGER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout frozen main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn
      - name: Download LAB001 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p LAB001_INPUT Results_XAU_CAUSAL_LAB005
          gh run download 33067830619 --repo chepigga/ResearchOS --name xau-causal-future-probability-lab001 --dir LAB001_INPUT
          test -s LAB001_INPUT/m1_bidask_bars.parquet
          test -s LAB001_INPUT/causal_labels_m1.parquet
      - name: Run event x regime conditional discovery
        shell: bash
        run: |
          set -euo pipefail
          python research/xau_causal_regime_conditional_edge_discovery_lab005.py \
            --bars LAB001_INPUT/m1_bidask_bars.parquet \
            --labels LAB001_INPUT/causal_labels_m1.parquet \
            --outdir Results_XAU_CAUSAL_LAB005
      - name: Print compact outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat Results_XAU_CAUSAL_LAB005/candidate_verdicts.csv || true
          cat Results_XAU_CAUSAL_LAB005/regime_uplift.csv || true
          cat Results_XAU_CAUSAL_LAB005/event_regime_summary.csv || true
          cat Results_XAU_CAUSAL_LAB005/verdict.json || true
      - name: Upload LAB005 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-causal-regime-conditional-edge-discovery-lab005
          path: Results_XAU_CAUSAL_LAB005/
          if-no-files-found: warn
          retention-days: 30
