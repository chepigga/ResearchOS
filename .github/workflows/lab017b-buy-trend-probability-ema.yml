name: LAB017B BUY trend probability EMA
on:
  pull_request:
    branches: [lab-btc-unified-lifecycle]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Download frozen BTC data
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          test "$(sha256sum btc_5m.zip | awk '{print $1}')" = "13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd"
          curl -L --fail --retry 3 -o btc_1m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_1m.zip
          test "$(sha256sum btc_1m.zip | awk '{print $1}')" = "4339abbd8d23a0ee84afa4187a41be2fd41d219060e1751053b152757be9a7ea"
          mkdir -p m5 m1 && unzip -q btc_5m.zip -d m5 && unzip -q btc_1m.zip -d m1
      - name: Corrected trend probability replay
        run: |
          python - <<'PY'
          import glob,pandas as pd,numpy as np,os,json
          COST=27.5; START=pd.Timestamp('2024-01-01'); END=pd.Timestamp('2026-08-10 05:59')
          def load(folder):
              x=pd.concat([pd.read_csv(f) for f in glob.glob(folder+'/**/*.csv',recursive=True)],ignore_index=True)
              x['time']=pd.to_datetime(x.time,utc=True).dt.tz_convert(None); x=x.sort_values('time').drop_duplicates('time').reset_index(drop=True)
              for c in ['open','high','low','close','taker_ratio']:
                  if c in x:x[c]=pd.to_numeric(x[c],errors='coerce')
              return x
          def pf(v):
              s=pd.Series(v).dropna(); gp=s[s>0].sum(); gl=-s[s<0].sum(); return float(gp/gl) if gl>0 else float('inf')
          def maxdd(v):
              c=np.cumsum(np.asarray(v,float)); cc=np.r_[0,c]; pk=np.maximum.accumulate(cc); return float(np.max(pk-cc))
          def add_trend(df,span=20):
              df=df.copy(); df['ema']=df.close.ewm(span=span,adjust=False,min_periods=span).mean(); df['emap']=df.ema.shift(1)
              df['TREND']=np.where((df.close>df.ema)&(df.ema>df.emap),'BULL',np.where((df.close<df.ema)&(df.ema<df.emap),'BEAR','NEUTRAL')); return df
          m5=load('m5'); m1=load('m1')
          m5['trend12h_ret']=m5.close/m5.close.shift(144)-1; m5['pullback15']=m5.close<m5.close.shift(3); m5['tr15']=m5.taker_ratio.rolling(3,min_periods=3).mean()
          m5['setup']=(m5.trend12h_ret>=0.002)&m5.pullback15&(m5.tr15<0.50)&(m5.close>m5.high.shift(1))&(m5.time.dt.hour!=19)
          ep=m5[(m5.time>=START)&(m5.time<=END)&m5.setup].copy()
          h1=m1.set_index('time').resample('1h',label='left',closed='left').agg({'open':'first','high':'max','low':'min','close':'last'}).dropna().reset_index(); h1['close_time']=h1.time+pd.Timedelta(hours=1); h1=add_trend(h1,20)
          pc=h1.close.shift(); tr=pd.concat([h1.high-h1.low,(h1.high-pc).abs(),(h1.low-pc).abs()],axis=1).max(axis=1); h1['atr14']=tr.ewm(alpha=1/14,adjust=False,min_periods=14).mean()
          h4=m1.set_index('time').resample('4h',label='left',closed='left').agg({'open':'first','high':'max','low':'min','close':'last'}).dropna().reset_index(); h4['close_time']=h4.time+pd.Timedelta(hours=4); h4=add_trend(h4,20)
          rows=[]
          for idx,r in ep.iterrows():
              bt=r.time; avail=bt+pd.Timedelta(minutes=5); level=float(m5.loc[idx-1,'high']); bh=float(r.high)
              z5=m5[(m5.time>=avail)&(m5.time<=bt+pd.Timedelta(hours=12))]; rr=z5[(z5.low<=level)&(z5.close>=level)]; sp=z5[z5.close>bh]
              if len(rr)==0 or len(sp)==0:continue
              rt=rr.iloc[0].time; hit=m1[(m1.time>=avail)&(m1.time<rt+pd.Timedelta(minutes=5))&(m1.low<=level)]
              if len(hit)==0:continue
              ft=hit.iloc[0].time; hh=h1[h1.close_time<=avail].tail(1); hhhh=h4[h4.close_time<=avail].tail(1)
              if len(hh)==0 or len(hhhh)==0 or not np.isfinite(hh.iloc[0].atr14):continue
              h1t=hh.iloc[0].TREND; h4t=hhhh.iloc[0].TREND
              if h1t=='BULL' and h4t=='BULL': combo='STRONG_ALIGNED'
              elif h1t=='BEAR' and h4t=='BEAR': combo='STRONG_AGAINST'
              elif h1t=='NEUTRAL' or h4t=='NEUTRAL': combo='NEUTRAL'
              else: combo='MIXED'
              sd=1.5*float(hh.iloc[0].atr14); sl=level-sd; tp=level+1.5*sd; costR=COST/sd
              path=m1[(m1.time>=ft)&(m1.time<=ft+pd.Timedelta(hours=48))].copy(); ah=path.high.to_numpy(float); al=path.low.to_numpy(float); ac=path.close.to_numpy(float)
              sh=np.flatnonzero(al<=sl); th=np.flatnonzero(ah>=tp); is_=int(sh[0]) if len(sh) else 10**18; it=int(th[0]) if len(th) else 10**18
              if it<is_:R=1.5-costR; outcome='TP'; exit_time=path.iloc[it].time
              elif is_<it:R=-1-costR; outcome='SL'; exit_time=path.iloc[is_].time
              else:R=(ac[-1]-level)/sd-costR; outcome='TIME'; exit_time=path.iloc[-1].time
              dt=ft+pd.Timedelta(minutes=30); score6=False
              if exit_time>dt:
                  q=m1[(m1.time>=ft)&(m1.time<dt)]
                  if len(q)>=30:
                      chunks=[]
                      for k in range(6):
                          z=q.iloc[k*5:(k+1)*5]; chunks.append(dict(open=float(z.iloc[0].open),low=float(z.low.min()),close=float(z.iloc[-1].close),taker=float(z.taker_ratio.mean())))
                      c=pd.DataFrame(chunks); votes=[c.iloc[-1].close>=level,(c.close>=level).mean()>=.5,c.iloc[-1].close>=level,c.iloc[3:].low.min()>c.iloc[:3].low.min(),c.iloc[-1].close>c.iloc[0].open,c.iloc[3:].taker.mean()>.50]; score6=sum(votes)==6
              rows.append(dict(fill_time=ft,year=ft.year,H1_TREND=h1t,H4_TREND=h4t,COMBO=combo,SCORE6=score6,TP=(outcome=='TP'),R48=R,outcome=outcome))
          a=pd.DataFrame(rows).sort_values('fill_time').reset_index(drop=True)
          print('N',len(a),'BASE_P_SCORE6',a.SCORE6.mean(),'P_TP',a.TP.mean(),'EV',a.R48.mean(),'PF',pf(a.R48))
          def table(col):
              rr=[]
              for k,g in a.groupby(col):
                  d=dict(group=k,N=len(g),share=len(g)/len(a),P_SCORE6=float(g.SCORE6.mean()),P_TP=float(g.TP.mean()),EV=float(g.R48.mean()),PF=pf(g.R48)); rr.append(d); print(col,d)
              return pd.DataFrame(rr)
          h1t=table('H1_TREND'); h4t=table('H4_TREND'); ct=table('COMBO')
          y=[]; print('YEAR_COMBO')
          for (yr,c),g in a.groupby(['year','COMBO']):
              d=dict(year=int(yr),combo=c,N=len(g),P_SCORE6=float(g.SCORE6.mean()),P_TP=float(g.TP.mean()),EV=float(g.R48.mean()),PF=pf(g.R48)); y.append(d); print(d)
          risk={'STRONG_AGAINST':.10,'MIXED':.15,'NEUTRAL':.15,'STRONG_ALIGNED':.20}; a['risk']=a.COMBO.map(risk); a['scaled']=a.risk*a.R48; a['fixed']=.15*a.R48
          print('FIXED',a.fixed.sum(),pf(a.fixed),maxdd(a.fixed)); print('SCALED',a.scaled.sum(),pf(a.scaled),maxdd(a.scaled))
          for yr,g in a.groupby('year'):print('YEAR_RISK',yr,'FIXED',g.fixed.sum(),'SCALED',g.scaled.sum(),'PF',pf(g.scaled),'DD',maxdd(g.scaled))
          a['week']=a.fill_time.dt.to_period('W').astype(str); w=a.groupby('week').agg(s=('scaled','sum'),f=('fixed','sum')); diff=(w.s-w.f).to_numpy(); rng=np.random.default_rng(17018); boots=np.array([rng.choice(diff,size=len(diff),replace=True).mean() for _ in range(20000)]); print('DIFF_BOOT',np.quantile(boots,.025),np.quantile(boots,.975),(boots>0).mean())
          os.makedirs('lab017b',exist_ok=True);a.to_csv('lab017b/ledger.csv',index=False);h1t.to_csv('lab017b/h1.csv',index=False);h4t.to_csv('lab017b/h4.csv',index=False);ct.to_csv('lab017b/combo.csv',index=False);pd.DataFrame(y).to_csv('lab017b/year_combo.csv',index=False);json.dump({'N':len(a),'base_P_SCORE6':float(a.SCORE6.mean()),'base_P_TP':float(a.TP.mean()),'base_EV':float(a.R48.mean()),'base_PF':pf(a.R48),'fixed_sum_pct':float(a.fixed.sum()),'scaled_sum_pct':float(a.scaled.sum()),'scaled_PF':pf(a.scaled),'scaled_DD_pct':maxdd(a.scaled),'diff_boot_ci':[float(np.quantile(boots,.025)),float(np.quantile(boots,.975))],'diff_pgt0':float((boots>0).mean())},open('lab017b/summary.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lab017b-buy-trend-probability-ema
          path: lab017b/
