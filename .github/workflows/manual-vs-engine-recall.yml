name: BTC Manual vs Engine Recall

on:
  push:
    branches: [lab-buy-b4-st-dir]

permissions:
  contents: read

jobs:
  recall:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet pandas numpy
      - name: Run manual-vs-engine recall audit
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          curl -L --fail --retry 3 -o frozen_events.csv https://github.com/chepigga/ResearchOS/releases/download/btc/BTC_M15_FVG_CONTINUATION_LAB_020_FREQ_MATCHED_EVENTS.csv
          test "$(sha256sum btc_5m.zip|awk '{print $1}')" = "13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd"
          test "$(sha256sum frozen_events.csv|awk '{print $1}')" = "6256b824c1e75b7170fa7f70aa4ae021cc44d4522397449eb083a2b310b6bb34"
          python - <<'PY'
          import zipfile, math
          import numpy as np, pandas as pd

          # Manual candidate set frozen from ReportHistory-1514214250(1).xlsx.
          # Only BTC candidates are recall-testable against the BTC engine.
          manual = pd.DataFrame([
              ('2026-08-06 17:11:08','BUY',64513.40,342.68,'BTC_AI_BUY_FIN150'),
              ('2026-08-07 21:35:30','SELL',64755.65,401.14,'BTC_MARKET_SELL'),
              ('2026-08-09 02:15:14','BUY',64911.36,-3.45,'BTC_AI_BUY_FIN150'),
              ('2026-08-09 09:00:37','BUY',64778.35,43.76,'BTC_AI_BUY_FIN150'),
              ('2026-08-09 10:55:14','BUY',64795.70,86.21,'BTC_AI_BUY_FIN150'),
              ('2026-08-09 12:00:07','BUY',64793.03,127.60,'BTC_AI_BUY_FIN150'),
              ('2026-08-09 18:04:02','SELL',65185.80,15.43,'BTC_MARKET_SELL'),
              ('2026-08-10 17:08:08','SELL',64672.38,290.28,'BTC_MARKET_SELL'),
              ('2026-08-10 19:54:15','SELL',63849.46,-79.16,'BTC_MARKET_SELL'),
          ], columns=['mt5_time','side','entry_price','profit','manual_cluster'])
          manual.mt5_time = pd.to_datetime(manual.mt5_time)

          # Load canonical 5m Binance history.
          frames=[]
          with zipfile.ZipFile('btc_5m.zip') as z:
              names=sorted(n for n in z.namelist() if n.lower().endswith('.csv'))
              print('ZIP_CSV_COUNT',len(names),'FIRST',names[:3],'LAST',names[-3:])
              for n in names:
                  with z.open(n) as f: frames.append(pd.read_csv(f))
          b=pd.concat(frames,ignore_index=True)
          b['time']=pd.to_datetime(b['time'],utc=True).dt.tz_localize(None)
          for c in ['open','high','low','close']: b[c]=pd.to_numeric(b[c],errors='coerce')
          b=(b.dropna(subset=['time','open','high','low','close']).sort_values('time').drop_duplicates('time',keep='last').reset_index(drop=True))
          print('BINANCE_RANGE',b.time.min(),b.time.max(),'ROWS',len(b))

          def nearest_price(ts):
              i=b.time.searchsorted(ts)
              cand=[]
              for j in [max(0,i-1), min(len(b)-1,i)]:
                  r=b.iloc[j]; cand.append((abs((r.time-ts).total_seconds()),r))
              return min(cand,key=lambda x:x[0])[1]

          # Empirically resolve MT5 server offset against Binance using entry price proximity.
          offset_rows=[]
          for off in [-3,0,3]:
              errs=[]
              for _,r in manual.iterrows():
                  ts=r.mt5_time+pd.Timedelta(hours=off)
                  q=nearest_price(ts)
                  errs.append(abs(r.entry_price-q.close)/r.entry_price*100)
              offset_rows.append((off,float(np.median(errs)),float(np.mean(errs))))
          print('\nTIME_OFFSET_TEST hours_added_to_MT5 -> BinanceUTC')
          for x in offset_rows: print('OFFSET',x[0],'median_abs_price_err_pct',x[1],'mean',x[2])
          best_off=min(offset_rows,key=lambda x:x[1])[0]
          print('CHOSEN_OFFSET_HOURS',best_off)
          manual['engine_time']=manual.mt5_time+pd.Timedelta(hours=best_off)

          def resample(rule):
              x=b.set_index('time')
              o=x.resample(rule,label='left',closed='left').agg(open=('open','first'),high=('high','max'),low=('low','min'),close=('close','last')).dropna().reset_index()
              o['close_time']=o['time']+pd.Timedelta(rule)
              return o
          m15=resample('15min'); h1=resample('1h'); h4=resample('4h')

          def wilder_atr(df,p):
              pc=df.close.shift(1)
              tr=pd.concat([df.high-df.low,(df.high-pc).abs(),(df.low-pc).abs()],axis=1).max(axis=1)
              return tr.ewm(alpha=1/p,adjust=False,min_periods=p).mean()

          # TRUE raw classical FVG first-touch ledger: first eligible touch age 2..200.
          bull=(m15.low>m15.high.shift(2)).to_numpy()
          bear=(m15.high<m15.low.shift(2)).to_numpy()
          raw=[]; n=len(m15)
          for side,mask,nearcol,hitcol,cmp in [
              ('BUY',bull,'low','low','le'),('SELL',bear,'high','high','ge')]:
              for j in np.flatnonzero(mask):
                  near=float(m15.loc[j,nearcol]); k0=j+2; k1=min(j+200,n-1)
                  if k0>k1: continue
                  arr=m15.loc[k0:k1,hitcol].to_numpy(float)
                  hit=np.flatnonzero(arr<=near) if cmp=='le' else np.flatnonzero(arr>=near)
                  if hit.size:
                      k=k0+int(hit[0]); raw.append((m15.loc[k,'time'],side,j,k-j,near,k))
          raw=pd.DataFrame(raw,columns=['event_time','side','birth_idx','age_bars','entry','m15_idx']).sort_values('event_time').reset_index(drop=True)

          # Attach H1 directional state to raw events to identify LAB020 parent shell.
          hh=h1.copy(); hh['atr14']=wilder_atr(hh,14); hh['disp6']=(hh.close-hh.close.shift(6)); hh['disp6_atr']=hh.disp6/hh.atr14
          raw=pd.merge_asof(raw.sort_values('event_time'),hh[['close_time','atr14','disp6_atr']].sort_values('close_time'),left_on='event_time',right_on='close_time',direction='backward',allow_exact_matches=True)
          raw['dir_state']=np.where(raw.side.eq('BUY'),raw.disp6_atr,-raw.disp6_atr)
          raw['parent_pass']=(raw.age_bars.between(11,60))&(raw.dir_state>0)&raw.atr14.notna()

          # Reconstruct H4 voted Supertrend phase+age exactly as LAB022.
          def st_dir(df,mult,period=10):
              src=(df.open+df.high+df.low+df.close)/4; atr=wilder_atr(df,period)
              bu=(src+mult*atr).to_numpy(float); bl=(src-mult*atr).to_numpy(float); cl=df.close.to_numpy(float)
              fu=np.full(len(df),np.nan); fl=np.full(len(df),np.nan); d=np.zeros(len(df),dtype=np.int8)
              for i in range(len(df)):
                  if not np.isfinite(bu[i]) or not np.isfinite(bl[i]): continue
                  if i==0 or not np.isfinite(fu[i-1]): fu[i]=bu[i]; fl[i]=bl[i]; d[i]=1; continue
                  fu[i]=bu[i] if bu[i]<fu[i-1] or cl[i-1]>fu[i-1] else fu[i-1]
                  fl[i]=bl[i] if bl[i]>fl[i-1] or cl[i-1]<fl[i-1] else fl[i-1]
                  prev=d[i-1] if d[i-1]!=0 else 1
                  if prev<0 and cl[i]>fu[i]: d[i]=1
                  elif prev>0 and cl[i]<fl[i]: d[i]=-1
                  else: d[i]=prev
              return d
          mat=np.vstack([st_dir(h4,m) for m in (1.3,1.8,2.5)]).T
          vote=np.sign(mat.sum(axis=1)).astype(np.int8); age=np.zeros(len(h4),dtype=int)
          for i in range(len(h4)):
              age[i]=0 if i==0 or vote[i]==0 or vote[i]!=vote[i-1] else age[i-1]+1
          st=h4[['close_time']].copy(); st['H4_ST_DIR']=vote; st['H4_ST_AGE_BARS']=age
          raw=pd.merge_asof(raw.sort_values('event_time'),st.sort_values('close_time'),left_on='event_time',right_on='close_time',direction='backward',allow_exact_matches=True)
          raw['current_tier']=np.where((raw.side=='BUY')&(raw.parent_pass)&(raw.H4_ST_AGE_BARS>58),np.where(raw.H4_ST_DIR==-1,'BUY_A_OPPOSITE','BUY_B_ALIGNED'),np.where((raw.side=='SELL')&(raw.parent_pass)&(raw.H4_ST_AGE_BARS>26)&(raw.H4_ST_AGE_BARS<=50),'SELL_B3_CANDIDATE','NONE'))

          frozen=pd.read_csv('frozen_events.csv'); frozen['entry_time']=pd.to_datetime(frozen.entry_time)
          print('FROZEN_RANGE',frozen.entry_time.min(),frozen.entry_time.max(),'N',len(frozen))

          def nearest_match(df,ts,side,window_min, timecol):
              z=df[df.side.eq(side)].copy()
              if len(z)==0: return None
              dt=(z[timecol]-ts).abs(); j=dt.idxmin(); mins=dt.loc[j].total_seconds()/60
              if mins<=window_min:
                  rr=z.loc[j].to_dict(); rr['delta_min']=mins; return rr
              return None

          rows=[]
          for _,r in manual.iterrows():
              ts=r.engine_time; side=r.side
              tier=nearest_match(raw[raw.current_tier.ne('NONE')],ts,side,90,'event_time')
              parent=nearest_match(raw[raw.parent_pass],ts,side,90,'event_time')
              raw90=nearest_match(raw,ts,side,90,'event_time')
              raw6h=nearest_match(raw,ts,side,360,'event_time')
              if tier is not None:
                  status='CAPTURED_TIER'; reason=tier['current_tier']; match=tier
              elif parent is not None:
                  status='CAPTURED_PARENT_NOT_TIER'; reason='parent FVG passes age/H1 but misses B4/B3 tier'; match=parent
              elif raw90 is not None:
                  status='NEAR_MISS_RAW_FVG';
                  fails=[]
                  if not (11<=raw90['age_bars']<=60): fails.append('AGE')
                  if not (raw90['dir_state']>0): fails.append('H1_DIR')
                  reason='+'.join(fails) if fails else 'tier/state mismatch'; match=raw90
              elif raw6h is not None:
                  status='OFFSET_FVG_WITHIN_6H'; reason='same-side raw FVG exists but not near manual timing'; match=raw6h
              else:
                  status='NO_FVG_EVENT'; reason='no same-side raw first-touch FVG within 6h'; match={}
              rows.append({
                  'mt5_time':r.mt5_time,'engine_time':ts,'side':side,'manual_cluster':r.manual_cluster,'manual_profit':r.profit,
                  'status':status,'reason':reason,'match_time':match.get('event_time',pd.NaT),'delta_min':match.get('delta_min',np.nan),
                  'fvg_age':match.get('age_bars',np.nan),'dir_state':match.get('dir_state',np.nan),'h4_dir':match.get('H4_ST_DIR',np.nan),'h4_age':match.get('H4_ST_AGE_BARS',np.nan),'engine_tier':match.get('current_tier','NONE')
              })
          out=pd.DataFrame(rows)
          print('\n=== MANUAL_VS_ENGINE_RECALL ===')
          print(out.to_string(index=False))
          print('\n=== RECALL_SUMMARY ===')
          print(out.status.value_counts().to_string())
          n=len(out); tier_n=(out.status=='CAPTURED_TIER').sum(); parent_n=out.status.isin(['CAPTURED_TIER','CAPTURED_PARENT_NOT_TIER']).sum(); raw_n=out.status.isin(['CAPTURED_TIER','CAPTURED_PARENT_NOT_TIER','NEAR_MISS_RAW_FVG']).sum()
          print('N_BTC_MANUAL',n)
          print('TIER_RECALL',tier_n/n)
          print('PARENT_RECALL',parent_n/n)
          print('RAW_FVG_90M_RECALL',raw_n/n)
          for cl,g in out.groupby('manual_cluster'):
              print('CLUSTER',cl,'N',len(g),'tier_recall',float((g.status=='CAPTURED_TIER').mean()),'parent_recall',float(g.status.isin(['CAPTURED_TIER','CAPTURED_PARENT_NOT_TIER']).mean()),'raw90_recall',float(g.status.isin(['CAPTURED_TIER','CAPTURED_PARENT_NOT_TIER','NEAR_MISS_RAW_FVG']).mean()))
          print('\nNOTE_XAU_UNTESTED 8 manual XAU BUY candidates are excluded because this BTC release has no compatible frozen XAU event ledger for 2026-08-07..12.')
          PY
