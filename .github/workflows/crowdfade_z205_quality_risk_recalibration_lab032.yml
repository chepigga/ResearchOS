name: crowdfade-z205-quality-risk-recalibration-lab032

on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths:
      - 'labs/CROWDFADE_Z205_QUALITY_RISK_RECALIBRATION_LAB_032/**'
      - '.github/workflows/crowdfade_z205_quality_risk_recalibration_lab032.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas
      - name: Run LAB032
        run: python labs/CROWDFADE_Z205_QUALITY_RISK_RECALIBRATION_LAB_032/run.py
      - name: Commit LAB032 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_Z205_QUALITY_RISK_RECALIBRATION_LAB_032/output
          git commit -m 'research(CrowdFade): LAB032 Z2.05 risk recalibration results' || exit 0
          git push
