name: XAU Price-Time Alogical Path Transition LAB007

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  lab007:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'XAU ALOGICAL LAB007 TRIGGER')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Mark started
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo chepigga/ResearchOS --body "LAB007 vectorized run started."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow

      - name: Download frozen LAB001 causal artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p LAB001_INPUT Results_XAU_ALOGICAL_LAB007
          gh run download 33067830619 \
            --repo chepigga/ResearchOS \
            --name xau-causal-future-probability-lab001 \
            --dir LAB001_INPUT
          test -s LAB001_INPUT/m1_bidask_bars.parquet
          test -s LAB001_INPUT/causal_labels_m1.parquet

      - name: Run path-transition matrix
        shell: bash
        run: |
          set -euo pipefail
          python research/xau_price_time_alogical_path_transition_lab007_v2.py \
            --bars LAB001_INPUT/m1_bidask_bars.parquet \
            --labels LAB001_INPUT/causal_labels_m1.parquet \
            --outdir Results_XAU_ALOGICAL_LAB007

      - name: Print compact outputs
        if: always()
        shell: bash
        run: |
          echo '===== VERDICT ====='
          cat Results_XAU_ALOGICAL_LAB007/verdict.json || true
          echo '===== TRANSFER ====='
          head -n 25 Results_XAU_ALOGICAL_LAB007/candidate_transfer.csv || true
          echo '===== YEARLY PORTFOLIO ====='
          cat Results_XAU_ALOGICAL_LAB007/locked_portfolio_yearly.csv || true
          echo '===== POOLED DIAGNOSTIC ====='
          head -n 15 Results_XAU_ALOGICAL_LAB007/pooled_diagnostic_cells.csv || true

      - name: Build issue summary
        if: always() && github.event_name == 'issues'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out=Path('Results_XAU_ALOGICAL_LAB007')
          lines=['## XAU PRICE×TIME ALOGICAL PATH TRANSITION LAB007']
          vp=out/'verdict.json'
          if vp.exists():
              v=json.loads(vp.read_text())
              lines += [
                  f"**Verdict:** `{v.get('verdict')}`",
                  f"**Engine:** {v.get('engine')}",
                  f"**Raw transition rows:** {v.get('raw_transition_rows')}",
                  f"**Unique origin events:** {v.get('unique_origin_events')}",
                  f"**Matrix cells:** {v.get('matrix_cells')}",
                  f"**Locked cells before 2026:** {v.get('locked_cells_before_2026')}",
                  f"**Positive locked cells in 2026:** {v.get('locked_cells_positive_in_2026')}",
                  '', '**2026 locked portfolio:**', '```json',
                  json.dumps(v.get('final_2026_locked_portfolio',{}), indent=2), '```'
              ]
          cp=out/'candidate_transfer.csv'
          if cp.exists():
              c=pd.read_csv(cp)
              cols=['cell_id','train_n','train_inverse_mean_R','train_inverse_pf','val_n','val_inverse_mean_R','val_inverse_pf','locked_before_2026','final_n','final_inverse_mean_R','final_inverse_pf','final_2026_pass']
              lines += ['', '**Top chronological candidates:**', '```', c[cols].head(15).to_string(index=False), '```']
          yp=out/'locked_portfolio_yearly.csv'
          if yp.exists():
              y=pd.read_csv(yp)
              if len(y): lines += ['', '**Locked portfolio yearly:**', '```', y.to_string(index=False), '```']
          (out/'issue_comment.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Comment result to issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          if [ -s Results_XAU_ALOGICAL_LAB007/issue_comment.md ]; then
            gh issue comment "$ISSUE_NUMBER" --repo chepigga/ResearchOS --body-file Results_XAU_ALOGICAL_LAB007/issue_comment.md
          fi

      - name: Upload LAB007 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-price-time-alogical-path-transition-lab007
          path: Results_XAU_ALOGICAL_LAB007/
          if-no-files-found: warn
          retention-days: 30
