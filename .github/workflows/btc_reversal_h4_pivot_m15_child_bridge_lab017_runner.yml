name: BTC Reversal H4 Pivot to M15 Child LAB017 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_reversal_h4_pivot_m15_child_bridge_lab017_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab017:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-reversal-h4-pivot-to-m15-child-bridge-017
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas requests scikit-learn
      - name: Run frozen LAB017 v2 lineage parity fix
        run: python labs/BTC_REVERSAL_H4_PIVOT_PARENT_TO_M15_CHILD_VIRTUAL_FILL_AND_EXECUTION_BRIDGE_LAB_017/run_lab_v2.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_REVERSAL_H4_PIVOT_PARENT_TO_M15_CHILD_VIRTUAL_FILL_AND_EXECUTION_BRIDGE_LAB_017/output
          git commit -m 'Persist BTC reversal H4 pivot M15 child LAB017 v2 outputs' || true
          git push origin HEAD:lab/btc-reversal-h4-pivot-to-m15-child-bridge-017
      - uses: actions/upload-artifact@v4
        with:
          name: btc-reversal-h4-pivot-m15-child-lab017-v2
          path: labs/BTC_REVERSAL_H4_PIVOT_PARENT_TO_M15_CHILD_VIRTUAL_FILL_AND_EXECUTION_BRIDGE_LAB_017/output
