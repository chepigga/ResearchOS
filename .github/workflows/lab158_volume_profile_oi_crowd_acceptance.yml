name: LAB158 Volume Profile OI Crowd Acceptance
on:
  push:
    branches: [lab/lab158-volume-profile-oi-crowd-acceptance-20261010]
    paths: ['.github/workflows/lab158_volume_profile_oi_crowd_acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab158-volume-profile-oi-crowd-acceptance-20261010
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB158
        run: python labs/LAB158_VOLUME_PROFILE_OI_CROWD_ACCEPTANCE_20261010/run_lab158.py
      - run: cat lab158_out/LAB158_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: LAB158_VOLUME_PROFILE_OI_CROWD_ACCEPTANCE
          path: lab158_out
