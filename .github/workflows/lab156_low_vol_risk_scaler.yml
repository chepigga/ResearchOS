name: LAB156 Low Vol Risk Scaler
on:
  push:
    branches: [lab/lab156-low-vol-risk-scaler-20261009]
    paths: ['.github/workflows/lab156_low_vol_risk_scaler.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab156-low-vol-risk-scaler-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB156
        run: python labs/LAB156_LOW_VOL_RISK_SCALER_20261009/run_lab156.py
      - run: cat lab156_out/LAB156_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab156-low-vol-risk-scaler
          path: lab156_out
