name: LAB115 Z Edge Horizon Regime
on:
  push:
    branches: [lab/lab115-z-edge-horizon-regime-20261008]
    paths: ['.github/workflows/lab115_z_edge_horizon_regime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab115-z-edge-horizon-regime-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB115
        run: python labs/LAB115_Z_EDGE_HORIZON_REGIME_20261008/run_lab115.py
      - run: cat lab115_out/LAB115_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab115-z-edge-horizon-regime
          path: lab115_out
