name: XAU Context Broad Parent Permission M15 OR Execution LAB002

on:
  push:
    paths:
      - '.github/workflows/xau_context_broad_parent_permission_m15_or_execution_lab002.yml'
      - 'labs/XAU_CONTEXT_BROAD_PARENT_PERMISSION_AND_M15_OR_EXECUTION_LAB_002/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab002:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAB_BRANCH: lab/xau-context-broad-parent-permission-m15-or-execution-002
      OUTDIR: labs/XAU_CONTEXT_BROAD_PARENT_PERMISSION_AND_M15_OR_EXECUTION_LAB_002/output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas numpy requests tabulate
      - name: Fetch canonical XAU
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          gh release download ak47 --repo "${GITHUB_REPOSITORY}" --pattern 'XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv' --dir data
          echo 'db47a0cef1e666fdf27a67a23fcc290eee1bd2be2c651ecd8e080b99bf177b9b  data/XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv' | sha256sum -c -
      - name: Apply frozen Context runtime parity hotfixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py')
          s=p.read_text()
          patched=re.sub(r'd\.stack(?![A-Za-z0-9_])', "d['stack']", s)
          old="    sm = s.rolling(3,min_periods=3).mean()"
          warmup=("    ready=d[['ema200','atr_ratio','rsi14','adx14','range24_ratio','relvol20']].notna().all(axis=1)\n"
                  "    s=s.where(ready,np.nan)\n"
                  "    sm = s.rolling(3,min_periods=3).mean()")
          if old not in patched: raise SystemExit('LAB001 router warmup anchor missing')
          patched=patched.replace(old,warmup,1); compile(patched,str(p),'exec'); p.write_text(patched)
          q=Path('labs/XAU_CONTEXT_STATE_TIMESCALE_AND_LABEL_PURIFICATION_LAB_008/run_lab.py')
          qs=q.read_text()
          oldq="    d['raw_winner'] = score_arr.idxmax(axis=1).str.replace('score_', '', regex=False).str.upper()"
          newq=("    valid_scores = score_arr.notna().any(axis=1)\n"
                "    d['raw_winner'] = pd.Series(index=d.index, dtype='object')\n"
                "    d.loc[valid_scores, 'raw_winner'] = score_arr.loc[valid_scores].idxmax(axis=1).str.replace('score_', '', regex=False).str.upper()")
          if oldq not in qs: raise SystemExit('LAB008 raw_winner anchor missing')
          qpatched=qs.replace(oldq,newq,1); compile(qpatched,str(q),'exec'); q.write_text(qpatched)

          # Technical-only Python 3.12 importlib/dataclass hotfix for LAB002 dynamic import.
          r=Path('labs/XAU_CONTEXT_BROAD_PARENT_PERMISSION_AND_M15_OR_EXECUTION_LAB_002/run_lab.py')
          rs=r.read_text()
          old_import="import argparse, hashlib, importlib.util, json"
          new_import="import argparse, hashlib, importlib.util, json, sys"
          old_exec="    mod=importlib.util.module_from_spec(spec); assert spec.loader is not None\n    spec.loader.exec_module(mod); return mod"
          new_exec="    mod=importlib.util.module_from_spec(spec); assert spec.loader is not None\n    sys.modules[name]=mod\n    spec.loader.exec_module(mod); return mod"
          if old_import not in rs or old_exec not in rs: raise SystemExit('LAB002 import hotfix anchor missing')
          rs=rs.replace(old_import,new_import,1).replace(old_exec,new_exec,1)

          # Performance-only hotfix: same closed M15 history, O(log N) lookup instead of O(N) boolean scan per fill.
          old_hist="    hist=m15[m15.index<ft].tail(8)"
          new_hist="    pos=int(m15.index.searchsorted(ft,side='left')); hist=m15.iloc[max(0,pos-8):pos]"
          if old_hist not in rs: raise SystemExit('LAB002 m15 lookup hotfix anchor missing')
          rs=rs.replace(old_hist,new_hist,1)

          # Performance-only hotfix: find the first exit-event M1 row vectorially, then preserve identical within-row priority.
          old_loop="""    i=mf.left(ft); j=mf.left(deadline)\n    exit_time=None; exit_price=None; reason=None\n    for k in range(i,min(j,len(mf.t))):\n        o,h,l=float(mf.o[k]),float(mf.h[k]),float(mf.l[k]); rt=pd.Timestamp(mf.t[k])\n        if o<=sl: exit_time,exit_price,reason=rt,o,'SL_GAP'; break\n        if o>=tp: exit_time,exit_price,reason=rt,o,'TP_GAP'; break\n        hit_sl=l<=sl; hit_tp=h>=tp\n        if hit_sl and hit_tp: exit_time,exit_price,reason=rt,sl,'SL_AMBIG'; break\n        if hit_sl: exit_time,exit_price,reason=rt,sl,'SL'; break\n        if hit_tp: exit_time,exit_price,reason=rt,tp,'TP'; break\n    if exit_time is None:\n"""
          new_loop="""    i=mf.left(ft); j=min(mf.left(deadline),len(mf.t))\n    exit_time=None; exit_price=None; reason=None\n    if i<j:\n        oo=mf.o[i:j]; hh=mf.h[i:j]; ll=mf.l[i:j]\n        evt=(oo<=sl)|(oo>=tp)|(ll<=sl)|(hh>=tp)\n        hit=np.flatnonzero(evt)\n        if len(hit):\n            k=i+int(hit[0]); o,h,l=float(mf.o[k]),float(mf.h[k]),float(mf.l[k]); rt=pd.Timestamp(mf.t[k])\n            if o<=sl: exit_time,exit_price,reason=rt,o,'SL_GAP'\n            elif o>=tp: exit_time,exit_price,reason=rt,o,'TP_GAP'\n            elif l<=sl and h>=tp: exit_time,exit_price,reason=rt,sl,'SL_AMBIG'\n            elif l<=sl: exit_time,exit_price,reason=rt,sl,'SL'\n            elif h>=tp: exit_time,exit_price,reason=rt,tp,'TP'\n    if exit_time is None:\n"""
          if old_loop not in rs: raise SystemExit('LAB002 exit-loop hotfix anchor missing')
          rs=rs.replace(old_loop,new_loop,1)
          compile(rs,str(r),'exec'); r.write_text(rs)
          PY
      - name: Run frozen LAB002
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          python -m py_compile labs/XAU_CONTEXT_BROAD_PARENT_PERMISSION_AND_M15_OR_EXECUTION_LAB_002/run_lab.py
          python labs/XAU_CONTEXT_BROAD_PARENT_PERMISSION_AND_M15_OR_EXECUTION_LAB_002/run_lab.py \
            --xau-m1 data/XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv \
            --out "$OUTDIR"
      - name: Persist outputs
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py labs/XAU_CONTEXT_STATE_TIMESCALE_AND_LABEL_PURIFICATION_LAB_008/run_lab.py labs/XAU_CONTEXT_BROAD_PARENT_PERMISSION_AND_M15_OR_EXECUTION_LAB_002/run_lab.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTDIR"
          git diff --cached --quiet || git commit -m 'Persist XAU broad parent permission LAB002 outputs'
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: xau-context-broad-parent-permission-lab002
          path: ${{ env.OUTDIR }}
