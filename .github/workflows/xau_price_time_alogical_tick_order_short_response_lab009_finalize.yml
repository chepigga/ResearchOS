name: XAU Alogical LAB009 Finalize

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'XAU ALOGICAL LAB009 FINALIZE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Download saved exact replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p INPUT Results_XAU_ALOGICAL_LAB009_FINAL
          gh run download 33245644124 --repo chepigga/ResearchOS --name xau-price-time-alogical-tick-order-short-response-lab009 --dir INPUT
          ls -lh INPUT
      - name: Finalize exact-tick verdict
        run: |
          python research/xau_price_time_alogical_tick_order_short_response_lab009_finalize.py \
            --summary INPUT/config_year_exact_summary.csv \
            --candidates INPUT/pre2026_m1_ambiguity_candidates.csv \
            --outdir Results_XAU_ALOGICAL_LAB009_FINAL
      - name: Comment result
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          o=Path('Results_XAU_ALOGICAL_LAB009_FINAL'); v=json.loads((o/'verdict.json').read_text()); c=pd.read_csv(o/'candidate_transfer_exact.csv')
          b=v['best_exact_config']; lines=['## XAU ALOGICAL LAB009 — EXACT TICK FINAL',f"**Verdict:** `{v['verdict']}`",f"**Candidates:** {v['m1_pre2026_candidate_configs']}",f"**Positive train configs:** {v['positive_train_configs']}",f"**Locked before 2026:** {v['locked_configs_before_2026']}",'','**Best exact config:**','```json',json.dumps(b,indent=2),'```','','**Top exact candidates:**','```',c[['config_id','train_n','train_mean_R','train_pf','val_n','val_mean_R','val_pf','final_n','final_mean_R','final_pf']].head(10).to_string(index=False),'```']
          (o/'issue_comment.md').write_text('\n'.join(lines))
          PY
          gh issue comment "$ISSUE_NUMBER" --repo chepigga/ResearchOS --body-file Results_XAU_ALOGICAL_LAB009_FINAL/issue_comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: xau-alogical-lab009-final
          path: Results_XAU_ALOGICAL_LAB009_FINAL/
          retention-days: 30
