name: LAB015 BUY SCORE6 replication sizing
on:
  pull_request:
    branches: [lab-btc-unified-lifecycle]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Download frozen M5 and M1
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
          test "$(sha256sum btc_5m.zip | awk '{print $1}')" = "13188498f1f9eadc98550237590734bf65ec865ebe927458301d038e533858bd"
          curl -L --fail --retry 3 -o btc_1m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_1m.zip
          test "$(sha256sum btc_1m.zip | awk '{print $1}')" = "4339abbd8d23a0ee84afa4187a41be2fd41d219060e1751053b152757be9a7ea"
          mkdir -p m5 m1 && unzip -q btc_5m.zip -d m5 && unzip -q btc_1m.zip -d m1
      - name: Frozen SCORE6 replication and sizing
        run: |
          python - <<'PY'
          import glob, pandas as pd, numpy as np, os, json
          COST_USD=27.5
          START='2024-01-01'; END='2026-08-10 05:59'
          def load(folder):
              x=pd.concat([pd.read_csv(f) for f in glob.glob(folder+'/**/*.csv',recursive=True)],ignore_index=True)
              x['time']=pd.to_datetime(x['time'],utc=True).dt.tz_convert(None)
              x=x.sort_values('time').drop_duplicates('time').reset_index(drop=True)
              for c in ['open','high','low','close','taker_ratio']:
                  if c in x: x[c]=pd.to_numeric(x[c],errors='coerce')
              return x
          def pf(v):
              s=pd.Series(v).dropna(); gp=s[s>0].sum(); gl=-s[s<0].sum(); return float(gp/gl) if gl>0 else float('inf')
          def maxdd(v):
              c=np.cumsum(np.asarray(v,float)); peak=np.maximum.accumulate(np.r_[0,c]); cc=np.r_[0,c]; return float(np.max(peak-cc))
          m5=load('m5'); m1=load('m1')
          m5['trend12h_ret']=m5.close/m5.close.shift(144)-1
          m5['pullback15']=m5.close<m5.close.shift(3)
          m5['tr15']=m5.taker_ratio.rolling(3,min_periods=3).mean()
          m5['setup']=(m5.trend12h_ret>=0.002)&m5.pullback15&(m5.tr15<0.50)&(m5.close>m5.high.shift(1))&(m5.time.dt.hour!=19)
          ep=m5[(m5.time>=pd.Timestamp(START))&(m5.time<=pd.Timestamp(END))&m5.setup].copy()
          h=m1.set_index('time').resample('1h',label='left',closed='left').agg({'open':'first','high':'max','low':'min','close':'last'}).dropna().reset_index()
          h['close_time']=h.time+pd.Timedelta(hours=1); pc=h.close.shift(); tr=pd.concat([h.high-h.low,(h.high-pc).abs(),(h.low-pc).abs()],axis=1).max(axis=1); h['atr14']=tr.ewm(alpha=1/14,adjust=False,min_periods=14).mean()
          rows=[]
          for idx,r in ep.iterrows():
              bt=r.time; avail=bt+pd.Timedelta(minutes=5); level=float(m5.loc[idx-1,'high']); bh=float(r.high)
              z5=m5[(m5.time>=avail)&(m5.time<=bt+pd.Timedelta(hours=12))]
              rr=z5[(z5.low<=level)&(z5.close>=level)]; sp=z5[z5.close>bh]
              if len(rr)==0 or len(sp)==0: continue
              rt=rr.iloc[0].time; z1=m1[(m1.time>=avail)&(m1.time<rt+pd.Timedelta(minutes=5))]; hit=z1[z1.low<=level]
              if len(hit)==0: continue
              ft=hit.iloc[0].time; hh=h[h.close_time<=ft].tail(1)
              if len(hh)==0 or not np.isfinite(hh.iloc[0].atr14): continue
              stopdist=1.5*float(hh.iloc[0].atr14); sl=level-stopdist; tp=level+1.5*stopdist; costR=COST_USD/stopdist
              path=m1[(m1.time>=ft)&(m1.time<=ft+pd.Timedelta(hours=48))].copy()
              if len(path)<31: continue
              ah=path.high.to_numpy(float); al=path.low.to_numpy(float); ac=path.close.to_numpy(float)
              sh=np.flatnonzero(al<=sl); th=np.flatnonzero(ah>=tp); is_=int(sh[0]) if len(sh) else 10**18; it=int(th[0]) if len(th) else 10**18
              if it<is_: finalR=1.5-costR; ex='TP'; exit_time=path.iloc[it].time
              elif is_<it: finalR=-1.0-costR; ex='SL'; exit_time=path.iloc[is_].time
              else: finalR=(ac[-1]-level)/stopdist-costR; ex='TIME'; exit_time=path.iloc[-1].time
              dt=ft+pd.Timedelta(minutes=30)
              if exit_time<=dt: continue
              q=m1[(m1.time>=ft)&(m1.time<dt)].copy()
              if len(q)<30: continue
              chunks=[]
              for k in range(6):
                  z=q.iloc[k*5:(k+1)*5]
                  chunks.append(dict(open=float(z.iloc[0].open),high=float(z.high.max()),low=float(z.low.min()),close=float(z.iloc[-1].close),taker=float(z.taker_ratio.mean())))
              c5=pd.DataFrame(chunks); c15=[]
              for k in range(2):
                  z=c5.iloc[k*3:(k+1)*3]; c15.append(dict(open=float(z.iloc[0].open),high=float(z.high.max()),low=float(z.low.min()),close=float(z.iloc[-1].close),taker=float(z.taker.mean())))
              c15=pd.DataFrame(c15)
              last_close_above=bool(c5.iloc[-1].close>=level)
              majority_above=bool((c5.close>=level).mean()>=0.5)
              m15_accept=bool(c15.iloc[-1].close>=level)
              higher_low=bool(c5.iloc[3:].low.min()>c5.iloc[:3].low.min())
              positive_eff=bool(c5.iloc[-1].close>c5.iloc[0].open)
              flow_buy=bool(c5.iloc[3:].taker.mean()>0.50)
              score=sum([last_close_above,majority_above,m15_accept,higher_low,positive_eff,flow_buy])
              mark=float(q.iloc[-1].close)
              f=m1[(m1.time>=dt)&(m1.time<=ft+pd.Timedelta(hours=48))].copy(); fh=f.high.to_numpy(float); fl=f.low.to_numpy(float); fc=f.close.to_numpy(float)
              sh=np.flatnonzero(fl<=sl); th=np.flatnonzero(fh>=tp); is2=int(sh[0]) if len(sh) else 10**18; it2=int(th[0]) if len(th) else 10**18
              if it2<is2: forwardR=(tp-mark)/stopdist
              elif is2<it2: forwardR=(sl-mark)/stopdist
              else: forwardR=(fc[-1]-mark)/stopdist if len(fc) else np.nan
              add_costR=costR
              # add-on at 30m mark, same structural stop/TP, new cost
              if it2<is2: addR=(tp-mark)/stopdist-add_costR
              elif is2<it2: addR=(sl-mark)/stopdist-add_costR
              else: addR=(fc[-1]-mark)/stopdist-add_costR if len(fc) else np.nan
              rows.append(dict(trigger_time=bt,fill_time=ft,year=ft.year,level=level,mark30=mark,score=score,score6=(score==6),finalR=finalR,forwardR=forwardR,addR=addR,costR=costR,exit_kind=ex))
          a=pd.DataFrame(rows).sort_values('fill_time').reset_index(drop=True)
          print('SURVIVOR_UNIVERSE',len(a))
          print('BASE_SURV_EV',float(a.finalR.mean()),'PF',pf(a.finalR),'MAXDD',maxdd(a.finalR))
          s=a[a.score6].copy(); print('SCORE6_N',len(s),'EV',float(s.finalR.mean()),'PF',pf(s.finalR),'FWD_EV',float(s.forwardR.mean()),'FWD_PF',pf(s.forwardR),'ADD_EV',float(s.addR.mean()),'ADD_PF',pf(s.addR))
          print('\nYEARLY_SCORE6')
          yearly=[]
          for y,g in s.groupby('year'):
              d=dict(year=int(y),N=len(g),EV=float(g.finalR.mean()),PF=pf(g.finalR),forward_EV=float(g.forwardR.mean()),forward_PF=pf(g.forwardR),add_EV=float(g.addR.mean()),add_PF=pf(g.addR)); yearly.append(d); print(d)
          # frozen sizing policies on all survivor events
          # P0: 0.25% base only
          # P1: 0.25% base + 0.125% add-on at SCORE6
          # P2: 0.25% base + 0.25% add-on at SCORE6
          # P3: 0.125% base + 0.125% add-on at SCORE6 (full 0.25% only after confirmation)
          policies={
            'BASE_025': 0.25*a.finalR,
            'BASE025_ADD0125': 0.25*a.finalR + np.where(a.score6,0.125*a.addR,0.0),
            'BASE025_ADD025': 0.25*a.finalR + np.where(a.score6,0.25*a.addR,0.0),
            'BASE0125_ADD0125': 0.125*a.finalR + np.where(a.score6,0.125*a.addR,0.0),
          }
          prows=[]
          for name,v in policies.items():
              d=dict(policy=name,N=len(a),sum_pct=float(np.nansum(v)),EV_pct_per_event=float(np.nanmean(v)),PF=pf(v),MaxDD_pct=maxdd(v)); prows.append(d); print('POLICY',d)
          # yearly policy transfer
          print('\nYEARLY_POLICIES')
          ypol=[]
          for y,g in a.groupby('year'):
              idx=g.index
              for name,v in policies.items():
                  z=np.asarray(v)[idx]
                  d=dict(year=int(y),policy=name,N=len(z),sum_pct=float(np.nansum(z)),EV_pct_per_event=float(np.nanmean(z)),PF=pf(z),MaxDD_pct=maxdd(z)); ypol.append(d); print(d)
          # SCORE6 tail stress
          ss=s.sort_values('finalR',ascending=False)
          for pct in [0.01,0.03,0.05]:
              k=max(1,int(np.ceil(len(ss)*pct))); z=ss.iloc[k:]; print('S6_REMOVE',pct,'N',len(z),'EV',float(z.finalR.mean()),'PF',pf(z.finalR),'FWD_EV',float(z.forwardR.mean()),'FWD_PF',pf(z.forwardR),'ADD_EV',float(z.addR.mean()),'ADD_PF',pf(z.addR))
          # weekly bootstrap SCORE6 forward
          s['week']=s.fill_time.dt.to_period('W').astype(str); w=s.groupby('week').forwardR.sum().to_numpy(float); rng=np.random.default_rng(15015); boots=np.array([rng.choice(w,size=len(w),replace=True).mean() for _ in range(20000)]); print('S6_FWD_BOOT',float(np.quantile(boots,.025)),float(np.quantile(boots,.975)),float((boots>0).mean()),'weeks',len(w))
          os.makedirs('lab015',exist_ok=True); a.to_csv('lab015/replication_ledger.csv',index=False); pd.DataFrame(yearly).to_csv('lab015/yearly_score6.csv',index=False); pd.DataFrame(prows).to_csv('lab015/sizing_policies.csv',index=False); pd.DataFrame(ypol).to_csv('lab015/yearly_policies.csv',index=False)
          summary={'survivor_N':len(a),'score6_N':len(s),'score6_EV':float(s.finalR.mean()),'score6_PF':pf(s.finalR),'score6_forward_EV':float(s.forwardR.mean()),'score6_forward_PF':pf(s.forwardR),'score6_add_EV':float(s.addR.mean()),'score6_add_PF':pf(s.addR),'score6_fwd_boot_ci':[float(np.quantile(boots,.025)),float(np.quantile(boots,.975))],'score6_fwd_boot_pgt0':float((boots>0).mean())}
          json.dump(summary,open('lab015/summary.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lab015-buy-score6-replication-sizing
          path: lab015/
