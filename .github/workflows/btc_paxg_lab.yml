name: BTC PAXG Cross Asset LAB 001

on:
  push:
    branches:
      - lab/btc-paxg-cross-asset-001
    paths:
      - 'labs/BTC_PAXG_CROSS_ASSET_DIVERGENCE_AND_RESPONSE_LAB_001/run_lab.py'
      - '.github/workflows/btc_paxg_lab.yml'

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-paxg-cross-asset-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q numpy pandas requests scikit-learn
      - name: Run frozen lab
        run: python labs/BTC_PAXG_CROSS_ASSET_DIVERGENCE_AND_RESPONSE_LAB_001/run_lab.py
      - name: Commit lab outputs
        run: |
          git config user.name "ResearchOS LAB Bot"
          git config user.email "researchos-lab@users.noreply.github.com"
          git add labs/BTC_PAXG_CROSS_ASSET_DIVERGENCE_AND_RESPONSE_LAB_001/output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "LAB001: BTC PAXG cross-asset causal results"
            git push origin HEAD:lab/btc-paxg-cross-asset-001
          fi
