name: CrowdFade LAB083 score sign flip driver
on:
  workflow_dispatch:
  push:
    branches:
      - lab/crowdfade-execution-5y-positive-005
    paths:
      - labs/CROWDFADE_SCORE_SIGN_FLIP_DRIVER_LAB_083/**
      - .github/workflows/crowdfade-lab083.yml
permissions:
  contents: write
jobs:
  lab083:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/crowdfade-execution-5y-positive-005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas scipy tabulate
      - run: python labs/CROWDFADE_SCORE_SIGN_FLIP_DRIVER_LAB_083/run.py
      - run: |
          git config user.name ResearchOS
          git config user.email researchos@example.com
          git add labs/CROWDFADE_SCORE_SIGN_FLIP_DRIVER_LAB_083/output/
          git diff --cached --quiet || (git commit -m "LAB083 outputs" && git push origin HEAD:lab/crowdfade-execution-5y-positive-005)
