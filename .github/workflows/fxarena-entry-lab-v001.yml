name: FXArena Entry Lab v001

on:
  push:
    branches:
      - agent/entry-lab-v001
  pull_request:
    branches:
      - research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy
      - name: Download exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _entry_inputs
          gh release download v1.0 --dir _entry_inputs --pattern 'EURUSD_M1_202301020005_202607172354.csv'
          gh release download v1.0 --dir _entry_inputs --pattern 'FXArena_LevelBattleLevels_v003_EVENT_STREAM_EURUSD_M5.csv'
          gh release download v1.0 --dir _entry_inputs --pattern 'FXArena_LevelBattleRounds_v003_EVENT_STREAM_EURUSD_M5.csv'
          gh release download v.1.1 --dir _entry_inputs --pattern 'FXArena_Release_v1.1_COMPLETE.zip'
      - name: Materialize frozen runner and specification
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > run_entry_lab_v001.py
          echo '' | base64 -d | gzip -d > FXArena_EntryLab_TZ_v001_2026-07-24.md
          python -m py_compile run_entry_lab_v001.py
      - name: Run frozen tournament
        shell: bash
        run: |
          set -o pipefail
          python run_entry_lab_v001.py 2>&1 | tee EntryLab_RUN_LOG.txt
          cp EntryLab_RUN_LOG.txt FXArena_EntryLab_v001_output/
      - name: Finalize manifest after log copy
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,pandas as pd
          from pathlib import Path
          out=Path('FXArena_EntryLab_v001_output'); rows=[]
          for p in sorted(out.iterdir()):
              if p.is_file() and p.name!='MANIFEST_SHA256.csv':
                  h=hashlib.sha256()
                  with open(p,'rb') as f:
                      for b in iter(lambda:f.read(1<<20),b''):h.update(b)
                  rows.append({'file':p.name,'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          pd.DataFrame(rows).to_csv(out/'MANIFEST_SHA256.csv',index=False)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FXArena-EntryLab-v001-output
          path: FXArena_EntryLab_v001_output/
          if-no-files-found: error
