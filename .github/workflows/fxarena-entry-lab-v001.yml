name: FXArena Entry Lab v001

on:
  push:
    branches:
      - agent/entry-lab-v001
  pull_request:
    branches:
      - research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _entry_inputs entry_lab_schema
          gh release download v1.0 --dir _entry_inputs --pattern 'EURUSD_M1_202301020005_202607172354.csv'
          gh release download v1.0 --dir _entry_inputs --pattern 'FXArena_LevelBattleLevels_v003_EVENT_STREAM_EURUSD_M5.csv'
          gh release download v1.0 --dir _entry_inputs --pattern 'FXArena_LevelBattleRounds_v003_EVENT_STREAM_EURUSD_M5.csv'
          gh release download v.1.1 --dir _entry_inputs --pattern 'FXArena_Release_v1.1_COMPLETE.zip'
      - name: Inspect schemas and coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,zipfile,hashlib
          from pathlib import Path
          import pandas as pd
          root=Path('_entry_inputs'); out=Path('entry_lab_schema')
          files={p.name:p for p in root.iterdir() if p.is_file()}
          report={}
          for name,p in files.items():
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              report[name]={'bytes':p.stat().st_size,'sha256':h}
          for name in ['EURUSD_M1_202301020005_202607172354.csv','FXArena_LevelBattleLevels_v003_EVENT_STREAM_EURUSD_M5.csv','FXArena_LevelBattleRounds_v003_EVENT_STREAM_EURUSD_M5.csv']:
              p=files[name]
              df=pd.read_csv(p,nrows=5,sep=None,engine='python')
              report[name]['columns']=list(df.columns)
              report[name]['head']=df.to_dict('records')
              with open(p,'rb') as f:
                  report[name]['header_raw']=f.readline().decode('utf-8','replace').strip()
          z=files['FXArena_Release_v1.1_COMPLETE.zip']
          with zipfile.ZipFile(z) as zz:
              report[z.name]['members']=[{'name':x.filename,'bytes':x.file_size} for x in zz.infolist()]
          out.mkdir(exist_ok=True)
          (out/'schema_report.json').write_text(json.dumps(report,indent=2,default=str))
          with open(out/'headers.txt','w') as f:
              for n,r in report.items():
                  f.write(f'## {n}\nbytes={r.get("bytes")}\nsha256={r.get("sha256")}\n')
                  if 'header_raw' in r:f.write(r['header_raw']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FXArena-EntryLab-v001-schema
          path: entry_lab_schema/
          if-no-files-found: error
