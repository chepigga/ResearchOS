name: FXArena Entry Lab v001

on:
  push:
    branches:
      - agent/entry-lab-v001
  pull_request:
    branches:
      - research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-replay-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Release v1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _entry_inputs replay_sources
          gh release download v.1.1 --dir _entry_inputs --pattern 'FXArena_Release_v1.1_COMPLETE.zip'
      - name: Extract small frozen source files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile,io,json
          from pathlib import Path
          src=Path('_entry_inputs/FXArena_Release_v1.1_COMPLETE.zip')
          out=Path('replay_sources'); out.mkdir(exist_ok=True)
          inv={}
          with zipfile.ZipFile(src) as z:
              for zi in z.infolist():
                  name=zi.filename
                  if name.endswith(('.py','.md','.json')) and zi.file_size<5_000_000:
                      (out/Path(name).name).write_bytes(z.read(name))
                  if name.endswith('.zip'):
                      raw=z.read(name)
                      try:
                          with zipfile.ZipFile(io.BytesIO(raw)) as nz:
                              inv[name]=[{'name':x.filename,'bytes':x.file_size} for x in nz.infolist()]
                              for x in nz.infolist():
                                  low=x.filename.lower()
                                  if x.file_size<5_000_000 and low.endswith(('.py','.md','.json','.txt')):
                                      dst=out/(Path(name).stem+'__'+Path(x.filename).name)
                                      dst.write_bytes(nz.read(x.filename))
                      except Exception as e:
                          inv[name]={'error':repr(e)}
          (out/'nested_inventory.json').write_text(json.dumps(inv,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FXArena-EntryLab-v001-replay-sources
          path: replay_sources/
          if-no-files-found: error
