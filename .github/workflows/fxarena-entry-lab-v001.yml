name: FXArena Entry Lab v001

on:
  push:
    branches:
      - agent/entry-lab-v001
  pull_request:
    branches:
      - research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p entry_lab_inputs
          gh release download v1.0 --dir entry_lab_inputs --pattern 'EURUSD_M1_202301020005_202607172354.csv'
          gh release download v1.0 --dir entry_lab_inputs --pattern 'FXArena_LevelBattleLevels_v003_EVENT_STREAM_EURUSD_M5.csv'
          gh release download v1.0 --dir entry_lab_inputs --pattern 'FXArena_LevelBattleRounds_v003_EVENT_STREAM_EURUSD_M5.csv'
          gh release download v.1.1 --dir entry_lab_inputs --pattern 'FXArena_Release_v1.1_COMPLETE.zip'
          cp Projects/FXArena/Labs/EntryLab_v001/P4b_tb_flags_fixture.json entry_lab_inputs/
          sha256sum entry_lab_inputs/* > entry_lab_inputs/SOURCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FXArena-EntryLab-v001-exact-inputs
          path: entry_lab_inputs/
          if-no-files-found: error
          compression-level: 6
