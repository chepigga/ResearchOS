name: LAB134 Engine A Plus B3 Portfolio
on:
  push:
    branches: [lab/lab134-engine-a-plus-b3-portfolio-20261008]
    paths: ['.github/workflows/lab134_engine_a_plus_b3_portfolio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab134-engine-a-plus-b3-portfolio-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB134
        run: python labs/LAB134_ENGINE_A_PLUS_B3_PORTFOLIO_20261008/run_lab134.py
      - run: cat lab134_out/LAB134_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab134-engine-a-plus-b3-portfolio
          path: lab134_out
