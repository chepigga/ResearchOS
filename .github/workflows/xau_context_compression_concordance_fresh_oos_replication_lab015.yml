name: XAU Context Compression Concordance Fresh OOS Replication LAB015

on:
  push:
    paths:
      - '.github/workflows/xau_context_compression_concordance_fresh_oos_replication_lab015.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab015:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAB_BRANCH: lab/xau-context-compression-concordance-fresh-oos-replication-015
      OUTDIR: labs/XAU_CONTEXT_COMPRESSION_CONCORDANCE_FRESH_OOS_REPLICATION_LAB_015/output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas numpy requests tabulate
      - name: Fetch frozen fresh-OOS XAU archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          gh release download xau --repo "${GITHUB_REPOSITORY}" --pattern 'CAUSAL_XAU_RAW_XAUUSD_20260825.zip' --dir data
          echo '31f9548204fa99c29ce7d09e5b64e01ff75f5e8e3efab6f747cbd410cf34fd2e  data/CAUSAL_XAU_RAW_XAUUSD_20260825.zip' | sha256sum -c -
      - name: Apply frozen Context runtime parity hotfixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py')
          s=p.read_text()
          patched=re.sub(r'd\.stack(?![A-Za-z0-9_])', "d['stack']", s)
          old="    sm = s.rolling(3,min_periods=3).mean()"
          warmup=("    ready=d[['ema200','atr_ratio','rsi14','adx14','range24_ratio','relvol20']].notna().all(axis=1)\n"
                  "    s=s.where(ready,np.nan)\n"
                  "    sm = s.rolling(3,min_periods=3).mean()")
          if old not in patched:
              raise SystemExit('LAB001 warmup anchor missing')
          patched=patched.replace(old,warmup,1)
          compile(patched,str(p),'exec'); p.write_text(patched)

          q=Path('labs/XAU_CONTEXT_STATE_TIMESCALE_AND_LABEL_PURIFICATION_LAB_008/run_lab.py')
          qs=q.read_text()
          oldq="    d['raw_winner'] = score_arr.idxmax(axis=1).str.replace('score_', '', regex=False).str.upper()"
          newq=("    valid_scores = score_arr.notna().any(axis=1)\n"
                "    d['raw_winner'] = pd.Series(index=d.index, dtype='object')\n"
                "    d.loc[valid_scores, 'raw_winner'] = score_arr.loc[valid_scores].idxmax(axis=1).str.replace('score_', '', regex=False).str.upper()")
          if oldq not in qs:
              raise SystemExit('LAB008 raw_winner anchor missing')
          qpatched=qs.replace(oldq,newq,1)
          compile(qpatched,str(q),'exec'); q.write_text(qpatched)
          print('Frozen runtime parity hotfixes applied')
          PY
      - name: Run preregistered LAB015
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          python -m py_compile labs/XAU_CONTEXT_COMPRESSION_CONCORDANCE_FRESH_OOS_REPLICATION_LAB_015/run_lab.py
          python labs/XAU_CONTEXT_COMPRESSION_CONCORDANCE_FRESH_OOS_REPLICATION_LAB_015/run_lab.py \
            --archive data/CAUSAL_XAU_RAW_XAUUSD_20260825.zip \
            --out "$OUTDIR"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('labs/XAU_CONTEXT_COMPRESSION_CONCORDANCE_FRESH_OOS_REPLICATION_LAB_015/output/summary.json').read_text())
          assert s['archive_sha256']=='31f9548204fa99c29ce7d09e5b64e01ff75f5e8e3efab6f747cbd410cf34fd2e'
          assert s['oos_start'].startswith('2026-07-24')
          print('LAB015 freshness/source audit OK')
          PY
      - name: Persist outputs
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py labs/XAU_CONTEXT_STATE_TIMESCALE_AND_LABEL_PURIFICATION_LAB_008/run_lab.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTDIR"
          git diff --cached --quiet || git commit -m 'Persist XAU Context fresh OOS concordance LAB015 outputs'
          git push origin HEAD:"$LAB_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: xau-context-fresh-oos-concordance-lab015
          path: ${{ env.OUTDIR }}
