name: GC AMP Feed Audit 001

on:
  push:
    branches:
      - gc-amp-feed-audit-001
    paths:
      - 'research/gc/amp_feed_audit_001.py'
      - '.github/workflows/gc_amp_feed_audit_001.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gc-amp-feed-audit-001

      - name: Run AMP GC feed audit
        run: python3 research/gc/amp_feed_audit_001.py

      - name: Commit audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gc/AMP_GC_FEED_AUDIT_001.md research/gc/AMP_GC_FEED_AUDIT_001.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Add AMP GC feed audit 001 report"
            git push origin HEAD:gc-amp-feed-audit-001
          fi
