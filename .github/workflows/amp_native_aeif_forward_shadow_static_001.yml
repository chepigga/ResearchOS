name: AMP Native AEIF Forward Shadow Static 001

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/mt5/**'
      - '.github/workflows/amp_native_aeif_forward_shadow_static_001.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
          fetch-depth: 0
      - name: Static freeze and zero-order audit
        run: python research/gc/mt5/shadow_static_audit_001.py
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/gc/mt5/SHADOW_BUILD_MANIFEST_001.json
          git diff --cached --quiet && exit 0
          git commit -m "Record AMP-native shadow build manifest"
          git push origin HEAD:gc-amp-feed-audit-001
