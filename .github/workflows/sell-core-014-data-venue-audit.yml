name: SELL CORE 014 Data Venue Audit
on:
  push:
    branches: [lab-btc-v283-market-clock-matrix]
    paths: ['.github/workflows/sell-core-014-data-venue-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/chepigga/ResearchOS/releases/assets/511572318 -H 'Accept: application/octet-stream' > binance_btc_flow.csv
          gh api /repos/chepigga/ResearchOS/releases/assets/511572188 -H 'Accept: application/octet-stream' > btc_1m.zip
      - name: Compare frozen M1 to futures/spot source
        run: |
          echo '--- frozen zip names/head ---'
          unzip -l btc_1m.zip | head -10
          unzip -p btc_1m.zip | head -5 || true
          echo '--- frozen futures H1 head around 2024 ---'
          grep '^2024.01.01 00:00' binance_btc_flow.csv | head -1 || true
          echo '--- Binance futures 1m 2024-01-01 00:00 UTC ---'
          python - <<'PY'
          import urllib.request,json,datetime as dt
          t=int(dt.datetime(2024,1,1,tzinfo=dt.timezone.utc).timestamp()*1000)
          for label,url in [
            ('FUT',f'https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1m&startTime={t}&limit=2'),
            ('SPOT',f'https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&startTime={t}&limit=2')]:
              try:
                with urllib.request.urlopen(url,timeout=30) as r: d=json.load(r)
                print(label,d[:2])
              except Exception as e: print(label,'ERR',e)
          PY
