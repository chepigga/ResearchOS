name: BTC Retail Flow Failure Recovery Reacceptance LAB030 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_retail_flow_failure_recovery_reacceptance_lab030_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab030:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-retail-flow-acceptance-origin-close2-failure-recovery-reacceptance-030
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download frozen Binance BTCUSDT M15 data
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_15m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_15m.zip
          echo '19acf95a3bb7a868fa1e6c8da8dbc73d4a2f7004b771e394bbee8e6c5b6e58b9  btc_15m.zip' | sha256sum -c -
          mkdir -p btc15
          unzip -q btc_15m.zip -d btc15
      - name: Run frozen LAB030 with parity/accounting fix
        run: python labs/BTC_RETAIL_FLOW_ACCEPTANCE_ORIGIN_CLOSE2_FAILURE_RECOVERY_AND_REACCEPTANCE_LAB_030/run_lab_v2.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_RETAIL_FLOW_ACCEPTANCE_ORIGIN_CLOSE2_FAILURE_RECOVERY_AND_REACCEPTANCE_LAB_030/output
          git commit -m 'Persist BTC retail flow failure recovery reacceptance LAB030 v2 outputs' || true
          git push origin HEAD:lab/btc-retail-flow-acceptance-origin-close2-failure-recovery-reacceptance-030
      - uses: actions/upload-artifact@v4
        with:
          name: btc-retail-flow-failure-recovery-reacceptance-lab030
          path: labs/BTC_RETAIL_FLOW_ACCEPTANCE_ORIGIN_CLOSE2_FAILURE_RECOVERY_AND_REACCEPTANCE_LAB_030/output
