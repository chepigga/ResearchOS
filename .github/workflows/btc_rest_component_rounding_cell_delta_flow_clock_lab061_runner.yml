name: BTC REST Component Rounding Cell Delta Flow Clock LAB061 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_rest_component_rounding_cell_delta_flow_clock_lab061_runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab061:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAB061 branch
        uses: actions/checkout@v4
        with:
          ref: lab/btc-rest-component-rounding-cell-delta-flow-clock-061
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas requests
      - name: Run LAB061
        run: python labs/BTC_REST_COMPONENT_ROUNDING_CELL_CAUSAL_DELTA_RECOVERY_AND_FLOW_CLOCK_PARITY_LAB_061/run_lab.py
      - name: Persist outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/BTC_REST_COMPONENT_ROUNDING_CELL_CAUSAL_DELTA_RECOVERY_AND_FLOW_CLOCK_PARITY_LAB_061/output
          git commit -m 'Persist BTC REST component rounding-cell LAB061 outputs' || true
          git push origin HEAD:lab/btc-rest-component-rounding-cell-delta-flow-clock-061
      - uses: actions/upload-artifact@v4
        with:
          name: BTC_REST_COMPONENT_ROUNDING_CELL_DELTA_FLOW_CLOCK_LAB061
          path: labs/BTC_REST_COMPONENT_ROUNDING_CELL_CAUSAL_DELTA_RECOVERY_AND_FLOW_CLOCK_PARITY_LAB_061/output
