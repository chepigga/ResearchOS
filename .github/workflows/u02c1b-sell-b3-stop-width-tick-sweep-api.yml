name: U02C1B SELL B3 Stop Width Tick Sweep API

on:
  push:
    branches: [lab-btc-unified-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy tabulate
      - name: Download frozen ledger via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/chepigga/ResearchOS/releases/assets/511572043 -H 'Accept: application/octet-stream' > continuation.csv
          test "$(sha256sum continuation.csv | awk '{print $1}')" = "6256b824c1e75b7170fa7f70aa4ae021cc44d4522397449eb083a2b310b6bb34"
      - name: Run sweep
        run: python research/u02c1_sell_b3_stop_width_tick_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: u02c1b-sell-b3-stop-width-tick-sweep
          path: u02c1/
