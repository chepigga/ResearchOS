name: LAB151 Concurrent MTM Prop-DD Replay
on:
  push:
    branches: [lab/lab151-concurrent-mtm-prop-dd-replay-20261009]
    paths: ['.github/workflows/lab151_concurrent_mtm_prop_dd_replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/lab151-concurrent-mtm-prop-dd-replay-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas
      - name: Download BTC data
        run: |
          curl -L --fail --retry 3 -o BTCUSDT_flow_2021-01-2026-08.csv.zip https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
          curl -L --fail --retry 3 -o btc_5m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_5m.zip
      - name: Run LAB151
        run: python labs/LAB151_CONCURRENT_MTM_PROP_DD_REPLAY_20261009/run_lab151.py
      - run: cat lab151_out/LAB151_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab151-concurrent-mtm-prop-dd-replay
          path: lab151_out
