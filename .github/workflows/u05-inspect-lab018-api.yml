name: U05 inspect LAB018 API

on:
  push:
    branches: [lab-btc-unified-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch frozen LAB018 report by asset id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o lab018.md \
            https://api.github.com/repos/chepigga/ResearchOS/releases/assets/511572093
          sha256sum lab018.md
          test "$(sha256sum lab018.md | awk '{print $1}')" = "14208154e04fbe13696071fa822adab7260e5a1373ada175cc97ce39814e6c24"
          cat lab018.md
