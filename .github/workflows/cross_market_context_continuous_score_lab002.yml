name: Cross Market Continuous Context LAB002

on:
  push:
    paths:
      - '.github/workflows/cross_market_context_continuous_score_lab002.yml'
      - 'labs/CROSS_MARKET_CAUSAL_CONTEXT_CONTINUOUS_SCORE_INTERACTION_LAB_002/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab002:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAB_BRANCH: lab/cross-market-context-continuous-score-002
      OUTDIR: labs/CROSS_MARKET_CAUSAL_CONTEXT_CONTINUOUS_SCORE_INTERACTION_LAB_002/output
      XAU_POOL: Projects/XAU_Pool/Results/XAU_POOL_SELECTION_LAB_001/v001/Artifacts/pool_excess.parquet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LAB_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -q pandas numpy pyarrow requests

      - name: Fetch canonical native XAU M1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          gh release view ak47 --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > /tmp/assets.txt
          ASSET="$(grep -E '^XAUUSD_M1_20220601_20260723_TICK_NATIVE\.csv(\.zip)?$' /tmp/assets.txt | head -n1 || true)"
          test -n "$ASSET"
          gh release download ak47 --repo "${GITHUB_REPOSITORY}" --pattern "$ASSET" --dir data
          if [[ "$ASSET" == *.zip ]]; then unzip -j "data/$ASSET" -d data; fi
          test -f data/XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv
          echo 'db47a0cef1e666fdf27a67a23fcc290eee1bd2be2c651ecd8e080b99bf177b9b  data/XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv' | sha256sum -c -

      - name: Apply inherited LAB001 stack-column runtime hotfix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py')
          s=p.read_text()
          old='d.stack.astype(float)'
          new="d['stack'].astype(float)"
          if old not in s:
              raise SystemExit('Expected inherited LAB001 stack collision string not found')
          p.write_text(s.replace(old,new))
          PY

      - name: Run preregistered LAB002
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          python labs/CROSS_MARKET_CAUSAL_CONTEXT_CONTINUOUS_SCORE_INTERACTION_LAB_002/run_lab.py \
            --xau-m1 data/XAUUSD_M1_20220601_20260723_TICK_NATIVE.csv \
            --xau-pool "$XAU_POOL" \
            --out "$OUTDIR"
          cat "$OUTDIR/REPORT.md"
          cat "$OUTDIR/summary.json"

      - name: Persist compact outputs
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- labs/CROSS_MARKET_CAUSAL_CONTEXT_ROUTER_LAB_001/run_lab.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTDIR"
          git diff --cached --quiet || git commit -m "Persist continuous Context LAB002 outputs"
          git push origin HEAD:"$LAB_BRANCH"

      - uses: actions/upload-artifact@v4
        with:
          name: cross-market-continuous-context-lab002
          path: ${{ env.OUTDIR }}
