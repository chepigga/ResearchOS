name: crowdfade-extension-veto-2026-lab007
on:
  push:
    branches: [ lab/crowdfade-execution-5y-positive-005 ]
    paths: ['labs/CROWDFADE_EXECUTION_EXTENSION_VETO_LAB_007/run_2026_stress.py','.github/workflows/crowdfade_extension_veto_2026_lab007.yml']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: lab/crowdfade-execution-5y-positive-005}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q numpy pandas
      - name: Download frozen seconds
        run: |
          ROOT=labs/CROWDFADE_EXECUTION_EXTENSION_VETO_LAB_007/stress_data;mkdir -p "$ROOT";cd "$ROOT"
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_sec.csv.zip
          wget -q https://github.com/chepigga/ResearchOS/releases/download/btc/BTCUSDT_flow_2021-01-2026-08.csv.zip
      - run: python labs/CROWDFADE_EXECUTION_EXTENSION_VETO_LAB_007/run_2026_stress.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/CROWDFADE_EXECUTION_EXTENSION_VETO_LAB_007/output/stress_2026_extension_veto.json
          git commit -m 'research(CrowdFade): LAB007 2026 extension-veto stress' || exit 0
          git push
