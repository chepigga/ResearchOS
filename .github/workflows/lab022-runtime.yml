name: LAB022 Runtime

on:
  push:
    branches: [lab022-runtime]

permissions:
  contents: read

jobs:
  lab022:
    runs-on: ubuntu-latest
    steps:
      - name: Install analysis dependencies
        run: python -m pip install --quiet pandas numpy
      - name: Download frozen LAB020 assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o events.csv https://github.com/chepigga/ResearchOS/releases/download/btc/BTC_M15_FVG_CONTINUATION_LAB_020_FREQ_MATCHED_EVENTS.csv
          curl -L --fail --retry 3 -o sensitivity.csv https://github.com/chepigga/ResearchOS/releases/download/btc/BTC_M15_FVG_CONTINUATION_LAB_020_FREQ_MATCHED_SENSITIVITY.csv
          sha256sum events.csv sensitivity.csv
      - name: Diagnose frozen SELL ST-age buckets
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd, numpy as np
          ev=pd.read_csv('events.csv'); s=pd.read_csv('sensitivity.csv')
          def pf(x):
              x=pd.to_numeric(x,errors='coerce').dropna(); gp=x[x>0].sum(); gl=-x[x<0].sum(); return gp/gl if gl>0 else np.inf
          st=s[s.feature.str.upper().eq('H4_ST_AGE_BARS')]
          cuts={}
          for side in ['BUY','SELL']:
              z=st[(st.side==side)&(st.part=='TRAIN_LE_2023')]
              cuts[side]=(float(z.q25.iloc[0]),float(z.q50.iloc[0]),float(z.q75.iloc[0]))
          def buck(r):
              q25,q50,q75=cuts[r.side]; v=r.H4_ST_AGE_BARS
              if pd.isna(v): return np.nan
              if v<=q25:return 'B1'
              if v<=q50:return 'B2'
              if v<=q75:return 'B3'
              return 'B4'
          ev['B']=ev.apply(buck,axis=1)
          print('=== SELL H4_ST_AGE ALL BUCKETS YEARLY ===')
          rows=[]
          for y in sorted(ev.year.unique()):
              for b in ['B1','B2','B3','B4']:
                  z=ev[(ev.year==y)&(ev.side=='SELL')&(ev.B==b)]
                  rows.append({'year':int(y),'bucket':b,'N':len(z),'EV':z.NET48_SPREAD_PCT.mean() if len(z) else np.nan,'PF':pf(z.NET48_SPREAD_PCT) if len(z) else np.nan,'stressEV':z.NET48_STRESS_PCT.mean() if len(z) else np.nan,'stressPF':pf(z.NET48_STRESS_PCT) if len(z) else np.nan})
          print(pd.DataFrame(rows).to_string(index=False))
          print('\n=== BUY H4_ST_AGE ALL BUCKETS YEARLY ===')
          rows=[]
          for y in sorted(ev.year.unique()):
              for b in ['B1','B2','B3','B4']:
                  z=ev[(ev.year==y)&(ev.side=='BUY')&(ev.B==b)]
                  rows.append({'year':int(y),'bucket':b,'N':len(z),'EV':z.NET48_SPREAD_PCT.mean() if len(z) else np.nan,'PF':pf(z.NET48_SPREAD_PCT) if len(z) else np.nan,'stressEV':z.NET48_STRESS_PCT.mean() if len(z) else np.nan})
          print(pd.DataFrame(rows).to_string(index=False))
          PY
