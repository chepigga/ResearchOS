name: BTC Retail Flow Extension Sequence Regime Split LAB033 Runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_retail_flow_extension_sequence_regime_split_lab033_runner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab033:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/btc-retail-flow-reacceptance-extension-sequence-latency-cycle-duration-regime-split-033
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy pandas scipy
      - name: Download frozen Binance BTCUSDT M15 data
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o btc_15m.zip https://github.com/chepigga/ResearchOS/releases/download/btc/btc_15m.zip
          echo '19acf95a3bb7a868fa1e6c8da8dbc73d4a2f7004b771e394bbee8e6c5b6e58b9  btc_15m.zip' | sha256sum -c -
          mkdir -p btc15
          unzip -q btc_15m.zip -d btc15
      - name: Run frozen LAB033 with exact acceptance-bar parity
        run: python labs/BTC_RETAIL_FLOW_REACCEPTANCE_EXTENSION_SEQUENCE_LATENCY_AND_CYCLE_DURATION_REGIME_SPLIT_LAB_033/run_lab_v2.py
      - name: Persist outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/BTC_RETAIL_FLOW_REACCEPTANCE_EXTENSION_SEQUENCE_LATENCY_AND_CYCLE_DURATION_REGIME_SPLIT_LAB_033/output
          git commit -m 'Persist BTC retail flow extension sequence regime split LAB033 v2 outputs' || true
          git push origin HEAD:lab/btc-retail-flow-reacceptance-extension-sequence-latency-cycle-duration-regime-split-033
      - uses: actions/upload-artifact@v4
        with:
          name: btc-retail-flow-extension-sequence-regime-split-lab033
          path: labs/BTC_RETAIL_FLOW_REACCEPTANCE_EXTENSION_SEQUENCE_LATENCY_AND_CYCLE_DURATION_REGIME_SPLIT_LAB_033/output
