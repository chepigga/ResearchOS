name: GC M1 Buyer Breakout Incremental OF Audit 005

on:
  push:
    branches: [gc-amp-feed-audit-001]
    paths:
      - 'research/gc/gc_m1_buyer_breakout_incremental_orderflow_audit_005.py'
      - '.github/workflows/gc_m1_buyer_breakout_incremental_orderflow_audit_005.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-amp-feed-audit-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - name: Run incremental order-flow audit
        run: python research/gc/gc_m1_buyer_breakout_incremental_orderflow_audit_005.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/gc/GC_M1_BUYER_BREAKOUT_INCREMENTAL_ORDERFLOW_AUDIT_005.json \
                  research/gc/GC_M1_BUYER_BREAKOUT_INCREMENTAL_ORDERFLOW_AUDIT_005.md \
                  research/gc/GC_M1_BUYER_BREAKOUT_INCREMENTAL_ORDERFLOW_AUDIT_005_PLACEBOS.csv
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Record incremental buyer-breakout order-flow audit 005'
            git push origin HEAD:gc-amp-feed-audit-001
          fi
